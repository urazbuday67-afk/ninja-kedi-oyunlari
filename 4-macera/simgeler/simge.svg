<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orman" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8a4e"/>
      <stop offset="0.55" stop-color="#1d5230"/>
      <stop offset="1" stop-color="#08130c"/>
    </linearGradient>
    <linearGradient id="govde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f07a24"/>
      <stop offset="0.6" stop-color="#c04e16"/>
      <stop offset="1" stop-color="#8a300e"/>
    </linearGradient>
  </defs>

  <!-- orman zemini -->
  <rect width="512" height="512" rx="96" fill="url(#orman)"/>
  <g opacity="0.35" fill="#0f3b23">
    <ellipse cx="70" cy="150" rx="80" ry="105"/>
    <ellipse cx="440" cy="130" rx="75" ry="100"/>
    <ellipse cx="255" cy="90" rx="90" ry="70"/>
  </g>
  <!-- güneş parıltısı -->
  <circle cx="150" cy="120" r="70" fill="#fff3b0" opacity="0.16"/>

  <!-- ORANGUTAN -->
  <g>
    <!-- uzun kollar -->
    <rect x="88" y="270" width="58" height="170" rx="29" fill="#8a3f18" stroke="#54200a" stroke-width="10"/>
    <rect x="366" y="270" width="58" height="170" rx="29" fill="#c25a20" stroke="#54200a" stroke-width="10"/>
    <!-- gövde -->
    <rect x="146" y="266" width="220" height="200" rx="80" fill="url(#govde)" stroke="#54200a" stroke-width="11"/>
    <ellipse cx="256" cy="392" rx="70" ry="66" fill="#e8a35c"/>
    <!-- saç tutamları -->
    <g fill="#d0561c">
      <circle cx="140" cy="176" r="44"/>
      <circle cx="198" cy="136" r="46"/>
      <circle cx="256" cy="122" r="48"/>
      <circle cx="314" cy="136" r="46"/>
      <circle cx="372" cy="176" r="44"/>
      <ellipse cx="256" cy="190" rx="152" ry="90"/>
    </g>
    <!-- yanak pedleri -->
    <ellipse cx="256" cy="238" rx="158" ry="112" fill="#b8501e" stroke="#54200a" stroke-width="11"/>
    <!-- yüz diski -->
    <ellipse cx="256" cy="240" rx="84" ry="92" fill="#e8b483"/>
    <!-- kaşlar -->
    <g stroke="#5c2b10" stroke-width="15" stroke-linecap="round">
      <line x1="200" y1="204" x2="238" y2="214"/>
      <line x1="312" y1="204" x2="274" y2="214"/>
    </g>
    <!-- gözler -->
    <ellipse cx="220" cy="243" rx="21" ry="23" fill="#fff8ee"/>
    <ellipse cx="292" cy="243" rx="21" ry="23" fill="#fff8ee"/>
    <circle cx="225" cy="243" r="12" fill="#2a1a10"/>
    <circle cx="297" cy="243" r="12" fill="#2a1a10"/>
    <circle cx="221" cy="237" r="4.5" fill="#fff"/>
    <circle cx="293" cy="237" r="4.5" fill="#fff"/>
    <!-- burun -->
    <circle cx="246" cy="278" r="6.5" fill="#a8663a"/>
    <circle cx="266" cy="278" r="6.5" fill="#a8663a"/>
    <!-- ağız -->
    <path d="M226 300 Q256 322 286 300" stroke="#7a3a18" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>

  <!-- MUZ (elinde) -->
  <g transform="translate(420 148) rotate(-20) scale(3.6)">
    <path d="M-11 5 Q-2 -12 12 -6 Q2 -2 -6 9 Z" fill="#ffd84d" stroke="#b8860b" stroke-width="1.6"/>
    <circle cx="12" cy="-6" r="2.4" fill="#6b4f1a"/>
  </g>
</svg>
