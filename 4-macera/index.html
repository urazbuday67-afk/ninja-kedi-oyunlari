var sahne = document.getElementById("sahne");
function tamEkranMi() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function tamEkranDegistir() {
  try {
    var p;
    if (!tamEkranMi()) { var a = sahne.requestFullscreen || sahne.webkitRequestFullscreen; if (a) p = a.call(sahne); }
    else { var k = document.exitFullscreen || document.webkitExitFullscreen; if (k) p = k.call(document); }
    if (p && p.catch) p.catch(function () {});
  } catch (e) {}
}

// ---------- ORTAK EKRAN MOTORU ----------
// Oyunun içi hep 800x600 kalır; burası o dünyayı ekrana en-boy oranını
// bozmadan sığdırır — telefonda da, tam ekranda da her şey görünür.
function olcuAyarla() {
  var alanG, alanY;
  if (tamEkranMi()) {
    alanG = window.innerWidth;
    alanY = window.innerHeight;
  } else {
    var ipucu = document.getElementById("ipucu");
    var altBosluk = (ipucu && ipucu.offsetParent !== null) ? (ipucu.offsetHeight + 22) : 0;
    alanG = window.innerWidth;
    alanY = window.innerHeight - altBosluk;
  }
  // tuval yan şeritlerle birlikte büyümüş olabilir; ölçek gerçek boyuta göre
  var tG = ekran.width, tY = ekran.height;
  var olcek = Math.min(alanG / tG, alanY / tY);
  if (!tamEkranMi()) olcek = Math.min(olcek, 1);
  ekran.style.width  = Math.round(tG * olcek) + "px";
  ekran.style.height = Math.round(tY * olcek) + "px";
}
window.addEventListener("resize", olcuAyarla);
document.addEventListener("fullscreenchange", olcuAyarla);
document.addEventListener("webkitfullscreenchange", olcuAyarla);
window.addEventListener("orientationchange", function () { setTimeout(olcuAyarla, 120); });
if (window.visualViewport) window.visualViewport.addEventListener("resize", olcuAyarla);
olcuAyarla();

var tamekranDugme = document.getElementById("tamekranDugme");

      e.preventDefault(); e.stopPropagation();
      sesiUyandir(); tamEkranDegistir();
    });
  }
}

//   SES  (dosya yok, kodla üretiliyor)
// ===========================================================
var sesMotoru = null, sesKapali = false;
function sesiUyandir() { if (!sesMotoru) { try { sesMotoru = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (sesMotoru && sesMotoru.state === "suspended") sesMotoru.resume(); }
function ton(frk, sure, tip, yuk, bitisFrk, gecikme) {
  if (!sesMotoru || sesKapali) return;
  var t = sesMotoru.currentTime + (gecikme || 0);
  var osc = sesMotoru.createOscillator(), g = sesMotoru.createGain();
  osc.type = tip || "sine"; osc.frequency.setValueAtTime(frk, t);
  if (bitisFrk) osc.frequency.exponentialRampToValueAtTime(bitisFrk, t + sure);
  g.gain.setValueAtTime(yuk || 0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
  osc.connect(g); g.connect(sesMotoru.destination); osc.start(t); osc.stop(t + sure);
}
function sesZipla()    { ton(420, 0.16, "square", 0.13, 720); }
function sesCiftZip()  { ton(620, 0.14, "square", 0.12, 980); }
function sesKon()      { ton(180, 0.07, "sine", 0.10, 120); }

function sesKalkan()   { ton(320, 0.20, "sine", 0.13, 640); }
function sesYansit()   { ton(900, 0.12, "square", 0.14, 1500); }
function sesDusmanOl() { ton(300, 0.16, "square", 0.14, 120); ton(160, 0.22, "sawtooth", 0.12, 60, 0.07); }
function sesHasar()    { ton(200, 0.22, "sawtooth", 0.18, 70); }

function ziplaBasla() {
  if (durum !== "oyun") return;
  if (oyuncu.yerde) {
    oyuncu.vy = -ZIPLAMA_GUCU; oyuncu.yerde = false; oyuncu.ciftHak = CIFT_ZIPLAMA;

function dusmanKutusu(d) { return { x: d.x - d.g / 2, y: d.y - d.yuk, g: d.g, yuk: d.yuk }; }
function kutuCarpisti(a, b) {

// Yere bıraktığın kakaya basan düşman yavaşlar (kayar gibi)
// Arının POPOSUNDAKİ İĞNE. Arının gövdesine dokunmak zararsız; canını yakan
// sadece bu küçük kutu. Arı hep sana bakar, iğne arkada kalır — ama çok
// yaklaşınca yönü kilitlenir, arı senin yanından geçerse iğne sana denk gelir.
function ariIgnesiKutusu(d) {
  var yon = d.bakis || 1;
  var my = d.y - d.yuk / 2;
  var x1 = d.x - yon * 28, x2 = d.x - yon * 13;
  return { x: Math.min(x1, x2), y: my - 7, g: Math.abs(x2 - x1), yuk: 18 };
}

// Uçamayan bir düşmanın ayağının altında zemin var mı? Yoksa düşer.
// (Yılan geğirmeden kaçarken boşlukların üstünden yürüyüp geçiyordu.)
function dusmanaYercekimi(d) {
  var eskiY = d.y, i, p;
  for (i = 0; i < aktifPlatformlar.length; i++) {
    p = aktifPlatformlar[i];
    if (d.x > p.x - 4 && d.x < p.x + p.g + 4 && eskiY >= p.y - 8 && eskiY <= p.y + 8) {
      d.y = p.y; d.vy = 0; d.yerde = true; return;      // zemin var, sağlam duruyor
    }
  }
  d.yerde = false;
  d.vy += YERCEKIMI;
  d.y += d.vy;
  for (i = 0; i < aktifPlatformlar.length; i++) {       // düşerken alttaki bir platforma konabilir
    p = aktifPlatformlar[i];
    if (d.vy > 0 && d.x > p.x && d.x < p.x + p.g && eskiY <= p.y && d.y >= p.y) {
      d.y = p.y; d.vy = 0; d.yerde = true; return;
    }
  }
  if (d.y > YUKSEKLIK + 120) dusmanaHasar(d, d.can + 99);   // uçuruma düştü
}

function kakayaBastiMi(d) {
  for (var i = 0; i < kakalar.length; i++) {
    var k = kakalar[i];
    if (Math.abs(k.x - d.x) < 30 && Math.abs(k.y - d.y) < 60) return true;
  }
  return false;
}

function dusmanlariGuncelle() {
  for (var i = 0; i < dusmanlar.length; i++) {
    var d = dusmanlar[i];
    if (d.olu) continue;
    d.sayac++;

    // YILAN KAKAYA DEĞERSE ÖLÜR. (Diğer düşmanlar sadece yavaşlar.)
    if (d.tip === "yilan" && kakayaBastiMi(d)) { dusmanaHasar(d, d.can + 99); continue; }

    // OSURUK BAYGINLIĞI: hiç kımıldamaz, saldırmaz, sana da zarar veremez
    if (d.bayilma > 0) {
      d.bayilma--;
      if (d.bayilma === 0) d.uyandi = true;
      continue;
    }

    // GEĞİRME KORKUSU: senden uzağa kaçar, saldırmaz

      if (d.x < d.bx - d.menzil) { d.x = d.bx - d.menzil; d.yon = 1; }
      if (d.x > d.bx + d.menzil) { d.x = d.bx + d.menzil; d.yon = -1; }
    }
    else if (d.tip === "ari") {
      d.y = d.by + Math.sin(d.sayac * 0.06) * (d.menzil * 0.35);
      if (uzaklik < ARI_MENZIL) {
        d.uyandi = true;
        // Çok yaklaşınca yön KİLİTLENİR: arı yanından geçip gider ve iğnesi
        // sana denk gelir. Yoksa iğne hep arkada kalır, hiç batmazdı.
        if (uzaklik > 26) d.bakis = oyuncu.x > d.x ? 1 : -1;
        d.x += (d.bakis || 1) * ARI_HIZ * kakaFrenI;
        d.y += (oyuncu.y - d.y) * 0.012;
      } else {
        d.x += Math.sin(d.sayac * 0.02) * 0.7;
        d.bakis = oyuncu.x > d.x ? 1 : -1;
      }
    }
    else if (d.tip === "maymun") {
      if (uzaklik < MAYMUN_MENZIL) {
        d.uyandi = true;
        if (d.sayac % MAYMUN_ARASI === 0) tasAt(d, oyuncu.x, oyuncu.y, TAS_HIZ);
      }
    }
    else if (d.tip === "goril") {
      gorilGuncelle(d, kakaFrenI);
    }

    // oyuncuya değme (bayılmışsa zararsız — üstünden geçebilirsin)
    if (d.bayilma <= 0 && kutuCarpisti(oyuncuKutusu(), dusmanKutusu(d))) {
      // ARI: gövdesine dokunmak zararsız, canını yakan sadece popodaki iğne
      var zararli = d.tip !== "ari" || kutuCarpisti(oyuncuKutusu(), ariIgnesiKutusu(d));
      if (oyuncu.kalkan > 0) {
        // kalkan düşmanı iter
        d.x += (d.x > oyuncu.x ? 1 : -1) * 6;
        if (d.tip !== "goril") dusmanaHasar(d, 1);
      } else if (zararli) {
        oyuncuyaHasar();
      }
    }
  }
}

function gorilGuncelle(d, kakaFren) {
  // yaklaş
  var fark = oyuncu.x - d.x;
  if (Math.abs(fark) > 70 && d.ozel <= 0) d.x += (fark > 0 ? 1 : -1) * GORIL_HIZ * (kakaFren || 1);
  if (d.ozel > 0) d.ozel--;

  // özel saldırılar
  if (d.sayac % GORIL_ARASI === 0 && d.ozel <= 0) {
    var secim = Math.floor(d.sayac / GORIL_ARASI) % 3;
    if (secim === 0) {
      // GÖĞÜS DÖVME → yere vurur, şok dalgası
      d.ozel = 60; d.ozelTip = "gogus";
      sarsintiVer(10);
      ton(120, 0.35, "sawtooth", 0.2, 50);
      for (var p = 0; p < 20; p++) toz(d.x + (Math.random() - 0.5) * 120, d.y, "#a08050");
      if (Math.abs(oyuncu.x - d.x) < 260 && oyuncu.yerde) {
        if (oyuncu.kalkan > 0) yazilarGoster("SAVUŞTURDUN!", "#6fe0a0");
        else oyuncuyaHasar();
      }
    } else if (secim === 1) {
      // TAŞ YAĞMURU
      d.ozel = 40; d.ozelTip = "tas";
      for (var t = 0; t < 3; t++) tasAt(d, oyuncu.x + (t - 1) * 90, oyuncu.y, TAS_HIZ * 0.9);
    } else {
      // ZIPLAYIP ÜSTÜNE ATLAMA
      d.ozel = 50; d.ozelTip = "zipla";
      d.vy = -13; d.yerde = false;
    }
  }
  // zıplama fiziği
  if (!d.yerde) {
    d.vy += YERCEKIMI;
    d.y += d.vy;
    d.x += (oyuncu.x - d.x) * 0.02;
    if (d.y >= d.by) {
      d.y = d.by; d.vy = 0; d.yerde = true;
      sarsintiVer(12); ton(100, 0.3, "sawtooth", 0.18, 40);
      for (var q = 0; q < 16; q++) toz(d.x + (Math.random() - 0.5) * 140, d.y, "#a08050");
    }
  }
}

// ===========================================================
//   MERMİLER
// ===========================================================
function mermileriGuncelle() {
  // oyuncunun muzları
  for (var i = atilanMuzlar.length - 1; i >= 0; i--) {
    var m = atilanMuzlar[i];
    m.x += m.vx; m.y += m.vy; m.vy += 0.13; m.aci += 0.35; m.omur--;
    var vurdu = false;
    for (var j = 0; j < dusmanlar.length; j++) {
      var d = dusmanlar[j];
      if (d.olu) continue;
      var k = dusmanKutusu(d);
      if (m.x > k.x && m.x < k.x + k.g && m.y > k.y && m.y < k.y + k.yuk) {
        dusmanaHasar(d, MUZ_HASAR); vurdu = true; break;
      }
    }
    if (vurdu || m.omur <= 0 || m.y > YUKSEKLIK + 100) {
      if (vurdu) patlama(m.x, m.y, "#ffd84d", 8);
      atilanMuzlar.splice(i, 1);
    }
  }
  // düşman taşları
  for (var t = dusmanMermileri.length - 1; t >= 0; t--) {
    var s = dusmanMermileri[t];
    s.x += s.vx; s.y += s.vy; s.vy += 0.09; s.aci += 0.2; s.omur--;
    var kutu = oyuncuKutusu();
    if (s.x > kutu.x && s.x < kutu.x + kutu.g && s.y > kutu.y && s.y < kutu.y + kutu.yuk) {
      if (oyuncu.kalkan > 0) {
        // KALKANLA SAVUŞTURMA — taş geri döner ve düşmana zarar verir!
        sesYansit();
        atilanMuzlar.push({ x: s.x, y: s.y, vx: -s.vx * 1.25, vy: -Math.abs(s.vy) * 0.5 - 1, omur: MUZ_OMUR, aci: 0, tas: true });
        yazilarGoster("GERİ YOLLADIN!", "#6fe0a0");
        dusmanMermileri.splice(t, 1);
        continue;
      }
      oyuncuyaHasar();
      dusmanMermileri.splice(t, 1);
      continue;
    }
    if (s.omur <= 0 || s.y > YUKSEKLIK + 120) dusmanMermileri.splice(t, 1);
  }
}

// ===========================================================
//   FİZİK
// ===========================================================
function fizik() {
  var yariB = BOYUT / 2;

  var yon = 0;
  // A ve D saldırı tuşu oldu; yürüme ok tuşlarıyla (ve telefonda ◀ ▶ ile)
  if (tuslar["ArrowLeft"] || solBasili) yon -= 1;
  if (tuslar["ArrowRight"] || sagBasili) yon += 1;
  if (yon !== 0) { oyuncu.vx = yon * YATAY_HIZ; oyuncu.bakis = yon; oyuncu.yuruyor = true; }
  else { oyuncu.vx = 0; oyuncu.yuruyor = false; }
  if (oyuncu.yuruyor && oyuncu.yerde) oyuncu.adimFazi += 0.22;

  oyuncu.vy += YERCEKIMI;
  if (oyuncu.vy > 22) oyuncu.vy = 22;

  var ayakOnce = oyuncu.y + yariB;
  oyuncu.x += oyuncu.vx;
  oyuncu.y += oyuncu.vy;

  if (oyuncu.x < yariB) { oyuncu.x = yariB; oyuncu.vx = 0; }

  var oncedenYerde = oyuncu.yerde;
  oyuncu.yerde = false;
  for (var i = 0; i < aktifPlatformlar.length; i++) {
    var p = aktifPlatformlar[i];
    var ayak = oyuncu.y + yariB;
    if (oyuncu.vy >= 0 &&
        oyuncu.x + yariB * 0.7 > p.x && oyuncu.x - yariB * 0.7 < p.x + p.g &&
        ayak >= p.y && ayakOnce <= p.y + 14) {
      oyuncu.y = p.y - yariB; oyuncu.vy = 0; oyuncu.yerde = true;
      if (!oncedenYerde) { oyuncuyuEz(0.18); sesKon(); for (var t = 0; t < 5; t++) toz(oyuncu.x, p.y); }
      break;
    }
  }

  // muz yeme — her MUZ_ESIGI tanede bir OSURUK hakkı
  for (var mi = 0; mi < muzlar.length; mi++) {
    var mz = muzlar[mi];
    if (mz.alindi) continue;
    if (Math.abs(mz.x - oyuncu.x) < 38 && Math.abs(mz.y - oyuncu.y) < 48) {
      mz.alindi = true; muzPuan += 1; yenenMuz++; sesToplama();
      oyuncu.yemeSure = YEME_SURESI;        // eline alıp ağzına atar
      patlama(mz.x, mz.y, "#ffd84d", 8);
      if (yenenMuz >= MUZ_ESIGI) {
        yenenMuz = 0; osurukHak++;
        ton(320, 0.18, "sawtooth", 0.12, 140);
        yazilarGoster("KARNIN GURULDUYOR — OSURUK HAZIR! (D)", "#9ad86a");
      }
    }
  }

  // gazoz içme — her GAZOZ_ESIGI tanede bir GEĞİRME hakkı
  for (var gi = 0; gi < gazozlar.length; gi++) {
    var gz = gazozlar[gi];
    if (gz.alindi) continue;
    if (Math.abs(gz.x - oyuncu.x) < 38 && Math.abs(gz.y - oyuncu.y) < 48) {
      gz.alindi = true; gazozPuan += 1; icilenGazoz++; sesGazoz();
      patlama(gz.x, gz.y, "#ff8a5a", 10);
      if (icilenGazoz >= GAZOZ_ESIGI) {
        icilenGazoz = 0; gegirmeHak++;
        ton(200, 0.20, "square", 0.12, 300);
        yazilarGoster("GAZ YAPTI — GEĞİRME HAZIR! (E)", "#ffb64d");
      }
    }
  }

  // yerdeki kakalar eskir
  for (var ki = kakalar.length - 1; ki >= 0; ki--) {
    kakalar[ki].omur--;
    if (kakalar[ki].boy < 1) kakalar[ki].boy = Math.min(1, kakalar[ki].boy + 0.12);
    if (kakalar[ki].omur <= 0) kakalar.splice(ki, 1);
  }
  // geğirme ses dalgaları büyür
  for (var si = sesDalgalari.length - 1; si >= 0; si--) {
    sesDalgalari[si].r += 11; sesDalgalari[si].omur--;
    if (sesDalgalari[si].omur <= 0) sesDalgalari.splice(si, 1);
  }
  if (oyuncu.osurukSure > 0) oyuncu.osurukSure--;
  if (oyuncu.gegirmeSure > 0) oyuncu.gegirmeSure--;

  // sayaçlar
  if (oyuncu.atisHazirlik > 0) {
    oyuncu.atisHazirlik--;
    if (oyuncu.atisHazirlik === 0) muzuBirak();
  }
  if (oyuncu.yemeSure > 0) oyuncu.yemeSure--;
  oyuncu.nefes = (oyuncu.nefes || 0) + 1;
  if (oyuncu.muzBekle > 0) oyuncu.muzBekle--;
  if (oyuncu.kolBekle > 0) oyuncu.kolBekle--;
  if (oyuncu.kolSure > 0) oyuncu.kolSure--;
  if (oyuncu.muzAtis > 0) oyuncu.muzAtis--;
  if (oyuncu.dokunulmaz > 0) oyuncu.dokunulmaz--;
  if (oyuncu.kalkan > 0) {
    oyuncu.kalkan--;
    if (oyuncu.kalkan === 0) oyuncu.kalkanBekle = KALKAN_BEKLEME;
  } else if (oyuncu.kalkanBekle > 0) {
    oyuncu.kalkanBekle--;
    if (oyuncu.kalkanBekle === 0) yazilarGoster("KALKAN HAZIR", "#6fe0a0");
  }

  dusmanlariGuncelle();
  if (durum !== "oyun") return;      // hasar aldıysak oyun bitmiş olabilir
  mermileriGuncelle();
  if (durum !== "oyun") return;

  // BOSS bölümünde: goril ölmeden bayrak açılmaz
  var bossVar = false, bossOldu = true;
  for (var b = 0; b < dusmanlar.length; b++) {
    if (dusmanlar[b].tip === "goril") { bossVar = true; if (!dusmanlar[b].olu) bossOldu = false; }
  }

  if (oyuncu.x >= bayrakX && (!bossVar || bossOldu)) {
    sesBayrak();
    if (bolumNo + 1 < BOLUMLER.length) {
      bolumNo++;
      if (bolumNo + 1 > enIyiBolum) { enIyiBolum = bolumNo + 1; }
      if (muzPuan > enCokMuz) enCokMuz = muzPuan;
      kaydet();
      bolumuKur(bolumNo); bolumYazi = 100;
    } else {
      durum = "kazandi";
      enIyiBolum = BOLUMLER.length;
      if (muzPuan > enCokMuz) enCokMuz = muzPuan;
      kaydet();
    }
    return;
  }

  if (oyuncu.y > YUKSEKLIK + OLUM_DERINLIGI) oldur();
}

var uzakAgaclar = [];
for (var i = 0; i < 46; i++) uzakAgaclar.push({ x: i * 120 + Math.random() * 50, y: 430 + Math.random() * 60, g: 60 + Math.random() * 50, yuk: 150 + Math.random() * 120 });
var sarmasiklar = [];

var isinlar = [];
for (var i = 0; i < 8; i++) isinlar.push({ x: i * 260, g: 60 + Math.random() * 70 });

function arkaPlaniCiz() {
  var gk = ctx.createLinearGradient(0, 0, 0, YUKSEKLIK);
  gk.addColorStop(0, "#9ad86a"); gk.addColorStop(0.28, "#4fa85c");
  gk.addColorStop(0.62, "#1f6b3c"); gk.addColorStop(1, "#0d3520");
  ctx.fillStyle = gk; ctx.fillRect(0, 0, GENISLIK, YUKSEKLIK);

  // güneş
  ctx.globalAlpha = 0.5; ctx.fillStyle = "#fff3b0";
  ctx.beginPath(); ctx.arc(130, 90, 58, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 0.18;
  ctx.beginPath(); ctx.arc(130, 90, 100, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;

  // güneş ışınları (parallax)
  ctx.globalAlpha = 0.07; ctx.fillStyle = "#fffbe0";
  for (var i = 0; i < isinlar.length; i++) {
    var ix = ((isinlar[i].x - kameraX * 0.15) % 2100 + 2100) % 2100 - 200;
    ctx.beginPath();
    ctx.moveTo(ix, 0); ctx.lineTo(ix + isinlar[i].g, 0);
    ctx.lineTo(ix + isinlar[i].g + 120, YUKSEKLIK); ctx.lineTo(ix + 120, YUKSEKLIK);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // uzak ağaçlar
  for (var i = 0; i < uzakAgaclar.length; i++) {
    var a = uzakAgaclar[i];
    var ax = a.x - kameraX * 0.4;
    if (ax < -160 || ax > GENISLIK + 160) continue;
    ctx.fillStyle = "#1c5c36";
    ctx.fillRect(ax - 9, a.y, 18, YUKSEKLIK - a.y);
    ctx.fillStyle = "#256b3f";
    ctx.beginPath(); ctx.ellipse(ax, a.y - a.yuk * 0.35, a.g, a.yuk * 0.4, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#2d7d49";
    ctx.beginPath(); ctx.ellipse(ax - a.g * 0.3, a.y - a.yuk * 0.5, a.g * 0.6, a.yuk * 0.3, 0, 0, 6.2832); ctx.fill();
  }

  // sarmaşıklar (yakın plan, üstten sarkar)
  for (var i = 0; i < sarmasiklar.length; i++) {
    var s = sarmasiklar[i];
    var sx = s.x - kameraX * 0.7;
    if (sx < -40 || sx > GENISLIK + 40) continue;
    ctx.strokeStyle = "#2f8a4e"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(sx, 0);
    ctx.quadraticCurveTo(sx + Math.sin(sayac * 0.01 + i) * 14, s.uz * 0.6, sx + Math.sin(sayac * 0.01 + i) * 20, s.uz);
    ctx.stroke();
    ctx.fillStyle = "#3fa25e";
    ctx.beginPath(); ctx.ellipse(sx + Math.sin(sayac * 0.01 + i) * 20, s.uz, 9, 5, 0.6, 0, 6.2832); ctx.fill();
  }
}

// ===========================================================
function platformlariCiz() {
  for (var i = 0; i < aktifPlatformlar.length; i++) {
    var pf = aktifPlatformlar[i];
    var x = pf.x - kameraX, y = pf.y, g = pf.g;
    if (x + g < -40 || x > GENISLIK + 40) continue;
    // Bütün platformlar havada duran ADA gibi çizilir (altından kökler sarkar).
    // Eskiden dibe kadar uzuyorlardı, sütun gibi görünüp düşmanları gizliyordu.
    var zeminMi = false;
    var kalin = 46;
    // toprak
    var gr = ctx.createLinearGradient(0, y, 0, y + (zeminMi ? 80 : 50));
    gr.addColorStop(0, "#7a5433"); gr.addColorStop(1, "#3d2a18");
    ctx.fillStyle = gr;
    if (zeminMi) {
      ctx.fillRect(x, y + 10, g, kalin);
    } else {
      ctx.beginPath(); ctx.roundRect(x, y + 10, g, kalin, [4, 4, 20, 20]); ctx.fill();
      // adanın altından sarkan kökler
      ctx.strokeStyle = "#4a3320"; ctx.lineWidth = 3; ctx.lineCap = "round";
      for (var kk = 24; kk < g - 10; kk += 46) {
        ctx.beginPath();
        ctx.moveTo(x + kk, y + kalin + 4);
        ctx.quadraticCurveTo(x + kk + 4, y + kalin + 14, x + kk - 3, y + kalin + 22);
        ctx.stroke();
      }
    }
    // kök dokusu
    ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 2;
    for (var k = 0; k < g; k += 60) {
      ctx.beginPath(); ctx.moveTo(x + k + 20, y + 24); ctx.lineTo(x + k + 34, y + Math.min(54, kalin)); ctx.stroke();
    }
    // çim üst
    ctx.fillStyle = "#3fa25e";
    ctx.beginPath(); ctx.roundRect(x, y, g, 18, 7); ctx.fill();
    ctx.fillStyle = "#5cc06a";
    ctx.fillRect(x, y, g, 6);
    // çim püskülleri
    ctx.fillStyle = "#6fd97d";
    for (var c = 6; c < g - 6; c += 24) {
      ctx.beginPath();
      ctx.moveTo(x + c, y);
      ctx.lineTo(x + c + 5, y - 9 - (c % 3) * 2);
      ctx.lineTo(x + c + 10, y);
      ctx.closePath(); ctx.fill();
    }
  }
}

    ctx.fillStyle = "#7a5029";
    ctx.beginPath(); ctx.ellipse(1, -12, 7, 5, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.moveTo(1, -17); ctx.quadraticCurveTo(5, -21, 2, -22); ctx.quadraticCurveTo(-1, -20, 1, -16); ctx.fill();
    // koku çizgileri
    ctx.strokeStyle = "rgba(154,216,106,0.55)"; ctx.lineWidth = 2; ctx.lineCap = "round";
    for (var c = -1; c <= 1; c++) {
      ctx.beginPath();
      ctx.moveTo(c * 9, -20);
      ctx.quadraticCurveTo(c * 9 + Math.sin(sayac * 0.08 + c) * 5, -28, c * 9, -34);
      ctx.stroke();
    }
    // dönen sinek
    var sa = sayac * 0.13 + i;
    ctx.fillStyle = "#241a08";
    ctx.beginPath(); ctx.arc(Math.cos(sa) * 22, -14 + Math.sin(sa * 1.6) * 8, 2, 0, 6.2832); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}
function sesDalgalariniCiz() {
  for (var i = 0; i < sesDalgalari.length; i++) {
    var d = sesDalgalari[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, d.omur / 40) * 0.65;
    ctx.strokeStyle = "#ffb64d"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(d.x - kameraX, d.y, d.r, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = "#fff3c0"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(d.x - kameraX, d.y, d.r * 0.72, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
// bayılan düşmanın başında dönen yıldızlar, korkanın başında ünlem
function dusmanDurumuCiz(x, d) {
  if (d.bayilma > 0) {
    var tepe = d.y - d.yuk - 16;
    for (var i = 0; i < 3; i++) {
      var a = sayac * 0.09 + i * 2.094;
      ctx.save();
      ctx.translate(x + Math.cos(a) * 20, tepe + Math.sin(a) * 7);
      ctx.rotate(a);
      ctx.fillStyle = "#ffd84d";
      ctx.beginPath();
      for (var k = 0; k < 5; k++) {
        var ac = (k / 5) * 6.2832 - 1.57;
        ctx.lineTo(Math.cos(ac) * 6, Math.sin(ac) * 6);
        ctx.lineTo(Math.cos(ac + 0.628) * 2.6, Math.sin(ac + 0.628) * 2.6);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // dili çıkmış gibi X gözler için küçük işaret
    ctx.fillStyle = "#ffd84d";
    ctx.font = "700 13px " + BASLIK_FONT; ctx.textAlign = "center";
    ctx.fillText("Zzz", x, tepe - 14);
  } else if (d.kacma > 0) {
    ctx.fillStyle = "#ffb64d";
    ctx.font = "700 22px " + BASLIK_FONT; ctx.textAlign = "center";
    ctx.fillText("!", x, d.y - d.yuk - 14);
  }
}

// ===========================================================
//   MERMİLERİ ÇİZ
// ===========================================================
function mermileriCiz() {
  for (var i = 0; i < atilanMuzlar.length; i++) {
    var m = atilanMuzlar[i];
    if (m.tas) {
      ctx.save(); ctx.translate(m.x - kameraX, m.y); ctx.rotate(m.aci);
      ctx.fillStyle = "#9aa5b1";
      ctx.beginPath(); ctx.roundRect(-9, -8, 18, 16, 5); ctx.fill();
      ctx.restore();
    } else {
      muzCiz(m.x - kameraX, m.y, m.aci, 1);
    }
  }
  for (var t = 0; t < dusmanMermileri.length; t++) {
    var s = dusmanMermileri[t];
    ctx.save(); ctx.translate(s.x - kameraX, s.y); ctx.rotate(s.aci);
    ctx.fillStyle = "#8a94a0";
    ctx.beginPath(); ctx.roundRect(-9, -8, 18, 16, 5); ctx.fill();
    ctx.fillStyle = "#6d757f";
    ctx.beginPath(); ctx.arc(3, 2, 3, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
}

// ===========================================================
//   DÜŞMAN ÇİZİMLERİ
// ===========================================================
function dusmanlariCiz() {
  for (var i = 0; i < dusmanlar.length; i++) {
    var d = dusmanlar[i];
    if (d.olu) continue;
    var x = d.x - kameraX;
    if (x < -200 || x > GENISLIK + 200) continue;
    ctx.save();
    if (d.vurulma > 0) { ctx.globalAlpha = 0.6 + Math.sin(sayac) * 0.3; }
    if (d.bayilma > 0) {   // bayılınca yana devrilir
      ctx.translate(x, d.y); ctx.rotate(0.42); ctx.translate(-x, -d.y);
      ctx.globalAlpha *= 0.85;
    }
    if (d.tip === "yilan") yilanCiz(x, d);
    else if (d.tip === "ari") ariCiz(x, d);
    else if (d.tip === "maymun") maymunCiz(x, d);
    else if (d.tip === "goril") gorilCiz(x, d);
    ctx.restore();
    dusmanDurumuCiz(x, d);
    // can çubuğu (2+ canlılar için)
    if (d.maxCan > 1 && d.tip !== "goril") {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(x - 20, d.y - d.yuk - 14, 40, 6);
      ctx.fillStyle = "#ff6a6a";
      ctx.fillRect(x - 20, d.y - d.yuk - 14, 40 * (d.can / d.maxCan), 6);
    }
  }
}

function yilanCiz(x, d) {
  var y = d.y;
  // gölge
  ctx.globalAlpha *= 0.9;
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath(); ctx.ellipse(x, y + 2, 24, 5, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha /= 0.9;
  // gövde (dalgalı)
  ctx.strokeStyle = d.kizgin > 0 ? "#7fd94a" : "#4fa83c";
  ctx.lineWidth = 13; ctx.lineCap = "round";
  ctx.beginPath();
  for (var i = 0; i <= 20; i++) {
    var t = i / 20;
    var px = x - d.yon * 22 + d.yon * t * 44;
    var py = y - 10 + Math.sin(t * 6 + sayac * 0.16) * 6;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  // desen
  ctx.strokeStyle = "#2f7a26"; ctx.lineWidth = 3;
  ctx.beginPath();
  for (var j = 0; j <= 20; j += 4) {
    var t2 = j / 20;
    var qx = x - d.yon * 22 + d.yon * t2 * 44;
    var qy = y - 10 + Math.sin(t2 * 6 + sayac * 0.16) * 6;
    ctx.moveTo(qx, qy - 5); ctx.lineTo(qx, qy + 5);
  }
  ctx.stroke();
  // kafa
  var kx = x + d.yon * 24, ky = y - 10 + Math.sin(6 + sayac * 0.16) * 6;
  ctx.fillStyle = d.kizgin > 0 ? "#8fe05a" : "#5cc04a";
  ctx.beginPath(); ctx.ellipse(kx, ky, 13, 10, 0, 0, 6.2832); ctx.fill();
  // gözler
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(kx + d.yon * 4, ky - 4, 3.4, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#c01818";
  ctx.beginPath(); ctx.arc(kx + d.yon * 5, ky - 4, 1.8, 0, 6.2832); ctx.fill();
  // dil
  if (Math.floor(sayac / 24) % 2 === 0) {
    ctx.strokeStyle = "#ff5a7a"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(kx + d.yon * 12, ky + 2);
    ctx.lineTo(kx + d.yon * 22, ky + 3);
    ctx.stroke();
  }
}

function ariCiz(x, d) {
  var y = d.y - d.yuk / 2;
  var kanat = Math.sin(sayac * 0.9) * 0.6;
  // kanatlar
  ctx.fillStyle = "rgba(220,240,255,0.55)";
  for (var k = -1; k <= 1; k += 2) {
    ctx.save(); ctx.translate(x, y - 10); ctx.rotate(k * (0.5 + kanat));
    ctx.beginPath(); ctx.ellipse(k * 12, 0, 14, 6, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
  // gövde
  ctx.fillStyle = "#ffd12e";
  ctx.beginPath(); ctx.ellipse(x, y, 15, 12, 0, 0, 6.2832); ctx.fill();
  // şeritler
  ctx.fillStyle = "#241a08";
  for (var s = -1; s <= 1; s++) {
    ctx.beginPath(); ctx.ellipse(x + s * 7, y, 2.6, 11, 0, 0, 6.2832); ctx.fill();
  }
  // İĞNE — tehlikeli olan TEK yer burası, o yüzden kırmızı ve biraz iri çizilir
  var yon = d.bakis || 1;
  ctx.fillStyle = "#ff4d5e";
  ctx.beginPath();
  ctx.moveTo(x - yon * 14, y - 4);
  ctx.lineTo(x - yon * 28, y + 1);
  ctx.lineTo(x - yon * 14, y + 6);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(255,120,140,0.55)"; ctx.lineWidth = 2;
  ctx.stroke();
  // kafa + göz
  ctx.fillStyle = "#241a08";
  ctx.beginPath(); ctx.arc(x + yon * 13, y - 2, 8, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(x + yon * 15, y - 4, 3, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(x + yon * 16, y - 4, 1.5, 0, 6.2832); ctx.fill();
}

function maymunCiz(x, d) {
  var y = d.y;
  var yon = oyuncu && oyuncu.x > d.x ? 1 : -1;
  var hazir = d.uyandi && (d.sayac % MAYMUN_ARASI) > MAYMUN_ARASI - 20;
  // gölge
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath(); ctx.ellipse(x, y + 2, 20, 5, 0, 0, 6.2832); ctx.fill();
  // kuyruk
  ctx.strokeStyle = "#6b5040"; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x - yon * 14, y - 22);
  ctx.quadraticCurveTo(x - yon * 34, y - 34, x - yon * 26, y - 52);
  ctx.stroke();
  // gövde
  ctx.fillStyle = "#7d6152";
  ctx.beginPath(); ctx.ellipse(x, y - 20, 15, 19, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#c9a684";
  ctx.beginPath(); ctx.ellipse(x + yon * 2, y - 18, 9, 12, 0, 0, 6.2832); ctx.fill();
  // kollar (taş atmaya hazırsa kalkık)
  ctx.strokeStyle = "#7d6152"; ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(x, y - 28);
  if (hazir) ctx.lineTo(x + yon * 16, y - 46);
  else ctx.lineTo(x + yon * 14, y - 18);
  ctx.stroke();
  // kafa
  ctx.fillStyle = "#7d6152";
  ctx.beginPath(); ctx.arc(x + yon * 2, y - 44, 13, 0, 6.2832); ctx.fill();
  // kulaklar
  ctx.beginPath(); ctx.arc(x - 11, y - 46, 5, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 13, y - 46, 5, 0, 6.2832); ctx.fill();
  // yüz
  ctx.fillStyle = "#e2c19c";
  ctx.beginPath(); ctx.ellipse(x + yon * 3, y - 42, 9, 8, 0, 0, 6.2832); ctx.fill();
  // gözler
  ctx.fillStyle = "#221810";
  ctx.beginPath(); ctx.arc(x + yon * 0.5, y - 45, 2, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(x + yon * 6.5, y - 45, 2, 0, 6.2832); ctx.fill();
  // ağız
  ctx.strokeStyle = "#8a6a4a"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x + yon * 3, y - 38, 4, 0.2, Math.PI - 0.2); ctx.stroke();
  // elindeki taş
  if (hazir) {
    ctx.fillStyle = "#8a94a0";
    ctx.beginPath(); ctx.arc(x + yon * 17, y - 50, 6, 0, 6.2832); ctx.fill();
  }
}

function gorilCiz(x, d) {
  var y = d.y;
  var gogus = d.ozel > 0 && d.ozelTip === "gogus";
  var vur = Math.sin(sayac * 0.6) * (gogus ? 8 : 0);
  var yon = oyuncu && oyuncu.x > d.x ? 1 : -1;

  // gölge
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath(); ctx.ellipse(x, d.by + 4, 62, 12, 0, 0, 6.2832); ctx.fill();

  // aura (kızgınken)
  if (d.can <= d.maxCan * 0.4) {
    ctx.globalAlpha *= 0.35;
    ctx.fillStyle = "#ff5a3a";
    ctx.beginPath(); ctx.ellipse(x, y - 60, 74 + Math.sin(sayac * 0.1) * 6, 82, 0, 0, 6.2832); ctx.fill();
    ctx.globalAlpha /= 0.35;
  }

  // bacaklar
  ctx.fillStyle = "#3a3238";
  ctx.beginPath(); ctx.roundRect(x - 36, y - 40, 28, 42, 12); ctx.fill();
  ctx.beginPath(); ctx.roundRect(x + 8, y - 40, 28, 42, 12); ctx.fill();

  // kollar (uzun, yere değen)
  ctx.fillStyle = "#4a4148";
  ctx.save(); ctx.translate(x - 44, y - 92); ctx.rotate(-0.2 + vur * 0.02);
  ctx.beginPath(); ctx.roundRect(-13, 0, 26, 76, 13); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(x + 44, y - 92); ctx.rotate(0.2 - vur * 0.02);
  ctx.beginPath(); ctx.roundRect(-13, 0, 26, 76, 13); ctx.fill(); ctx.restore();

  // gövde
  var gr = ctx.createLinearGradient(0, y - 110, 0, y - 20);
  gr.addColorStop(0, "#5a5058"); gr.addColorStop(1, "#2e282f");
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.roundRect(x - 40, y - 110, 80, 78, 26); ctx.fill();
  // gümüş sırt (silverback!)
  ctx.fillStyle = "#b9bfc9";
  ctx.beginPath(); ctx.roundRect(x - 26, y - 104, 52, 26, 14); ctx.fill();
  // göğüs
  ctx.fillStyle = "#6a5f66";
  ctx.beginPath(); ctx.ellipse(x, y - 66 + vur * 0.2, 24, 20, 0, 0, 6.2832); ctx.fill();

  // kafa
  ctx.fillStyle = "#4a4148";
  ctx.beginPath(); ctx.ellipse(x + yon * 3, y - 128, 32, 28, 0, 0, 6.2832); ctx.fill();
  // kaş çıkıntısı
  ctx.fillStyle = "#332c33";
  ctx.beginPath(); ctx.ellipse(x + yon * 3, y - 138, 30, 12, 0, 0, 6.2832); ctx.fill();
  // yüz
  ctx.fillStyle = "#2a2228";
  ctx.beginPath(); ctx.ellipse(x + yon * 4, y - 120, 20, 18, 0, 0, 6.2832); ctx.fill();
  // gözler (kızgın)
  ctx.fillStyle = "#ffd84d";
  ctx.beginPath(); ctx.ellipse(x + yon * 4 - 9, y - 128, 5, 4, -0.25 * yon, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + yon * 4 + 9, y - 128, 5, 4, 0.25 * yon, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(x + yon * 4 - 9, y - 128, 2.2, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(x + yon * 4 + 9, y - 128, 2.2, 0, 6.2832); ctx.fill();
  // burun
  ctx.fillStyle = "#181418";
  ctx.beginPath(); ctx.arc(x + yon * 1, y - 116, 2.4, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(x + yon * 8, y - 116, 2.4, 0, 6.2832); ctx.fill();
  // ağız (bağırıyor)
  var agiz = gogus ? 12 : 6;
  ctx.fillStyle = "#1a1016";
  ctx.beginPath(); ctx.ellipse(x + yon * 4, y - 106, 13, agiz, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#fff";
  for (var t = -1; t <= 1; t += 2) {
    ctx.beginPath();
    ctx.moveTo(x + yon * 4 + t * 7, y - 106 - agiz * 0.5);
    ctx.lineTo(x + yon * 4 + t * 10, y - 106 + agiz * 0.2);
    ctx.lineTo(x + yon * 4 + t * 4, y - 106 + agiz * 0.2);
    ctx.closePath(); ctx.fill();
  }
}

// ===========================================================
//   ORANGUTAN  (kahramanımız — Uraz'ın gönderdiği fotoğraftaki
//   GENÇ orangutan: ince uzun kollar, açık yuvarlak yüz, kocaman
//   açılan ağız, seyrek kızıl-kahve tüyler. Yanak pedi YOK, o
//   yaşlı erkeklerde olur.)
//
//   Hareketler: nefes alır, yürürken yalpalar, havadayken iki
//   kolunu fotoğraftaki gibi yukarı kaldırır, muz atarken kolu
//   geriye çekip savurur, topladığı muzu eline alıp AĞZINA ATAR
//   ve çiğner, osururken eğilir, geğirirken ağzını sonuna kadar açar.
// ===========================================================
function orangutanCiz(x, y, b, o) {
  var ex = 1 + o.ezilme, ey = 1 - o.ezilme;
  var bakis = o.bakis || 1;
  var adim = Math.sin(o.adimFazi || 0);
  var yuruyor = o.yuruyor;
  var havada = (o.yerde === false);
  var osuruyor = (o.osurukSure || 0) > 0;
  var gegiriyor = (o.gegirmeSure || 0) > 0;
  var yemeSure = o.yemeSure || 0;
  var yiyor = yemeSure > 0;
  var hazirlik = o.atisHazirlik || 0;
  var atiyor = (o.muzAtis || 0) > 0;
  var nefes = Math.sin((o.nefes || sayac) * 0.055);      // sürekli nefes alıp verme

  var kolAci = 0;
  if (o.kolSure > 0) {
    var kt = 1 - o.kolSure / KOL_SURE;
    kolAci = 1.9 - kt * 3.5;              // arkadan öne savurma (sol arka -> sağ ön)
  }

  // fotoğraftaki tonlar
  var TUY_ACIK = "#a25a2c", TUY = "#7d3f1c", TUY_KOYU = "#552710";
  var DERI = "#b7825b", DERI_GOLGE = "#8f5f3d", AGIZ = "#48201a", KENAR = "#33170a";

  // --- yardımcılar ---
  // seyrek tüylü organik gövde parçası
  function tuylu(cx, cy, rx, ry, renk, tuyBoy, faz) {
    ctx.fillStyle = renk;
    ctx.beginPath();
    for (var i = 0; i <= 32; i++) {
      var a = (i / 32) * 6.2832;
      var uz = 1 + (Math.sin(i * 2.1 + faz) * 0.5 + 0.5) * tuyBoy;
      var px = cx + Math.cos(a) * rx * uz;
      var py = cy + Math.sin(a) * ry * uz;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }
  // İNCE UZUN KOL — omuzdan ele, dirsekten hafif kırık (fotoğraftaki gibi)
  // aci: omuz açısı (0 = aşağı sarkık), dirsek: ek kırılma
  function kolCiz(aci, dirsek, uzunluk, renk, elde) {
    ctx.save();
    ctx.rotate(aci);
    var ust = uzunluk * 0.52, alt = uzunluk * 0.48;
    // üst kol
    ctx.fillStyle = renk; ctx.strokeStyle = KENAR; ctx.lineWidth = b * 0.032;
    ctx.beginPath(); ctx.roundRect(-b * 0.075, 0, b * 0.15, ust, b * 0.075); ctx.fill(); ctx.stroke();
    // dirsek + alt kol
    ctx.translate(0, ust);
    ctx.rotate(dirsek);
    ctx.beginPath(); ctx.roundRect(-b * 0.065, -b * 0.04, b * 0.13, alt + b * 0.04, b * 0.065); ctx.fill(); ctx.stroke();
    // kol tüyleri (seyrek, uzun — fotoğraftaki dağınık tüyler)
    ctx.strokeStyle = TUY_KOYU; ctx.lineWidth = b * 0.013; ctx.lineCap = "round";
    for (var i = 0; i < 4; i++) {
      var yy = alt * (0.18 + i * 0.22);
      ctx.beginPath(); ctx.moveTo(-b * 0.06, yy); ctx.lineTo(-b * 0.105, yy + b * 0.05); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(b * 0.06, yy); ctx.lineTo(b * 0.105, yy + b * 0.05); ctx.stroke();
    }
    // el (açık deri, uzun parmaklar)
    ctx.translate(0, alt);
    ctx.fillStyle = DERI_GOLGE; ctx.strokeStyle = KENAR; ctx.lineWidth = b * 0.026;
    ctx.beginPath(); ctx.ellipse(0, 0, b * 0.075, b * 0.065, 0, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = DERI_GOLGE; ctx.lineWidth = b * 0.028; ctx.lineCap = "round";
    for (var f = -1; f <= 1; f++) {
      ctx.beginPath();
      ctx.moveTo(f * b * 0.042, b * 0.03);
      ctx.lineTo(f * b * 0.05, b * 0.105);
      ctx.stroke();
    }
    if (elde === "muz") muzCiz(0, b * 0.11, 0.9, 1.05);
    ctx.restore();
  }

  // --- gölge (havadayken küçülür) ---
  ctx.save();
  ctx.globalAlpha = havada ? 0.13 : 0.26; ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.ellipse(x, y + b * 0.56, b * (havada ? 0.30 : 0.42) * ex, b * 0.10, 0, 0, 6.2832);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(ex, ey);
  ctx.scale(bakis, 1);                       // yön dönüşü
  if (osuruyor) ctx.rotate(0.20);            // osururken öne eğilir
  else if (gegiriyor) ctx.rotate(-0.12);     // geğirirken geriye yaslanır
  else if (hazirlik > 0) ctx.rotate(-0.10);  // atmadan önce geriye yaylanır
  else if (atiyor) ctx.rotate(0.14);         // atarken öne savrulur
  if (yuruyor && !havada) ctx.rotate(Math.sin(o.adimFazi * 0.5) * 0.05);   // yalpalama

  // ============ KOL AÇILARI ============
  // (0 = aşağı sarkık, negatif = yukarı)
  var arkaKol, arkaDirsek, onKol, onDirsek, onElde = null;
  if (havada) {
    // FOTOĞRAFTAKİ POZ: iki kol da yukarıda
    arkaKol =  2.80 - nefes * 0.10; arkaDirsek =  0.20;
    onKol   = -2.80 + nefes * 0.10; onDirsek   = -0.20;
  } else if (yiyor) {
    // muzu ağza götürme: kol kıvrılıp ağza gelir
    var yt = 1 - yemeSure / YEME_SURESI;        // 0 -> 1
    var kalkis = Math.min(1, yt / 0.35);        // ilk %35: kol ağza kalkar
    arkaKol = 0.34 + nefes * 0.05; arkaDirsek = -0.18;
    onKol = -0.32 + kalkis * 2.40;      // kol kıvrılıp ağza gelir
    onDirsek = 0.20 + kalkis * 1.05;
    if (yt < 0.45) onElde = "muz";              // ısırana kadar elinde
  } else if (hazirlik > 0) {
    // ATMA HAZIRLIĞI: kolu arkaya-yukarı çeker, muz elinde
    var ht = 1 - hazirlik / ATIS_HAZIRLIK;
    arkaKol = 0.55; arkaDirsek = -0.15;
    onKol = -0.32 + ht * 2.82;          // tepeden arkaya yaslanır
    onDirsek = 0.25 - ht * 0.55;
    onElde = "muz";
  } else if (atiyor) {
    // FIRLATMA: kol tepeden öne savrulur
    var at = 1 - o.muzAtis / 14;
    arkaKol = 0.30; arkaDirsek = -0.20;
    onKol = 2.50 - at * 4.10;           // tepeden öne fırlatma
    onDirsek = -0.30 + at * 0.55;
  } else if (kolAci !== 0) {
    arkaKol = 0.40; arkaDirsek = -0.15;
    onKol = kolAci; onDirsek = -0.10;
  } else if (yuruyor) {
    arkaKol =  0.30 - adim * 0.48; arkaDirsek = -0.20 - adim * 0.14;
    onKol   = -0.30 + adim * 0.48; onDirsek   =  0.20 - adim * 0.14;
  } else {
    // duruyor: kollar sarkık, nefesle hafif sallanır
    arkaKol =  0.36 + nefes * 0.06; arkaDirsek = -0.22;
    onKol   = -0.32 - nefes * 0.06; onDirsek   =  0.20;
  }

  // --- ARKA KOL ---
  ctx.save();
  ctx.translate(-b * 0.20, -b * 0.26);
  kolCiz(arkaKol, arkaDirsek, b * 0.92, TUY_KOYU, null);
  ctx.restore();

  // --- BACAKLAR (ince, çarpık — fotoğraftaki gibi) ---
  var bacakAcik = havada ? 0.34 : 0.16;
  var b1 = (yuruyor && !havada) ? adim * b * 0.13 : 0;
  for (var bc = -1; bc <= 1; bc += 2) {
    ctx.save();
    ctx.translate(bc * b * 0.11, b * 0.16);
    ctx.rotate(bc * bacakAcik + (bc < 0 ? b1 * 0.02 : -b1 * 0.02));
    ctx.fillStyle = TUY; ctx.strokeStyle = KENAR; ctx.lineWidth = b * 0.03;
    // uyluk
    ctx.beginPath(); ctx.roundRect(-b * 0.075, 0, b * 0.15, b * 0.20, b * 0.07); ctx.fill(); ctx.stroke();
    // baldır (hafif dışa)
    ctx.translate(0, b * 0.19); ctx.rotate(-bc * 0.20);
    ctx.beginPath(); ctx.roundRect(-b * 0.065, 0, b * 0.13, b * 0.18, b * 0.06); ctx.fill(); ctx.stroke();
    // ayak (uzun, kavrayıcı)
    ctx.fillStyle = DERI_GOLGE;
    ctx.beginPath(); ctx.ellipse(bc * b * 0.02, b * 0.20, b * 0.10, b * 0.05, 0, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // --- GÖVDE (ince, uzun; nefesle şişip iner) ---
  var govdeR = 1 + nefes * 0.022;
  tuylu(0, b * 0.02, b * 0.235 * govdeR, b * 0.26 * govdeR, TUY, 0.10, 0.7);
  tuylu(0, -b * 0.17, b * 0.215, b * 0.16, TUY_ACIK, 0.09, 2.1);       // omuz/göğüs
  // göğüs derisi (seyrek tüylü, açık)
  ctx.fillStyle = "#96613a";
  ctx.beginPath(); ctx.ellipse(0, b * 0.02, b * 0.115, b * 0.145, 0, 0, 6.2832); ctx.fill();
  // gövde tüy telleri
  ctx.strokeStyle = TUY_KOYU; ctx.lineWidth = b * 0.014; ctx.lineCap = "round";
  for (var t = 0; t < 12; t++) {
    var ta = (t / 12) * 6.2832 + 0.4;
    var px = Math.cos(ta) * b * 0.20, py = b * 0.02 + Math.sin(ta) * b * 0.22;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(ta) * b * 0.045, py + Math.sin(ta) * b * 0.045); ctx.stroke();
  }

  // --- KAFA ---
  var kY = -b * 0.44;
  if (gegiriyor) kY -= b * 0.06;              // geğirirken kafa kalkar
  if (yiyor) kY += b * 0.01;
  var kafaEgim = yuruyor ? Math.sin(o.adimFazi) * 0.05 : nefes * 0.03;

  ctx.save();
  ctx.translate(0, kY);
  ctx.rotate(kafaEgim);

  // saç/tüy kütlesi (dağınık, seyrek — fotoğraftaki gibi tepesi düz değil)
  tuylu(0, -b * 0.02, b * 0.215, b * 0.205, TUY, 0.14, 1.9);
  // kulaklar (küçük, yandan)
  ctx.fillStyle = DERI_GOLGE; ctx.strokeStyle = KENAR; ctx.lineWidth = b * 0.022;
  for (var kl = -1; kl <= 1; kl += 2) {
    ctx.beginPath(); ctx.ellipse(kl * b * 0.20, b * 0.01, b * 0.035, b * 0.05, 0, 0, 6.2832);
    ctx.fill(); ctx.stroke();
  }
  // yüz (açık, yuvarlak — genç orangutan)
  ctx.fillStyle = DERI;
  ctx.beginPath(); ctx.ellipse(0, b * 0.02, b * 0.155, b * 0.175, 0, 0, 6.2832); ctx.fill();
  // alın gölgesi
  ctx.fillStyle = DERI_GOLGE;
  ctx.beginPath(); ctx.ellipse(0, -b * 0.09, b * 0.135, b * 0.055, 0, 0, 6.2832); ctx.fill();

  var kirp = o.gozKirp > 0 || osuruyor;
  // kaşlar
  ctx.strokeStyle = "#3d1d0c"; ctx.lineWidth = b * 0.022; ctx.lineCap = "round";
  for (var kg = -1; kg <= 1; kg += 2) {
    ctx.beginPath();
    ctx.moveTo(kg * b * 0.10, -b * 0.055);
    ctx.lineTo(kg * b * 0.032, -b * 0.038);
    ctx.stroke();
  }
  // gözler (küçük, koyu, birbirine yakın)
  for (var g2 = -1; g2 <= 1; g2 += 2) {
    ctx.fillStyle = "#f0e2d2";
    ctx.beginPath();
    ctx.ellipse(g2 * b * 0.062, b * 0.002, b * 0.036, kirp ? b * 0.006 : b * 0.033, 0, 0, 6.2832);
    ctx.fill();
    if (!kirp) {
      ctx.fillStyle = "#1a0e06";
      ctx.beginPath(); ctx.arc(g2 * b * 0.062 + b * 0.007, b * 0.002, b * 0.022, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(g2 * b * 0.062 + b * 0.001, -b * 0.010, b * 0.008, 0, 6.2832); ctx.fill();
    }
  }
  // burun (küçük, iki delik)
  ctx.fillStyle = "#5c3520";
  ctx.beginPath(); ctx.ellipse(-b * 0.024, b * 0.062, b * 0.017, b * 0.013, 0.3, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(b * 0.024, b * 0.062, b * 0.017, b * 0.013, -0.3, 0, 6.2832); ctx.fill();

  // ---- AĞIZ (duruma göre; fotoğraftaki kocaman açık ağız burada) ----
  var agizAcik = 0;                       // 0 = kapalı, 1 = sonuna kadar açık
  if (gegiriyor) agizAcik = 1;
  else if (havada) agizAcik = 0.62;       // zıplarken bağırır
  else if (o.kolSure > 0 || atiyor || hazirlik > 0) agizAcik = 0.5;
  else if (yiyor) {
    var yt2 = 1 - yemeSure / YEME_SURESI;
    if (yt2 < 0.30) agizAcik = yt2 / 0.30 * 0.75;                    // ağzını açar
    else if (yt2 < 0.45) agizAcik = 0.75 * (1 - (yt2 - 0.30) / 0.15); // ısırır (kapanır)
    else agizAcik = 0.12 + Math.abs(Math.sin(yt2 * 46)) * 0.16;       // ÇİĞNER
  }

  ctx.fillStyle = DERI_GOLGE;
  ctx.beginPath(); ctx.ellipse(0, b * 0.115, b * 0.095, b * 0.05, 0, 0, 6.2832); ctx.fill();
  if (agizAcik > 0.06) {
    var ag = b * (0.022 + agizAcik * 0.085);
    ctx.fillStyle = AGIZ;
    ctx.beginPath(); ctx.ellipse(0, b * (0.118 + agizAcik * 0.022), b * (0.055 + agizAcik * 0.032), ag, 0, 0, 6.2832); ctx.fill();
    // alt dudak
    ctx.strokeStyle = "#7a4526"; ctx.lineWidth = b * 0.016;
    ctx.beginPath(); ctx.arc(0, b * (0.118 + agizAcik * 0.022), b * (0.055 + agizAcik * 0.032), 0.35, Math.PI - 0.35); ctx.stroke();
    // dil (çok açıkken)
    if (agizAcik > 0.55) {
      ctx.fillStyle = "#c4676a";
      ctx.beginPath(); ctx.ellipse(0, b * (0.145 + agizAcik * 0.030), b * 0.032, b * 0.020, 0, 0, 6.2832); ctx.fill();
    }
  } else {
    // kapalı: sarkık dudak çizgisi
    ctx.strokeStyle = "#5c3520"; ctx.lineWidth = b * 0.018;
    ctx.beginPath();
    ctx.moveTo(-b * 0.048, b * 0.108);
    ctx.quadraticCurveTo(0, b * (osuruyor ? 0.145 : 0.132), b * 0.048, b * 0.108);
    ctx.stroke();
  }
  // çiğnerken yanakta hareket
  if (yiyor && (1 - yemeSure / YEME_SURESI) > 0.45) {
    ctx.fillStyle = DERI_GOLGE;
    var cig = Math.abs(Math.sin((1 - yemeSure / YEME_SURESI) * 46)) * b * 0.02;
    ctx.beginPath(); ctx.ellipse(b * 0.10, b * 0.09, b * 0.035 + cig, b * 0.03 + cig, 0, 0, 6.2832); ctx.fill();
  }
  ctx.restore();   // kafa

  // --- ÖN KOL (atma / yeme / savurma burada) ---
  ctx.save();
  ctx.translate(b * 0.20, -b * 0.26);
  var onUzunluk = o.kolSure > 0 ? b * 1.06 : b * 0.92;   // savururken uzar
  kolCiz(onKol, onDirsek, onUzunluk, TUY_ACIK, onElde);
  ctx.restore();

  ctx.restore();

  // --- SAVURMA YAYI (kol izi) ---
  if (o.kolSure > 0) {
    var tt2 = 1 - o.kolSure / KOL_SURE;
    ctx.save();
    ctx.translate(x, y - b * 0.15);
    ctx.globalAlpha = 0.55 * (1 - tt2 * 0.6);
    ctx.strokeStyle = "#ffe3a0"; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath();
    var bas = bakis > 0 ? -1.0 : Math.PI + 1.0;
    ctx.arc(0, 0, KOL_MENZIL * 0.85, bakis > 0 ? bas : bas - 2.0 * tt2, bakis > 0 ? bas + 2.0 * tt2 : bas, bakis < 0);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // --- ÇİĞNEME KIRINTILARI ---
  if (yiyor) {
    var yt3 = 1 - yemeSure / YEME_SURESI;
    if (yt3 > 0.45 && sayac % 7 === 0) {
      parcaciklar.push({
        x: x + bakis * b * 0.05, y: y - b * 0.30,
        vx: (Math.random() - 0.5) * 1.6, vy: 0.4 + Math.random(),
        omur: 18, boy: 1.5 + Math.random() * 1.5, renk: "#ffd84d"
      });
    }
  }

  // --- KALKAN ---
  if (o.kalkan > 0) {
    var sol = o.kalkan < 45 && Math.floor(sayac / 5) % 2 === 0;   // bitmeden yanıp söner
    ctx.save();
    ctx.globalAlpha = sol ? 0.35 : 0.62;
    var kg2 = ctx.createRadialGradient(x, y - b * 0.1, b * 0.2, x, y - b * 0.1, b * 0.95);
    kg2.addColorStop(0, "rgba(140,255,190,0.10)");
    kg2.addColorStop(0.75, "rgba(90,230,150,0.35)");
    kg2.addColorStop(1, "rgba(50,190,110,0.75)");
    ctx.fillStyle = kg2;
    ctx.beginPath(); ctx.arc(x, y - b * 0.1, b * 0.95, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#7fffc0"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y - b * 0.1, b * 0.95, 0, 6.2832); ctx.stroke();
    for (var yp = 0; yp < 5; yp++) {
      var a2 = sayac * 0.05 + yp * 1.256;
      ctx.save();
      ctx.translate(x + Math.cos(a2) * b * 0.95, y - b * 0.1 + Math.sin(a2) * b * 0.95);
      ctx.rotate(a2);
      ctx.fillStyle = "#6fe0a0";
      ctx.beginPath(); ctx.ellipse(0, 0, b * 0.16, b * 0.07, 0, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // --- GEĞİRME ÇİZGİLERİ ---
  if (gegiriyor) {
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = "#ffb64d"; ctx.lineWidth = 3; ctx.lineCap = "round";
    for (var gc = 0; gc < 3; gc++) {
      var gr2 = b * (0.55 + gc * 0.22) + (34 - o.gegirmeSure) * 1.2;
      ctx.beginPath();
      ctx.arc(x + bakis * b * 0.2, y - b * 0.42, gr2, -0.7, 0.7);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function karakteriCiz() {
  // vurulunca yanıp söner
  if (oyuncu.dokunulmaz > 0 && Math.floor(sayac / 4) % 2 === 0) return;
  orangutanCiz(oyuncu.x - kameraX, oyuncu.y, BOYUT, oyuncu);
}

// ===========================================================
//   BAYRAK
// ===========================================================
function bayragiCiz() {
  var bx = bayrakX - kameraX;
  if (bx < -60 || bx > GENISLIK + 60) return;
  var taban = 500;
  for (var i = 0; i < aktifPlatformlar.length; i++) {
    var p = aktifPlatformlar[i];
    if (bayrakX >= p.x && bayrakX <= p.x + p.g) { taban = p.y; break; }
  }
  // boss ölmediyse bayrak soluk
  var bossVar = false, bossOldu = true;
  for (var b = 0; b < dusmanlar.length; b++) {
    if (dusmanlar[b].tip === "goril") { bossVar = true; if (!dusmanlar[b].olu) bossOldu = false; }
  }
  ctx.globalAlpha = (bossVar && !bossOldu) ? 0.3 : 1;

  ctx.strokeStyle = "#e8d9b8"; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(bx, taban); ctx.lineTo(bx, taban - 130); ctx.stroke();
  var dalga = Math.sin(sayac * 0.12 + bayrakSalla) * 6;
  ctx.fillStyle = "#ffd84d";
  ctx.beginPath();
  ctx.moveTo(bx, taban - 130);
  ctx.lineTo(bx + 54, taban - 116 + dalga);
  ctx.lineTo(bx, taban - 100);
  ctx.closePath(); ctx.fill();
  muzCiz(bx + 26, taban - 116 + dalga * 0.6, 0.2, 0.8);
  ctx.fillStyle = "#8fe07a";
  ctx.beginPath(); ctx.arc(bx, taban - 130, 6, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
}

// ===========================================================
//   ARAYÜZ (HUD)
// ===========================================================
function camPanel(x, y, g, yuk, r) {
  ctx.fillStyle = "rgba(8,26,16,0.72)";
  ctx.beginPath(); ctx.roundRect(x, y, g, yuk, r); ctx.fill();
  ctx.strokeStyle = "rgba(140,240,180,0.25)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(x, y, g, yuk, r); ctx.stroke();
}

    ctx.textAlign = "right";
    ctx.font = "800 15px " + BASLIK_FONT;

  // saldırı bekleme çubukları (sol alt)
  var cubuklar = [

  ];
  if (!dokunmatikVar) {

      ctx.fillStyle = "rgba(255,255,255,0.13)";
      ctx.beginPath(); ctx.roundRect(90, yy, 90, 10, 5); ctx.fill();
      ctx.fillStyle = cubuklar[c].renk;
      ctx.beginPath(); ctx.roundRect(90, yy, 90 * Math.max(0, Math.min(1, cubuklar[c].oran)), 10, 5); ctx.fill();
    }

  if (bolumYazi > 0) {
    ctx.textAlign = "center"; ctx.globalAlpha = Math.min(1, bolumYazi / 30);
    ctx.font = "600 44px " + BASLIK_FONT; ctx.fillStyle = "#9fe0b8";
    ctx.shadowColor = "#1f6b3c"; ctx.shadowBlur = 24;
    ctx.fillText(BOLUMLER[bolumNo].ad, GENISLIK / 2, 200);
    ctx.font = "800 15px " + YAZI_FONT;
    ctx.fillText("BÖLÜM " + (bolumNo + 1), GENISLIK / 2, 232);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  if (yuzenYazi) {
    yuzenYazi.y -= 0.6; yuzenYazi.omur--;
    ctx.textAlign = "center"; ctx.globalAlpha = Math.min(1, yuzenYazi.omur / 30);
    ctx.font = "700 30px " + BASLIK_FONT; ctx.fillStyle = yuzenYazi.renk;
    ctx.shadowColor = "#000"; ctx.shadowBlur = 8;
    ctx.fillText(yuzenYazi.metin, GENISLIK / 2, yuzenYazi.y);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    if (yuzenYazi.omur <= 0) yuzenYazi = null;
  }
}

function dokunmaDugmeleriniCiz() {
  if (!dokunmatikVar || durum !== "oyun") return;
  var d = dokunmaDugmeleri();
  var basili = {
    sol: solBasili, sag: sagBasili,
    zipla: basiliDugmeler.zipla, muz: basiliDugmeler.muz,
    kol: basiliDugmeler.kol, kalkan: basiliDugmeler.kalkan,
    osuruk: basiliDugmeler.osuruk, gegirme: basiliDugmeler.gegirme
  };
  var kilit = { muz: oyuncu.muzBekle > 0, kol: oyuncu.kolBekle > 0, kalkan: oyuncu.kalkan > 0 || oyuncu.kalkanBekle > 0 };
  for (var i = 0; i < DUGME_ADLARI.length; i++) {
    var ad = DUGME_ADLARI[i], g = d[ad];
    if (!dugmeAcikMi(ad)) continue;      // osuruk/geğirme: hak yoksa düğme yok
    var mx = g.x + g.boy / 2, my = g.y + g.boy / 2;
    ctx.save();
    ctx.globalAlpha = kilit[ad] ? 0.28 : (basili[ad] ? 0.95 : 0.55);
    ctx.fillStyle = "rgba(6,18,12,0.7)";
    ctx.beginPath(); ctx.arc(mx, my, g.boy * 0.58, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = g.renk; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mx, my, g.boy * 0.58, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = g.renk;
    ctx.font = "700 " + Math.round(g.boy * 0.42) + "px " + BASLIK_FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(g.isaret, mx, my + 2);
    ctx.textBaseline = "alphabetic";
    ctx.restore();
  }
}

function menuyuCiz() {
  ctx.fillStyle = "rgba(6,20,12,0.5)"; ctx.fillRect(0, 0, GENISLIK, YUKSEKLIK);
  var suzul = Math.sin(sayac * 0.03) * 5;
  ctx.textAlign = "center";
  var bg = ctx.createLinearGradient(0, 110, 0, 200);
  bg.addColorStop(0, "#ffd98a"); bg.addColorStop(1, "#e8641a");
  ctx.font = "700 54px " + BASLIK_FONT; ctx.fillStyle = bg;
  ctx.shadowColor = "rgba(255,159,67,0.5)"; ctx.shadowBlur = 30;
  ctx.fillText("ORANGUTAN MACERASI", GENISLIK / 2, 160 + suzul);
  ctx.shadowBlur = 0;
  ctx.font = "800 13px " + YAZI_FONT; ctx.fillStyle = "#9fe0b8";
  ctx.fillText("2. OYUN  ·  DÜŞMANLI PLATFORM MACERASI", GENISLIK / 2, 196 + suzul);

  ctx.font = "600 20px " + BASLIK_FONT; ctx.fillStyle = "#fff";
  ctx.fillText(YAPIMCI_1 + "  &  " + YAPIMCI_2, GENISLIK / 2, 254);
  ctx.font = "700 12px " + YAZI_FONT; ctx.fillStyle = "#ffffff66";
  ctx.fillText(TARIH, GENISLIK / 2, 276);

  // maskot orangutan
  // maskot boş durmasın: bekler -> muz yer -> sevinip zıplar (döngü)
  var mFaz = sayac % 420;
  var mYeme = (mFaz > 90 && mFaz < 148) ? (148 - mFaz) : 0;
  var mZipla = (mFaz > 250 && mFaz < 296);
  var mZiplaY = mZipla ? -Math.sin((mFaz - 250) / 46 * Math.PI) * 30 : 0;
  orangutanCiz(GENISLIK / 2, 358 + Math.sin(sayac * 0.06) * 5 + mZiplaY, 76, {
    bakis: 1, ezilme: Math.sin(sayac * 0.06) * 0.05, gozKirp: 0,
    adimFazi: sayac * 0.06, yuruyor: false, kolSure: 0, muzAtis: 0, kalkan: 0,
    yerde: !mZipla, yemeSure: mYeme, atisHazirlik: 0, nefes: sayac,
    osurukSure: 0, gegirmeSure: 0
  });

  var nabiz = 1 + Math.sin(sayac * 0.07) * 0.03;
  ctx.fillStyle = "#5cc06a";
  var dg = 250 * nabiz, dy = 54 * nabiz;
  ctx.beginPath(); ctx.roundRect(GENISLIK / 2 - dg / 2, 452 - dy / 2, dg, dy, dy / 2); ctx.fill();
  ctx.font = "600 21px " + BASLIK_FONT; ctx.fillStyle = "#0a1f10";
  ctx.fillText(dokunmatikVar ? "DOKUN · BAŞLA" : "BOŞLUK · BAŞLA", GENISLIK / 2, 459);

  ctx.font = "700 13px " + YAZI_FONT; ctx.fillStyle = "#ffffff55";
  ctx.fillText("En iyi bölüm: " + enIyiBolum + " / " + BOLUMLER.length + "   ·   En çok muz: " + enCokMuz, GENISLIK / 2, 512);
  ctx.fillText(dokunmatikVar ? "◀ ▶ yürü · ⤒ zıpla · 🍌 muz · ✊ kol · 🛡 kalkan"
                             : "← → yürü · BOŞLUK/↑ zıpla · A kol · S muz · D osuruk · E geğirme · W kalkan", GENISLIK / 2, 538);
  ctx.fillStyle = "#9ad86a";
  ctx.fillText("2 muz = 💨 OSURUK (D)   ·   2 gazoz = 🥤 GEĞİRME (E)", GENISLIK / 2, 562);
}

function bitisEkraniCiz(kazandiMi) {
  ctx.fillStyle = "rgba(6,20,12,0.74)"; ctx.fillRect(0, 0, GENISLIK, YUKSEKLIK);
  ctx.textAlign = "center";
  ctx.font = "700 50px " + BASLIK_FONT;
  ctx.fillStyle = kazandiMi ? "#6fd97d" : "#ff7a7a";
  ctx.shadowColor = kazandiMi ? "#2f8f3f" : "#8f2f2f"; ctx.shadowBlur = 26;
  ctx.fillText(kazandiMi ? "ORMANIN KRALI SENSİN!" : "TEKRAR DENE", GENISLIK / 2, 240);
  ctx.shadowBlur = 0;
  ctx.font = "600 21px " + BASLIK_FONT; ctx.fillStyle = "#fff";
  ctx.fillText(kazandiMi ? "Kral Goril'i yendin, bütün bölümleri geçtin!" : "Bölüm " + (bolumNo + 1) + "'de takıldın", GENISLIK / 2, 288);
  ctx.font = "700 16px " + YAZI_FONT; ctx.fillStyle = "#ffd84d";
  ctx.fillText("Topladığın muz: " + muzPuan, GENISLIK / 2, 322);
  ctx.font = "700 15px " + YAZI_FONT; ctx.fillStyle = "#9fe0b8";
  ctx.fillText(dokunmatikVar ? "Dokun · yeniden başla" : "BOŞLUK · yeniden başla", GENISLIK / 2, 366);
}

// ===========================================================
//   OYUN DÖNGÜSÜ
// ===========================================================
function dongu() {
  sayac++;
  if (oyuncu) {
    oyuncu.ezilme *= 0.82;
    oyuncu.kirpSayaci--;
    if (oyuncu.kirpSayaci <= 0) { oyuncu.gozKirp = 6; oyuncu.kirpSayaci = 100 + Math.floor(Math.random() * 120); }
    if (oyuncu.gozKirp > 0) oyuncu.gozKirp--;
  }

  if (durum === "oyun") {
    fizik();
    var hedefKamera = oyuncu.x - GENISLIK * KAMERA_KAYMA;
    if (hedefKamera < 0) hedefKamera = 0;
    kameraX = karistir(kameraX, hedefKamera, 0.12);
    for (var j = parcaciklar.length - 1; j >= 0; j--) {
      var pa = parcaciklar[j]; pa.x += pa.vx; pa.y += pa.vy; pa.vy += 0.18; pa.omur--;
      if (pa.omur <= 0) parcaciklar.splice(j, 1);
    }
    if (bolumYazi > 0) bolumYazi--;
  }

  // ---- ÇİZ ----
  ctx.save();
  ctx.translate(KENAR, 0);              // dünya, sol kumanda şeridinin sağından başlar
  if (sarsinti > 0.4) { ctx.translate((Math.random() - 0.5) * sarsinti, (Math.random() - 0.5) * sarsinti); sarsinti *= 0.88; } else sarsinti = 0;
  arkaPlaniCiz();

  if (durum !== "menu") {
    platformlariCiz();
    kakalariCiz();
    muzlariCiz();
    gazozlariCiz();
    bayragiCiz();
    dusmanlariCiz();
    mermileriCiz();
    sesDalgalariniCiz();
    for (var j2 = 0; j2 < parcaciklar.length; j2++) {
      var pp = parcaciklar[j2];
      ctx.globalAlpha = Math.min(1, pp.omur / 26);
      ctx.fillStyle = pp.renk;
      ctx.beginPath(); ctx.arc(pp.x - kameraX, pp.y, pp.boy, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    karakteriCiz();
    bilgileriCiz();
  }

  if (durum === "menu") menuyuCiz();
  if (durum === "duraklat") {
    ctx.fillStyle = "rgba(6,20,12,0.6)"; ctx.fillRect(0, 0, GENISLIK, YUKSEKLIK);
    ctx.textAlign = "center"; ctx.font = "700 40px " + BASLIK_FONT; ctx.fillStyle = "#fff";
    ctx.fillText("DURAKLADI", GENISLIK / 2, 300);
  }
  if (durum === "bitti") bitisEkraniCiz(false);
  if (durum === "kazandi") bitisEkraniCiz(true);

  ctx.restore();
  // şeritler ve düğmeler dünyanın DIŞINDA — sarsıntıdan da etkilenmezler
  kumandaSeritleriniCiz();
  dokunmaDugmeleriniCiz();
  requestAnimationFrame(dongu);
}

// Menü çizimi sayac ve kameraX kullanır — ilk açılışta NaN olmasın diye
// burada başlatıyoruz (3. oyunda bu yüzden menü görünmemişti).
sayac = 0;
kameraX = 0;
muzPuan = 0;
bolumNo = 0;
can = CAN_BASLANGIC;
bolumYazi = 0;
bayrakSalla = 0;
bolumuKur(0);
durum = "menu";
kumandaAlaniniAyarla();      // dokunmatikse tuvali kumanda şeritleriyle kur
dongu();
</script>
