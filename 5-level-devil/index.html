    }),
    sahteKapi: (k.sahteKapi || []).map(function (d) {
      return { x: d[0], y: d[1], g: 46, h: 82, gitti: false, gulme: 0 };
    }),
    testereler: (k.testereler || []).map(function (t) {
      return { x0: t[0], x1: t[1], y0: t[2], y1: t[3], hiz: t[4], x: t[0], y: t[2], ilerle: 1, aci: 0 };
    }),
    roketler: (k.roketler || []).map(function (r) {
      return { bx: r[0], by: r[1], yon: r[2], t0: r[3], t1: r[4], x: r[0], y: r[1], hal: "hazir", omur: 0 };
    }),

    // --- BÖLÜM ÖZELLİKLERİ ---
    karanlik: !!k.karanlik,                    // sadece etrafını görürsün
    tersKontrol: !!k.tersKontrol,              // sol = sağ
    kaygan: !!k.kaygan,                        // buz gibi kayarsın
    yercekimiCarpani: k.yercekimiCarpani || 1, // 1'den küçük = ay yerçekimi

    kapi: { x: k.kapi[0], y: k.kapi[1], g: 46, h: 82, kacar: k.kapi[2], kactiMi: 0, sallan: 0 }
  };
  // hareketli platformlara kendi gidiş-geliş bilgisini ver
  bolum.platformlar.forEach(function (p, i) {
    var ham = k.platformlar[i];
    if (p.tip === "hareketli") {
      p.x0 = ham[4]; p.x1 = ham[5]; p.y0 = ham[6] !== undefined ? ham[6] : ham[1];
      p.y1 = ham[7] !== undefined ? ham[7] : ham[1];
      p.hiz = ham[8] || 1.6; p.ilerle = 1; p.dx = 0; p.dy = 0;
    }
  });
  oyuncu.x = k.baslaX; oyuncu.y = k.baslaY;
  oyuncu.vx = 0; oyuncu.vy = 0;
  oyuncu.yerde = false; oyuncu.yercekimiYon = 1;
  oyuncu.yon = 1; oyuncu.adim = 0;
  parcalar = [];
  mesajSure = 150;
  olumEfekti = 0;
}

function oyunuBaslat() {
  bolumNo = 0;
  olumSayaci = 0;
  sayac = 0; kameraX = 0;
  bolumuKur(0);
  durum = "oyun";
}

// ------------------- ÇARPIŞMA YARDIMCILARI -------------------
function carpisti(ax, ay, ag, ah, bx, by, bg, bh) {
  return ax < bx + bg && ax + ag > bx && ay < by + bh && ay + ah > by;
}

// ------------------- OYUNCU GÜNCELLE -------------------
function oyuncuGuncelle() {
  var sol = basili["ArrowLeft"] || basili["a"] || basili["A"] || dokunSol;
  var sag = basili["ArrowRight"] || basili["d"] || basili["D"] || dokunSag;
  var zipla = basili[" "] || basili["ArrowUp"] || basili["w"] || basili["W"] || dokunZipla;

  // TERS KONTROL bölümünde sol sağ olur (klasik troll)
  if (bolum.tersKontrol) { var gecici = sol; sol = sag; sag = gecici; }

  oyuncu.tasiyan = null;

  // --- yatay hareket ---
  var hedef = 0;
  if (sol) hedef -= YURUME_HIZI;
  if (sag) hedef += YURUME_HIZI;
  var guc = oyuncu.yerde ? 1 : HAVA_KONTROL;
  // BUZDA yavaş hızlanır, yavaş durursun — kayarsın!
  var tutus = bolum.kaygan ? 0.055 : 0.35;
  oyuncu.vx += (hedef - oyuncu.vx) * (tutus * guc + (bolum.kaygan ? 0.012 : 0.1));
  if (Math.abs(oyuncu.vx) < 0.05) oyuncu.vx = 0;
  if (hedef !== 0) oyuncu.yon = hedef > 0 ? 1 : -1;
  if (oyuncu.yerde && Math.abs(oyuncu.vx) > 0.5) oyuncu.adim += 0.28;
  else oyuncu.adim *= 0.9;

  // --- ters yerçekimi bölgesi ---
  var ters = false;
  for (var i = 0; i < bolum.tersAlan.length; i++) {
    var a = bolum.tersAlan[i];
    if (carpisti(oyuncu.x, oyuncu.y, oyuncu.g, oyuncu.h, a.x, a.y, a.g, a.h)) ters = true;
  }
  oyuncu.yercekimiYon = ters ? -1 : 1;

  // --- zıplama ---
  if (zipla && oyuncu.yerde && oyuncu.ziplayabilir) {
    oyuncu.vy = -ZIPLAMA_GUCU * oyuncu.yercekimiYon;
    oyuncu.yerde = false;
    oyuncu.ziplayabilir = false;
  }
  if (!zipla) oyuncu.ziplayabilir = true;

  // --- yerçekimi (AY bölümünde daha hafif: yükseğe zıplar, yavaş inersin) ---
  oyuncu.vy += YERCEKIMI * (bolum.yercekimiCarpani || 1) * oyuncu.yercekimiYon;
  if (oyuncu.vy > MAX_DUSME) oyuncu.vy = MAX_DUSME;
  if (oyuncu.vy < -MAX_DUSME) oyuncu.vy = -MAX_DUSME;

  // --- yatay taşı + duvar çarpışması ---
  oyuncu.x += oyuncu.vx;
  if (oyuncu.x < 0) { oyuncu.x = 0; oyuncu.vx = 0; }
  if (oyuncu.x + oyuncu.g > G) { oyuncu.x = G - oyuncu.g; oyuncu.vx = 0; }
  katiCisimler().forEach(function (p) {
    if (p.sadeceDikey) return;
    if (carpisti(oyuncu.x, oyuncu.y, oyuncu.g, oyuncu.h, p.x, p.y, p.g, p.h)) {
      if (oyuncu.vx > 0) oyuncu.x = p.x - oyuncu.g;
      else if (oyuncu.vx < 0) oyuncu.x = p.x + p.g;
      oyuncu.vx = 0;
      // görünmez duvara tosladın: artık görünüyor
      if (p.kaynak && p.kaynak.gorundu === false) { p.kaynak.gorundu = true; p.kaynak.parla = 22; titre = 9; }
    }
  });

  // --- dikey taşı ---
  oyuncu.yerde = false;
  oyuncu.y += oyuncu.vy;
  katiCisimler().forEach(function (p) {
    if (!carpisti(oyuncu.x, oyuncu.y, oyuncu.g, oyuncu.h, p.x, p.y, p.g, p.h)) return;
    if (p.sadeceDikey) {          // çöken tavan: HER ZAMAN yukarıdan bastırır
      oyuncu.y = p.y + p.h;
      if (oyuncu.vy < 0) oyuncu.vy = 0;
      return;
    }
    if (oyuncu.vy > 0) {          // aşağı iniyoruz
      oyuncu.y = p.y - oyuncu.h;
      oyuncu.vy = 0;
      if (oyuncu.yercekimiYon === 1) { oyuncu.yerde = true; zemineBastik(p); }
    } else if (oyuncu.vy < 0) {   // yukarı çıkıyoruz
      oyuncu.y = p.y + p.h;
      oyuncu.vy = 0;
      if (oyuncu.yercekimiYon === -1) { oyuncu.yerde = true; zemineBastik(p); }
    }
  });

  // hareketli platform üstündeysen seninle birlikte kayarsın
  if (oyuncu.tasiyan) {
    oyuncu.x += oyuncu.tasiyan.dx;
    oyuncu.y += oyuncu.tasiyan.dy;
    if (oyuncu.x < 0) oyuncu.x = 0;
    if (oyuncu.x + oyuncu.g > G) oyuncu.x = G - oyuncu.g;
  }

  // ekrandan düşmek = ölüm. Yukarısı sadece TERS yerçekiminde ölüm sayılır —
  // yoksa ay bölümünde yükseğe zıplayınca boşuna ölüyordun.
  if (oyuncu.y > Y + 60) olduk();
  else if (oyuncu.yercekimiYon === -1 && oyuncu.y < -80) olduk();
}

// oyuncunun çarpabileceği tüm katı dikdörtgenler
function katiCisimler() {
  var liste = [];
  bolum.platformlar.forEach(function (p) {
    if (p.gitti) return;
    liste.push({ x: p.x, y: p.y, g: p.g, h: ZEMIN_KALIN, kaynak: p });
  });
  bolum.kapananDuvar.forEach(function (d) {
    if (d.boy <= 0) return;
    var yy = d.yon === "asagi" ? 0 : Y - d.boy;
    liste.push({ x: d.x, y: yy, g: d.g, h: d.boy, kaynak: d });
  });
  bolum.cokenTavan.forEach(function (t) {
    // sadeceDikey: tavanın "yanı" yok — yoksa zıplayınca seni ekranın kenarına fırlatıyordu
    liste.push({ x: 0, y: 0, g: G, h: t.boy, kaynak: t, sadeceDikey: true });
  });
  bolum.gorunmezDuvar.forEach(function (d) {
    liste.push({ x: d.x, y: d.y, g: d.g, h: d.h, kaynak: d });
  });
  return liste;
}

function zemineBastik(p) {
  var kaynak = p.kaynak;
  if (!kaynak || !kaynak.tip) return;
  if (kaynak.tip === "kayip") kaynak.sayac = Math.max(kaynak.sayac, 1);
  if (kaynak.tip === "sahte") { kaynak.gitti = true; titre = 8; }
  if (kaynak.tip === "yay") {
    oyuncu.vy = -YAY_GUCU * oyuncu.yercekimiYon;
    oyuncu.yerde = false;
    kaynak.yaySikis = 12;
  }
  if (kaynak.tip === "hareketli") oyuncu.tasiyan = kaynak;   // platform seni taşısın
}

// Ray üzerinde gidip gelen şeyler (testere, hareketli platform) için ortak hareket.
// Ne kadar yol gidildiğini SAYIYLA tutar — yoksa hızlı giden bir şey dönüş
// noktasını atlayıp sonsuza kadar kayıp gidiyordu.
function raydaYuru(o) {
  var hx = o.x1 - o.x0, hy = o.y1 - o.y0;
  var uzunluk = Math.sqrt(hx * hx + hy * hy) || 1;
  if (o.yol === undefined) o.yol = 0;
  o.yol += o.hiz * o.ilerle;
  if (o.yol >= uzunluk) { o.yol = uzunluk; o.ilerle = -1; }
  if (o.yol <= 0) { o.yol = 0; o.ilerle = 1; }
  o.x = o.x0 + (hx / uzunluk) * o.yol;
  o.y = o.y0 + (hy / uzunluk) * o.yol;
}

// ------------------- TUZAKLARI GÜNCELLE -------------------
function tuzaklariGuncelle() {
  var om = oyuncu.x + oyuncu.g / 2;   // oyuncunun ortası

  // kaybolan zeminler
  bolum.platformlar.forEach(function (p) {
    if (p.tip === "kayip" && p.sayac > 0 && !p.gitti) {
      p.sayac++;
      if (p.sayac > KAYIP_ZEMIN_SURE) { p.gitti = true; titre = 6; }
    }
    if (p.yaySikis > 0) p.yaySikis--;
  });

  // tavandan inen dikenler — iner, bekler, geri çekilir (yoksa bölüm kilitlenirdi)
  bolum.tavanDiken.forEach(function (d) {
    if (d.hal === "hazir" && om > d.t0 && om < d.t1) { d.hal = "iniyor"; titre = 10; }
    else if (d.hal === "iniyor") {
      d.y += DIKEN_INME_HIZI;
      if (d.y >= Y - 60) { d.y = Y - 60; d.hal = "bekliyor"; d.bek = TUZAK_BEKLEME; titre = 6; }
    } else if (d.hal === "bekliyor") {
      d.bek--;
      if (d.bek <= 0) d.hal = "cekiliyor";
    } else if (d.hal === "cekiliyor") {
      d.y -= TUZAK_GERI_HIZI;
      if (d.y <= -70) { d.y = -70; d.hal = "bitti"; }   // tek atışlık: bir daha inmez
    }
  });

  // kapanan duvarlar — kapanır, bekler, tekrar açılır
  bolum.kapananDuvar.forEach(function (d) {
    if (d.hal === "hazir" && om > d.t0 && om < d.t1) { d.hal = "kapaniyor"; titre = 12; }
    else if (d.hal === "kapaniyor") {
      d.boy += KAPI_KAPANMA_HIZI;
      if (d.boy >= Y - 90) { d.boy = Y - 90; d.hal = "bekliyor"; d.bek = TUZAK_BEKLEME; }
    } else if (d.hal === "bekliyor") {
      d.bek--;
      if (d.bek <= 0) d.hal = "aciliyor";
    } else if (d.hal === "aciliyor") {
      d.boy -= TUZAK_GERI_HIZI;
      if (d.boy <= 0) { d.boy = 0; d.hal = "bitti"; }   // tek atışlık: bir daha kapanmaz
    }
  });

  // --- ÇÖKEN TAVAN: tetiklenince yavaşça iner, durY'de durur (ezilirsen ölürsün) ---
  bolum.cokenTavan.forEach(function (t) {
    if (t.hal === "hazir" && om > t.t0 && om < t.t1) { t.hal = "cokuyor"; titre = 10; }
    if (t.hal === "cokuyor") {
      t.boy += COKEN_TAVAN_HIZI;
      if (sayac % 8 === 0) titre = 4;
      if (t.boy >= t.durY) { t.boy = t.durY; t.hal = "durdu"; }
    }
  });

  // --- HAREKETLİ PLATFORMLAR: iki nokta arasında gidip gelirler ---
  bolum.platformlar.forEach(function (p) {
    if (p.tip !== "hareketli") return;
    var eskiX = p.x, eskiY = p.y;
    raydaYuru(p);
    p.dx = p.x - eskiX; p.dy = p.y - eskiY;
    // Yukarı çıkan platform oyuncuyu yakalarsa YANA itmesin, üstüne alsın
    if (p.dy < 0 && carpisti(oyuncu.x, oyuncu.y, oyuncu.g, oyuncu.h, p.x, p.y, p.g, ZEMIN_KALIN)) {
      if (oyuncu.y + oyuncu.h < p.y + ZEMIN_KALIN) {
        oyuncu.y = p.y - oyuncu.h;
        oyuncu.vy = 0;
        oyuncu.yerde = true;
        oyuncu.tasiyan = p;
      }
    }
  });

  // --- TESTERELER: rayda gidip gelen dönen testere ---
  bolum.testereler.forEach(function (t) {
    t.aci += 0.35;
    raydaYuru(t);
  });

  // --- ROKETLER: tetiklenince duvardan fırlar, peşine düşer ---
  bolum.roketler.forEach(function (r) {
    if (r.hal === "hazir" && om > r.t0 && om < r.t1) {
      r.hal = "ucuyor"; r.x = r.bx; r.y = r.by; r.omur = 260; titre = 8;
    }
    if (r.hal === "ucuyor") {
      r.x += ROKET_HIZI * r.yon;
      // hafifçe oyuncunun boyuna doğru döner (tam takip etmez, kaçabilirsin)
      var fark = (oyuncu.y + oyuncu.h / 2) - (r.y + 8);
      r.y += Math.max(-ROKET_TAKIP, Math.min(ROKET_TAKIP, fark * 0.05));
      r.omur--;
      if (r.omur <= 0 || r.x < -60 || r.x > G + 60) r.hal = "bitti";
    }
  });

  // --- SAHTE KAPI: dokununca kaybolur ve seninle dalga geçer ---
  bolum.sahteKapi.forEach(function (sk) {
    if (sk.gulme > 0) sk.gulme--;
    if (sk.gitti) return;
    if (carpisti(oyuncu.x, oyuncu.y, oyuncu.g, oyuncu.h, sk.x + 8, sk.y, sk.g - 16, sk.h)) {
      sk.gitti = true; sk.gulme = 90; titre = 12;
      mesajSure = 100;
      bolum.mesaj = "HAHA! Sahte kapıydı!";
    }
  });

  // kaçan kapı
  var k = bolum.kapi;
  k.sallan += 0.08;
  if (k.kacar && k.kactiMi < 2) {
    var uzaklik = Math.abs((oyuncu.x + oyuncu.g / 2) - (k.x + k.g / 2));
    if (uzaklik < KACAN_KAPI_MESAFE) {
      k.kactiMi++;
      titre = 9;
      if (k.kactiMi === 1) k.x = Math.max(40, k.x - 330);   // birinci kaçış: geriye
      else k.x = Math.min(G - k.g - 20, k.x + 300);          // ikinci: tekrar ileri
      mesajSure = 90;
      bolum.mesaj = k.kactiMi === 1 ? "Hah! Yakalayamadın!" : "Tamam tamam, son kez...";
    }
  }
}

// ------------------- ÖLÜM & BİTİŞ -------------------
function olduk() {
  if (durum !== "oyun") return;
  durum = "olum";
  olumEfekti = OLUM_SURESI;
  olumSayaci++;
  kayit.toplamOlum = (kayit.toplamOlum || 0) + 1;
  kaydiYaz();
  titre = 14;
  parcalar = [];
  for (var i = 0; i < 22; i++) {
    parcalar.push({
      x: oyuncu.x + oyuncu.g / 2, y: oyuncu.y + oyuncu.h / 2,
      vx: (Math.random() - 0.5) * 11, vy: (Math.random() - 0.9) * 10,
      b: 2 + Math.random() * 4, don: Math.random() * 6
    });
  }
}

function olumKontrolu() {
  // yerdeki dikenler
  for (var i = 0; i < bolum.dikenler.length; i++) {
    var d = bolum.dikenler[i];
    if (carpisti(oyuncu.x + 3, oyuncu.y + 4, oyuncu.g - 6, oyuncu.h - 4, d.x, d.y - 14, d.g, 22)) { olduk(); return; }
  }
  // tavandan inen dikenler (uç kısmı öldürür)
  for (var j = 0; j < bolum.tavanDiken.length; j++) {
    var t = bolum.tavanDiken[j];
    if (t.y < -60) continue;
    if (carpisti(oyuncu.x + 3, oyuncu.y + 3, oyuncu.g - 6, oyuncu.h - 6, t.x, t.y, t.g, 62)) { olduk(); return; }
  }
  // testereler
  for (var s = 0; s < bolum.testereler.length; s++) {
    var ts = bolum.testereler[s];
    if (carpisti(oyuncu.x + 3, oyuncu.y + 3, oyuncu.g - 6, oyuncu.h - 6,
                 ts.x - TESTERE_R + 5, ts.y - TESTERE_R + 5, TESTERE_R * 2 - 10, TESTERE_R * 2 - 10)) { olduk(); return; }
  }
  // roketler
  for (var r = 0; r < bolum.roketler.length; r++) {
    var rk = bolum.roketler[r];
    if (rk.hal !== "ucuyor") continue;
    if (carpisti(oyuncu.x + 3, oyuncu.y + 3, oyuncu.g - 6, oyuncu.h - 6, rk.x - 14, rk.y - 2, 28, 18)) { olduk(); return; }
  }
  // çöken tavanla ezilme
  for (var c = 0; c < bolum.cokenTavan.length; c++) {
    var ct = bolum.cokenTavan[c];
    if (oyuncu.yerde && oyuncu.y < ct.boy) { olduk(); return; }
  }
}

function kapiKontrolu() {
  var k = bolum.kapi;
  if (carpisti(oyuncu.x, oyuncu.y, oyuncu.g, oyuncu.h, k.x + 8, k.y, k.g - 16, k.h)) {
    bolumNo++;
    if (bolumNo > kayit.enIyiBolum) { kayit.enIyiBolum = bolumNo; kaydiYaz(); }
    if (bolumNo >= BOLUMLER.length) {
      durum = "kazandi";
      kayit.bitirdi = true;
      kaydiYaz();
    } else {
      bolumuKur(bolumNo);
    }
  }
}

// ------------------- ÇİZİM -------------------
function arkaPlaniCiz() {
  var gr = cx.createLinearGradient(0, 0, 0, Y);
  gr.addColorStop(0, "#241041");
  gr.addColorStop(1, "#0d0819");
  cx.fillStyle = gr;
  cx.fillRect(0, 0, G, Y);

  // arka planda hafif kareler (ızgara)
  cx.strokeStyle = "rgba(255,255,255,0.04)";
  cx.lineWidth = 1;
  for (var x = 0; x < G; x += 40) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, Y); cx.stroke(); }
  for (var y = 0; y < Y; y += 40) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(G, y); cx.stroke(); }

  // arkada süzülen şeytani gözler
  for (var i = 0; i < 3; i++) {
    var gx = 130 + i * 260 + Math.sin(sayac * 0.012 + i) * 22;
    var gy = 120 + Math.cos(sayac * 0.009 + i * 2) * 26;
    cx.globalAlpha = 0.13 + Math.sin(sayac * 0.03 + i) * 0.05;
    cx.fillStyle = "#ff4d6d";
    cx.beginPath(); cx.ellipse(gx - 13, gy, 10, 6, 0, 0, 7); cx.fill();
    cx.beginPath(); cx.ellipse(gx + 13, gy, 10, 6, 0, 0, 7); cx.fill();
    cx.globalAlpha = 1;
  }
}

function platformlariCiz() {
  bolum.platformlar.forEach(function (p) {
    if (p.gitti) return;
    var yy = p.y + (p.yaySikis > 0 ? 5 : 0);
    var kalin = ZEMIN_KALIN - (p.yaySikis > 0 ? 5 : 0);

    if (p.tip === "yay") {
      // yay: zikzak gövde + üstünde tabla
      cx.strokeStyle = "#7fe0ff"; cx.lineWidth = 4;
      cx.beginPath();
      for (var i = 0; i <= 6; i++) {
        var zx = p.x + 8 + (p.g - 16) * (i % 2);
        var zy = yy + kalin - i * (kalin / 6);
        if (i === 0) cx.moveTo(zx, zy); else cx.lineTo(zx, zy);
      }
      cx.stroke();
      cx.fillStyle = "#7fe0ff";
      cx.fillRect(p.x, yy, p.g, 8);
      cx.fillStyle = "#0d0819";
      cx.fillRect(p.x + 6, yy + 2, p.g - 12, 3);
      return;
    }

    var ust = "#8f7ec9", govde = "#4a3a78";
    if (p.tip === "kayip") {
      var kalan = p.sayac > 0 ? 1 - p.sayac / KAYIP_ZEMIN_SURE : 1;
      cx.globalAlpha = p.sayac > 0 ? 0.35 + kalan * 0.65 : 1;
      ust = "#ffb35c"; govde = "#8a4a1c";
      if (p.sayac > 0) {
        // titreme
        cx.save();
        cx.translate(Math.sin(sayac * 0.9) * 2.5, 0);
      }
    }
    if (p.tip === "sahte") { ust = "#8f7ec9"; govde = "#4a3a78"; }
    if (p.tip === "hareketli") { ust = "#7fe0a0"; govde = "#2c6b48"; }
    if (bolum.kaygan && p.tip === "normal") { ust = "#bfe9ff"; govde = "#3f7ea6"; }   // buz

    cx.fillStyle = govde;
    cx.fillRect(p.x, yy, p.g, kalin);
    cx.fillStyle = ust;
    cx.fillRect(p.x, yy, p.g, 6);
    cx.strokeStyle = "rgba(0,0,0,0.45)"; cx.lineWidth = 2;
    cx.strokeRect(p.x, yy, p.g, kalin);

    if (p.tip === "kayip" && p.sayac > 0) cx.restore();
    cx.globalAlpha = 1;
  });
}

function dikenSirasiCiz(x, y, genislik, yukari) {
  // yukari = true ise dikenler yukarı bakar (yerdeki dikenler)
  var adet = Math.max(1, Math.floor(genislik / 18));
  var w = genislik / adet;
  cx.fillStyle = "#c9d4e0";
  cx.strokeStyle = "#5a6472"; cx.lineWidth = 1.6;
  for (var i = 0; i < adet; i++) {
    var sx = x + i * w;
    cx.beginPath();
    if (yukari) { cx.moveTo(sx, y); cx.lineTo(sx + w / 2, y - 20); cx.lineTo(sx + w, y); }
    else { cx.moveTo(sx, y); cx.lineTo(sx + w / 2, y + 20); cx.lineTo(sx + w, y); }
    cx.closePath(); cx.fill(); cx.stroke();
  }
}

function dikenleriCiz() {
  bolum.dikenler.forEach(function (d) {
    cx.fillStyle = "#2a1b3f";
    cx.fillRect(d.x, d.y, d.g, Y - d.y);
    dikenSirasiCiz(d.x, d.y, d.g, true);
  });

  bolum.tavanDiken.forEach(function (t) {
    // tetik bölgesi belirsiz olsun diye çizilmez — sürpriz!
    if (t.y < -60) return;
    cx.fillStyle = "#3a2450";
    cx.fillRect(t.x, t.y - 30, t.g, 32);
    cx.strokeStyle = "#1c1030"; cx.lineWidth = 2;
    cx.strokeRect(t.x, t.y - 30, t.g, 32);
    dikenSirasiCiz(t.x, t.y + 2, t.g, false);
    // zincir
    cx.strokeStyle = "#6b5b8f"; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(t.x + t.g / 2, 0); cx.lineTo(t.x + t.g / 2, t.y - 28); cx.stroke();
  });
}

function duvarlariCiz() {
  bolum.kapananDuvar.forEach(function (d) {
    if (d.boy <= 0) return;
    var yy = d.yon === "asagi" ? 0 : Y - d.boy;
    cx.fillStyle = "#5b3a7a";
    cx.fillRect(d.x, yy, d.g, d.boy);
    cx.fillStyle = "#7d54a3";
    cx.fillRect(d.x, d.yon === "asagi" ? yy + d.boy - 8 : yy, d.g, 8);
    cx.strokeStyle = "#1c1030"; cx.lineWidth = 2;
    cx.strokeRect(d.x, yy, d.g, d.boy);
  });
}

// --- YENİ TUZAKLARIN ÇİZİMİ ---
function cokenTavaniCiz() {
  bolum.cokenTavan.forEach(function (t) {
    var sars = t.hal === "cokuyor" ? Math.sin(sayac * 0.8) * 1.6 : 0;
    cx.fillStyle = "#3d2a5c";
    cx.fillRect(0, 0, G, t.boy + sars);
    cx.fillStyle = "#5b3a7a";
    cx.fillRect(0, t.boy - 10 + sars, G, 10);
    // alt kenardaki tehdit dişleri
    dikenSirasiCiz(0, t.boy + sars, G, false);
    if (t.hal === "cokuyor") {
      cx.fillStyle = "#ff4d6d";
      cx.font = "700 15px Nunito, Arial";
      cx.textAlign = "center";
      cx.fillText("TAVAN ÇÖKÜYOR!", G / 2, t.boy + 46 + sars);
      cx.textAlign = "left";
    }
  });
}

function gorunmezDuvarlariCiz() {
  bolum.gorunmezDuvar.forEach(function (d) {
    if (!d.gorundu) return;                    // tosla ki görünsün!
    if (d.parla > 0) d.parla--;
    cx.globalAlpha = d.parla > 0 ? 0.55 + Math.sin(sayac) * 0.3 : 0.42;
    cx.fillStyle = "#9ad8ff";
    cx.fillRect(d.x, d.y, d.g, d.h);
    cx.globalAlpha = 1;
    cx.strokeStyle = "#9ad8ff"; cx.lineWidth = 2;
    cx.setLineDash([8, 6]);
    cx.strokeRect(d.x, d.y, d.g, d.h);
    cx.setLineDash([]);
  });
}

function sahteKapilariCiz() {
  bolum.sahteKapi.forEach(function (sk) {
    if (sk.gitti) {
      if (sk.gulme > 0) {   // kaybolurken sırıtan ağız
        cx.globalAlpha = sk.gulme / 90;
        cx.fillStyle = "#ff4d6d";
        cx.font = "700 34px Fredoka, Nunito, Arial";
        cx.textAlign = "center";
        cx.fillText("HA HA!", sk.x + sk.g / 2, sk.y + 40 - (90 - sk.gulme) * 0.4);
        cx.textAlign = "left";
        cx.globalAlpha = 1;
      }
      return;
    }
    // gerçek kapıdan ayırt edilemez çizilir (troll!)
    var sal = Math.sin(sayac * 0.05) * 2;
    cx.fillStyle = "#3a2a12";
    cx.fillRect(sk.x - 4, sk.y - 4 + sal, sk.g + 8, sk.h + 4);
    var gr = cx.createLinearGradient(sk.x, sk.y, sk.x + sk.g, sk.y);
    gr.addColorStop(0, "#ffd84d"); gr.addColorStop(1, "#f0a92a");
    cx.fillStyle = gr;
    cx.fillRect(sk.x, sk.y + sal, sk.g, sk.h);
    cx.strokeStyle = "#7a4d0a"; cx.lineWidth = 2.5;
    cx.strokeRect(sk.x, sk.y + sal, sk.g, sk.h);
    cx.fillStyle = "#7a4d0a";
    cx.beginPath(); cx.arc(sk.x + sk.g - 11, sk.y + sk.h / 2 + sal, 4, 0, 7); cx.fill();
  });
}

function testereleriCiz() {
  bolum.testereler.forEach(function (t) {
    // ray
    cx.strokeStyle = "rgba(255,255,255,0.14)"; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(t.x0, t.y0); cx.lineTo(t.x1, t.y1); cx.stroke();

    cx.save();
    cx.translate(t.x, t.y);
    cx.rotate(t.aci);
    cx.fillStyle = "#c9d4e0";
    cx.strokeStyle = "#5a6472"; cx.lineWidth = 2;
    cx.beginPath();
    for (var i = 0; i < 12; i++) {
      var a1 = (i / 12) * Math.PI * 2, a2 = ((i + 0.5) / 12) * Math.PI * 2;
      cx.lineTo(Math.cos(a1) * TESTERE_R, Math.sin(a1) * TESTERE_R);
      cx.lineTo(Math.cos(a2) * (TESTERE_R - 8), Math.sin(a2) * (TESTERE_R - 8));
    }
    cx.closePath(); cx.fill(); cx.stroke();
    cx.fillStyle = "#5a6472";
    cx.beginPath(); cx.arc(0, 0, 5, 0, 7); cx.fill();
    cx.restore();
  });
}

function roketleriCiz() {
  bolum.roketler.forEach(function (r) {
    if (r.hal !== "ucuyor") return;
    cx.save();
    cx.translate(r.x, r.y + 8);
    cx.scale(r.yon, 1);
    // alev
    var alev = 10 + Math.random() * 10;
    cx.fillStyle = "#ffb35c";
    cx.beginPath(); cx.moveTo(-13, -5); cx.lineTo(-13 - alev, 0); cx.lineTo(-13, 5); cx.closePath(); cx.fill();
    cx.fillStyle = "#ff4d6d";
    cx.beginPath(); cx.moveTo(-13, -3); cx.lineTo(-13 - alev * 0.6, 0); cx.lineTo(-13, 3); cx.closePath(); cx.fill();
    // gövde
    cx.fillStyle = "#e6ebf2";
    cx.beginPath();
    cx.moveTo(14, 0); cx.lineTo(2, -7); cx.lineTo(-13, -7); cx.lineTo(-13, 7); cx.lineTo(2, 7);
    cx.closePath(); cx.fill();
    cx.strokeStyle = "#5a6472"; cx.lineWidth = 2; cx.stroke();
    cx.fillStyle = "#ff4d6d";
    cx.beginPath(); cx.moveTo(14, 0); cx.lineTo(4, -6); cx.lineTo(4, 6); cx.closePath(); cx.fill();
    cx.restore();
  });
}

// KARANLIK bölüm: oyuncunun etrafı hariç her şey karanlık
function karanligiCiz() {
  if (!bolum.karanlik) return;
  var mx = oyuncu.x + oyuncu.g / 2, my = oyuncu.y + oyuncu.h / 2;
  var r = 118 + Math.sin(sayac * 0.08) * 6;      // fener hafifçe titrer
  var gr = cx.createRadialGradient(mx, my, r * 0.35, mx, my, r);
  gr.addColorStop(0, "rgba(8,4,18,0)");
  gr.addColorStop(0.75, "rgba(8,4,18,0.72)");
  gr.addColorStop(1, "rgba(8,4,18,0.97)");
  cx.fillStyle = gr;
  cx.fillRect(0, 0, G, Y);
  // köşeler tamamen karanlık kalsın
  cx.fillStyle = "rgba(8,4,18,0.97)";
  cx.fillRect(0, 0, G, Math.max(0, my - r));
  cx.fillRect(0, Math.min(Y, my + r), G, Y);
  cx.fillRect(0, 0, Math.max(0, mx - r), Y);
  cx.fillRect(Math.min(G, mx + r), 0, G, Y);
}

function tersAlanlariCiz() {
  bolum.tersAlan.forEach(function (a) {
    cx.fillStyle = "rgba(150, 90, 255, 0.13)";
    cx.fillRect(a.x, a.y, a.g, a.h);
    cx.strokeStyle = "rgba(190, 140, 255, 0.5)";
    cx.setLineDash([10, 8]); cx.lineWidth = 2;
    cx.strokeRect(a.x, a.y, a.g, a.h);
    cx.setLineDash([]);
    // yukarı akan oklar
    cx.strokeStyle = "rgba(200, 160, 255, 0.55)"; cx.lineWidth = 3;
    for (var i = 0; i < 4; i++) {
      var ox = a.x + a.g * (0.2 + i * 0.2);
      var oy = a.y + a.h - ((sayac * 2.2 + i * 90) % a.h);
      cx.beginPath();
      cx.moveTo(ox, oy + 12); cx.lineTo(ox, oy - 12);
      cx.moveTo(ox - 7, oy - 4); cx.lineTo(ox, oy - 13); cx.lineTo(ox + 7, oy - 4);
      cx.stroke();
    }
  });
}

function kapiyiCiz() {
  var k = bolum.kapi;
  var sal = Math.sin(k.sallan) * 2;
  cx.fillStyle = "#3a2a12";
  cx.fillRect(k.x - 4, k.y - 4 + sal, k.g + 8, k.h + 4);

  gr.addColorStop(0, "#ffd84d"); gr.addColorStop(1, "#f0a92a");
  cx.fillStyle = gr;
  cx.fillRect(k.x, k.y + sal, k.g, k.h);
  cx.strokeStyle = "#7a4d0a"; cx.lineWidth = 2.5;
  cx.strokeRect(k.x, k.y + sal, k.g, k.h);
  cx.fillStyle = "#7a4d0a";
  cx.beginPath(); cx.arc(k.x + k.g - 11, k.y + k.h / 2 + sal, 4, 0, 7); cx.fill();
  // parlama
  cx.globalAlpha = 0.25 + Math.sin(sayac * 0.06) * 0.15;
  cx.fillStyle = "#fff8c0";
  cx.fillRect(k.x - 10, k.y - 10 + sal, k.g + 20, k.h + 20);

}

// --- ÇÖP ADAM ---
function copAdamCiz(x, y, g, h, yon, adim, havada, ters) {
  cx.save();
  cx.translate(x + g / 2, y + h / 2);
  if (ters) cx.scale(1, -1);
  cx.translate(0, -h / 2);

  cx.strokeStyle = "#fff";
  cx.lineWidth = 3.4;
  cx.lineCap = "round";
  cx.fillStyle = "#fff";

  var kafaR = 7.5;
  var boyunY = kafaR * 2 + 1;
  var kalcaY = h - 13;

  // kafa
  cx.beginPath(); cx.arc(0, kafaR + 1, kafaR, 0, 7); cx.fill();
  // gözler (koyu)
  cx.fillStyle = "#170d2b";
  cx.beginPath(); cx.arc(yon * 2.4 - 2.2, kafaR, 1.5, 0, 7); cx.fill();
  cx.beginPath(); cx.arc(yon * 2.4 + 2.2, kafaR, 1.5, 0, 7); cx.fill();
  cx.fillStyle = "#fff";

  // gövde
  cx.beginPath(); cx.moveTo(0, boyunY); cx.lineTo(0, kalcaY); cx.stroke();

  var s = Math.sin(adim), c = Math.cos(adim);
  // kollar
  cx.beginPath();
  if (havada) {
    cx.moveTo(0, boyunY + 4); cx.lineTo(-9, boyunY - 6);
    cx.moveTo(0, boyunY + 4); cx.lineTo(9, boyunY - 6);
  } else {
    cx.moveTo(0, boyunY + 3); cx.lineTo(-8, boyunY + 12 + s * 5);
    cx.moveTo(0, boyunY + 3); cx.lineTo(8, boyunY + 12 - s * 5);
  }
  cx.stroke();

  // bacaklar
  cx.beginPath();
  if (havada) {
    cx.moveTo(0, kalcaY); cx.lineTo(-7, h - 2);
    cx.moveTo(0, kalcaY); cx.lineTo(8, h - 5);
  } else {
    cx.moveTo(0, kalcaY); cx.lineTo(-6 + c * 6, h);
    cx.moveTo(0, kalcaY); cx.lineTo(6 - c * 6, h);
  }
  cx.stroke();

  cx.restore();
}

function oyuncuyuCiz() {
  copAdamCiz(oyuncu.x, oyuncu.y, oyuncu.g, oyuncu.h, oyuncu.yon,
             oyuncu.adim, !oyuncu.yerde, oyuncu.yercekimiYon === -1);
}

function parcalariCiz() {

  parcalar.forEach(function (p) {

    cx.translate(p.x, p.y);
    cx.rotate(p.don);
    cx.fillRect(-p.b / 2, -p.b / 2, p.b, p.b * 2.2);

}

}

// ------------------- DOKUNMATİK DÜĞMELER -------------------
var dokunSol = false, dokunSag = false, dokunZipla = false;
var dokunmatik = false;

function dugmeler() {
  return {
    sol:   { x: 24,  y: Y - 96, g: 76, h: 72, yazi: "◀" },
    sag:   { x: 116, y: Y - 96, g: 76, h: 72, yazi: "▶" },
    zipla: { x: G - 116, y: Y - 104, g: 92, h: 84, yazi: "⤒" }
  };
}

function dugmeleriCiz() {
  if (!dokunmatik) return;
  var d = dugmeler();
  [["sol", dokunSol], ["sag", dokunSag], ["zipla", dokunZipla]].forEach(function (par) {
    var b = d[par[0]], basik = par[1];
    cx.globalAlpha = basik ? 0.55 : 0.28;
    cx.fillStyle = "#fff";
    cx.beginPath();
    cx.roundRect ? cx.roundRect(b.x, b.y, b.g, b.h, 16) : cx.rect(b.x, b.y, b.g, b.h);
    cx.fill();
    cx.globalAlpha = basik ? 1 : 0.8;
    cx.fillStyle = "#1a1030";
    cx.font = "700 30px Nunito, Arial";
    cx.textAlign = "center";
    cx.fillText(b.yazi, b.x + b.g / 2, b.y + b.h / 2 + 11);
    cx.textAlign = "left";
    cx.globalAlpha = 1;
  });
}

// ------------------- ANA DÖNGÜ -------------------
function dongu() {
  sayac++;
  if (titre > 0) titre--;

  cx.save();
  if (titre > 0) cx.translate((Math.random() - 0.5) * titre, (Math.random() - 0.5) * titre);

  if (durum === "menu") {
    menuyuCiz();
  } else if (durum === "kazandi") {
    kazandiEkraniCiz();
  } else {
    if (durum === "oyun") {
      oyuncuGuncelle();
      tuzaklariGuncelle();
      olumKontrolu();
      if (durum === "oyun") kapiKontrolu();
    }

    arkaPlaniCiz();
    tersAlanlariCiz();
    platformlariCiz();
    duvarlariCiz();
    gorunmezDuvarlariCiz();
    dikenleriCiz();
    testereleriCiz();
    roketleriCiz();
    cokenTavaniCiz();
    sahteKapilariCiz();
    kapiyiCiz();

    if (durum === "olum") {
      parcalar.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.55; p.don += 0.2;
      });
      parcalariCiz();
      olumEfekti--;
      cx.textAlign = "center";
      cx.fillStyle = "#ff4d6d";
      cx.font = "700 44px Fredoka, Nunito, Arial";
      cx.fillText("ÖLDÜN!", G / 2, 230);
      cx.textAlign = "left";
      if (olumEfekti <= 0) { bolumuKur(bolumNo); durum = "oyun"; }
    } else {
      oyuncuyuCiz();
    }

    karanligiCiz();
    arayuzuCiz();
    dugmeleriCiz();
  }

  cx.restore();
  requestAnimationFrame(dongu);
}

// ------------------- KONTROLLER -------------------
document.addEventListener("keydown", function (e) {
  basili[e.key] = true;
  if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.key) >= 0) e.preventDefault();
  if (e.key === "r" || e.key === "R") { if (durum === "oyun" || durum === "olum") { bolumuKur(bolumNo); durum = "oyun"; } }
  if (e.key === "f" || e.key === "F") tamEkranDegistir();
  if (e.key === "Enter" || e.key === " ") {
    if (durum === "menu") oyunuBaslat();
    else if (durum === "kazandi") oyunuBaslat();
  }
});
document.addEventListener("keyup", function (e) { basili[e.key] = false; });

// fare / dokunma
function tuvalKoordinati(olay) {
  var kutu = tuval.getBoundingClientRect();
  return {
    x: (olay.clientX - kutu.left) * (G / kutu.width),
    y: (olay.clientY - kutu.top) * (Y / kutu.height)
  };
}

tuval.addEventListener("click", function (olay) {
  var p = tuvalKoordinati(olay);
  if (durum === "menu" || durum === "kazandi") {
    var by = durum === "menu" ? 450 : 440;
    if (p.x > G / 2 - 110 && p.x < G / 2 + 110 && p.y > by - 12 && p.y < by + 68) oyunuBaslat();
  }
});

function dokunmalariIsle(olay) {
  dokunmatik = true;
  dokunSol = dokunSag = dokunZipla = false;
  var d = dugmeler();
  for (var i = 0; i < olay.touches.length; i++) {
    var p = tuvalKoordinati(olay.touches[i]);
    if (p.x > d.sol.x - 12 && p.x < d.sol.x + d.sol.g + 12 && p.y > d.sol.y - 12) dokunSol = true;
    else if (p.x > d.sag.x - 12 && p.x < d.sag.x + d.sag.g + 12 && p.y > d.sag.y - 12) dokunSag = true;
    else if (p.x > d.zipla.x - 14 && p.x < d.zipla.x + d.zipla.g + 14 && p.y > d.zipla.y - 14) dokunZipla = true;
    else if (durum === "menu" || durum === "kazandi") {
      var by = durum === "menu" ? 450 : 440;
      if (p.x > G / 2 - 110 && p.x < G / 2 + 110 && p.y > by - 12 && p.y < by + 68) oyunuBaslat();
    }
  }
}
tuval.addEventListener("touchstart", function (e) { e.preventDefault(); dokunmalariIsle(e); }, { passive: false });
tuval.addEventListener("touchmove", function (e) { e.preventDefault(); dokunmalariIsle(e); }, { passive: false });
tuval.addEventListener("touchend", function (e) { e.preventDefault(); dokunmalariIsle(e); }, { passive: false });
tuval.addEventListener("touchcancel", function (e) { dokunSol = dokunSag = dokunZipla = false; }, { passive: true });
if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) dokunmatik = true;

// ------------------- EKRAN MOTORU (tüm oyunlarda ortak) -------------------
var sahne = document.getElementById("sahne");

function olcuAyarla() {
  var tamEkranda = !!(document.fullscreenElement || document.webkitFullscreenElement);
  var gEn = window.innerWidth, gBoy = window.innerHeight;
  if (window.visualViewport) { gEn = window.visualViewport.width; gBoy = window.visualViewport.height; }
  // ipucu satırı telefonda gizli — sadece görünüyorsa ona yer ayır
  var ipucu = document.getElementById("ipucu");
  if (!tamEkranda && ipucu && ipucu.offsetParent !== null) gBoy -= 40;
  var olcek = Math.min(gEn / G, gBoy / Y);
  if (!tamEkranda) olcek = Math.min(olcek, 1);       // masaüstünde 800x600'ü aşma
  tuval.style.width = Math.round(G * olcek) + "px";
  tuval.style.height = Math.round(Y * olcek) + "px";
}
window.addEventListener("resize", olcuAyarla);
window.addEventListener("orientationchange", olcuAyarla);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", olcuAyarla);
  window.visualViewport.addEventListener("scroll", olcuAyarla);
}
document.addEventListener("fullscreenchange", olcuAyarla);
document.addEventListener("webkitfullscreenchange", olcuAyarla);

function tamEkranDegistir() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } else {
    if (sahne.requestFullscreen) sahne.requestFullscreen();
    else if (sahne.webkitRequestFullscreen) sahne.webkitRequestFullscreen();
    if (screen.orientation && screen.orientation.lock) {
      try { screen.orientation.lock("landscape").catch(function () {}); } catch (e) {}
    }
  }
  setTimeout(olcuAyarla, 120);
}
document.getElementById("tamekranDugme").addEventListener("click", tamEkranDegistir);

bolumuKur(0);
olcuAyarla();
dongu();
