// ===========================================================
//   BOSS  (senin fikrin!)
//   Her bölümün sonunda bir boss çıkar. Onun da 9 kuyruğu vardır
//   ve KUYRUKLARINI SAVURARAK vurur. Her boss öncekinden güçlüdür.
//   Kedi X ile çakra topu atar, C ile kendi kuyruklarını savurur.
// ===========================================================
function bossCani(sira) {
  if (sira <= BOSS_CANLARI.length) return BOSS_CANLARI[sira - 1];
  return BOSS_CANLARI[BOSS_CANLARI.length - 1] + (sira - BOSS_CANLARI.length) * BOSS_CAN_ARTIS;
}

function bossCagir() {
  bossCikti[bolum] = true;
  bossSayisi++;
  var bcan = bossCani(bossSayisi);
  boss = {
    x: GENISLIK / 2,
    y: -BOSS_BOYU,
    hedefY: 210,
    can: bcan, maxCan: bcan,
    sira: bossSayisi,
    ad: BOSS_ADLARI[(bossSayisi - 1) % BOSS_ADLARI.length],
    giris: 70,
    vurusSayac: BOSS_VURUS_ARASI,
    hazirlik: 0, savurma: 0, vurduMu: false,
    yanip: 0, sallan: 0,
    ozellikler: bossOzellikleri(bossSayisi),
    ozelGuc: OZEL_GUCLER[BOSS_ADLARI[(bossSayisi - 1) % BOSS_ADLARI.length]] || null,
    ozelBekle: OZEL_ARASI, ozelHazirlik: 0,
    diken: 0, dikenBekle: DIKEN_ARASI,
    isinBekle: ISIN_ARASI, tasBekle: TAS_ARASI
  };
  yazilar.push({ x: GENISLIK / 2, y: 320, omur: 110, metin: boss.ad + " GELDİ!", renk: "#ff5a5a", boy: 38 });
  yazilar.push({ x: GENISLIK / 2, y: 360, omur: 110, metin: bcan + " can  ·  X ve C ile vur!", renk: "#ffffff", boy: 20 });
  if (boss.ozelGuc) {
    yazilar.push({ x: GENISLIK / 2, y: 432, omur: 130, metin: "ÖZEL GÜCÜ: " + ozelGucAdi(boss.ozelGuc), renk: "#c9b6ff", boy: 22 });
  }
  if (boss.ozellikler.length > 0) {
    var adlar = [];
    for (var o = 0; o < boss.ozellikler.length; o++) adlar.push(ozellikAdi(boss.ozellikler[o]));
    yazilar.push({ x: GENISLIK / 2, y: 398, omur: 130, metin: "ÖZELLİĞİ: " + adlar.join(" + "), renk: "#ffd84d", boy: 22 });
  }
  sarsinti = 22 * SARSINTI_GUCU;
  ekranParlama = 0.35;
  sesBossGeldi();
}

function bossMenzili() {
  var kat = ozellikVarMi(boss, "uzunKuyruk") ? 1.65 : 1;   // UZUN KUYRUK özelliği menzili büyütür
  return (BOSS_BOYU / 2) * BOSS_MENZIL * kat;
}

function bossGuncelle() {
  if (!boss) return;

  if (boss.yanip > 0) boss.yanip--;

  // ZAMAN DURDU gücü açıkken boss donar: kımıldayamaz, saldıramaz
  if (aktifGucler.zamanDur > 0) {
    if (sayac % 6 === 0) {
      parcaciklar.push({
        x: boss.x + (Math.random() - 0.5) * BOSS_BOYU,
        y: boss.y + (Math.random() - 0.5) * BOSS_BOYU,
        vx: 0, vy: -0.4,
        omur: 30, renk: "#b7e4ff", boy: 1.5 + Math.random() * 2
      });
    }
    return;
  }

  boss.sallan += 0.05;

  // 1) GİRİŞ: yukarıdan aşağı süzülerek gelir
  if (boss.giris > 0) {
    boss.giris--;
    boss.y += (boss.hedefY - boss.y) * 0.09;
    return;
  }

  // 2) KEDİYİ KOVALA (yavaşça)
  var kdx = kedi.x - boss.x, kdy = (kedi.y - 130) - boss.y;
  var kuz = Math.sqrt(kdx * kdx + kdy * kdy) || 1;
  if (boss.savurma <= 0) {
    boss.x += (kdx / kuz) * BOSS_HIZI;
    boss.y += (kdy / kuz) * BOSS_HIZI * 0.6;
  }
  var bpay = BOSS_BOYU * 0.55;
  if (boss.x < bpay) boss.x = bpay;
  if (boss.x > GENISLIK - bpay) boss.x = GENISLIK - bpay;
  if (boss.y < 120) boss.y = 120;
  if (boss.y > YUKSEKLIK - 220) boss.y = YUKSEKLIK - 220;

  bossOzellikleriniIslet();
  bossOzelGucIslet();

  // 3) SALDIRI DÖNGÜSÜ:  bekle -> hazırlan -> savur
  if (boss.savurma > 0) {
    boss.savurma--;
    // savururken menzildeki kediye BİR kere vurur
    if (!boss.vurduMu) {
      var vdx = kedi.x - boss.x, vdy = kedi.y - boss.y;
      if (Math.sqrt(vdx * vdx + vdy * vdy) < bossMenzili() + KEDI_BOYU * 0.4) {
        boss.vurduMu = true;
        bossKediyeVurdu();
      }
    }
    if (boss.savurma === 0) {
      boss.vurduMu = false;
      boss.vurusSayac = Math.max(60, BOSS_VURUS_ARASI - boss.sira * 8);
    }
  }
  else if (boss.hazirlik > 0) {
    boss.hazirlik--;
    if (boss.hazirlik === 0) {
      boss.savurma = BOSS_SAVURMA;
      boss.vurduMu = false;
      sesSavur();
      sarsinti = 10 * SARSINTI_GUCU;
    }
  }
  else {
    boss.vurusSayac--;
    if (boss.vurusSayac <= 0) boss.hazirlik = BOSS_HAZIRLIK;
  }
}

function bossKediyeVurdu() {
  if (kediDokunulmaz > 0) return;          // az önce vurulduysa tekrar vurmasın
  if (aktifGucler.kalkan > 0) {
    yazilar.push({ x: kedi.x, y: kedi.y - 110, omur: 50, metin: "KALKAN!", renk: "#5ec8ff", boy: 22 });
    sesKalkan();
    return;
  }
  can--;
  kombo = 0;
  kediDokunulmaz = DOKUNULMAZLIK;
  kediyiEz(-0.30);
  sarsinti = 20 * SARSINTI_GUCU;
  donma = DONMA_KARE + 2;
  sesBossVurus();
  yazilar.push({ x: kedi.x, y: kedi.y - 110, omur: 55, metin: "-1 KUYRUK", renk: "#ff5a5a", boy: 24 });
  for (var d = 0; d < 24; d++) {
    parcaciklar.push({
      x: kedi.x + (Math.random() - 0.5) * KEDI_BOYU, y: kedi.y + KEDI_BOYU * 0.5,
      vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 3 - 0.5,
      omur: 40, renk: "#b9a8d8", boy: 2 + Math.random() * 3
    });
  }
  if (can <= 0) {
    can = 0; durum = "bitti";
    sarsinti = 26 * SARSINTI_GUCU; donma = DONMA_KARE + 6;
    sesOlum(); kaydet();
  }
}

// ---- KEDİNİN SALDIRILARI ----
function cakraTopuAt() {
  if (kediBagli > 0) {                       // zincirdeysen X seni kurtarmaya çalışır
    kediBagli -= ZINCIR_KURTUL;
    if (kediBagli < 0) kediBagli = 0;
    kediyiEz(EZILME_GUCU * 0.6);
    sesTopAt();
    for (var z = 0; z < 6; z++) {
      parcaciklar.push({
        x: kedi.x, y: kedi.y,
        vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
        omur: 20, renk: "#c9b6ff", boy: 2 + Math.random() * 2
      });
    }
    return;
  }
  if (topBekle > 0) return;
  topBekle = TOP_BEKLEME;
  var hx = boss ? boss.x : kedi.x;
  var hy = boss ? boss.y : kedi.y - 300;
  var dx = hx - kedi.x, dy = hy - kedi.y;
  var uz = Math.sqrt(dx * dx + dy * dy) || 1;
  var ana = Math.atan2(dy / uz, dx / uz);

  // ÜÇLÜ ATIŞ gücü varsa tek yerine 3 top çıkar (yelpaze gibi)
  var acilar = (aktifGucler.uclu > 0) ? [-0.22, 0, 0.22] : [0];
  for (var i = 0; i < acilar.length; i++) {
    var a = ana + acilar[i];
    toplar.push({
      x: kedi.x, y: kedi.y - KEDI_BOYU * 0.2,
      vx: Math.cos(a) * TOP_HIZI, vy: Math.sin(a) * TOP_HIZI,
      omur: 120, faz: Math.random() * 6.28
    });
  }
  kediyiEz(EZILME_GUCU * 0.5);
  sesTopAt();
}

function kuyrukSavur() {
  if (kuyrukBekle > 0) return;
  kuyrukBekle = KUYRUK_BEKLEME;
  kediSavurma = 18;
  sesSavur();
  // DEV KUYRUK gücü menzili ve hasarı 2 katına çıkarır
  var dev = aktifGucler.devKuyruk > 0;
  var menzil = KUYRUK_MENZIL * (dev ? 2 : 1);
  var hasar = KUYRUK_HASAR * (dev ? 2 : 1);
  halkalar.push({ x: kedi.x, y: kedi.y, r: 8, maxR: menzil, omur: 18, maxOmur: 18,
                  renk: dev ? "#ff9f43" : "#ffb347" });
  if (boss) {
    var dx = boss.x - kedi.x, dy = boss.y - kedi.y;
    if (Math.sqrt(dx * dx + dy * dy) < menzil + BOSS_BOYU * 0.4) {
      if (boss.diken > 0) {
        yazilar.push({ x: boss.x, y: boss.y - BOSS_BOYU * 0.3, omur: 40, metin: "DİKENLİ!", renk: "#ff3b2e", boy: 20 });
      } else {
        bossaVur(hasar, kedi.x, kedi.y);
      }
    }
  }
}

function toplariGuncelle() {
  for (var i = toplar.length - 1; i >= 0; i--) {
    var t = toplar[i];
    // TAKİPÇİ TOP gücü varsa top boss'u kovalar
    if (aktifGucler.takipci > 0 && boss) {
      var tdx = boss.x - t.x, tdy = boss.y - t.y;
      var tuz = Math.sqrt(tdx * tdx + tdy * tdy) || 1;
      t.vx += ((tdx / tuz) * TOP_HIZI - t.vx) * 0.14;
      t.vy += ((tdy / tuz) * TOP_HIZI - t.vy) * 0.14;
    }
    t.x += t.vx; t.y += t.vy; t.omur--;
    if (boss) {
      var dx = t.x - boss.x, dy = t.y - boss.y;
      if (Math.sqrt(dx * dx + dy * dy) < BOSS_BOYU * 0.42) {
        bossaVur(TOP_HASAR, t.x, t.y);
        toplar.splice(i, 1);
        continue;
      }
    }
    if (t.omur <= 0 || t.x < -40 || t.x > GENISLIK + 40 || t.y < -40 || t.y > YUKSEKLIK + 40) {
      toplar.splice(i, 1);
    }
  }
}

function bossaVur(hasar, vx, vy) {
  if (!boss) return;
  boss.can -= hasar;
  boss.yanip = 8;
  sarsinti = Math.max(sarsinti, 7 * SARSINTI_GUCU);
  sesBossVuruldu();
  for (var p = 0; p < 14; p++) {
    parcaciklar.push({
      x: vx, y: vy,
      vx: (Math.random() - 0.5) * 9, vy: (Math.random() - 0.5) * 9,
      omur: 28, renk: p % 2 === 0 ? "#6fd8ff" : "#ffffff", boy: 1.5 + Math.random() * 2.5
    });
  }
  yazilar.push({ x: boss.x, y: boss.y - BOSS_BOYU * 0.3, omur: 34, metin: "-" + hasar, renk: "#6fd8ff", boy: 20 });
  if (boss.can <= 0) bossOldu();
}

function bossOldu() {
  var bx = boss.x, by = boss.y, sira = boss.sira, ad = boss.ad;
  for (var p = 0; p < 90; p++) {
    parcaciklar.push({
      x: bx, y: by,
      vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 0.5) * 18,
      omur: 60, renk: p % 3 === 0 ? "#ffd84d" : (p % 3 === 1 ? "#ff5a5a" : "#ffffff"),
      boy: 2 + Math.random() * 4
    });
  }
  halkalar.push({ x: bx, y: by, r: 20, maxR: 380, omur: 50, maxOmur: 50, renk: "#ffd84d" });
  sarsinti = 28 * SARSINTI_GUCU; donma = DONMA_KARE + 6; ekranParlama = 0.60;
  sesBossOldu();
  boss = null;
  toplar = [];
  taslar = [];
  dalgalar = []; atesToplari = []; kediBagli = 0;

  can++;
  if (can > EN_COK_KUYRUK) can = EN_COK_KUYRUK;
  if (can > enYuksekCan) enYuksekCan = can;
  puanEkle(10 * sira);
  if (can >= EVRIM_KUYRUK) evrimiBaslat();

  yazilar.push({ x: GENISLIK / 2, y: 230, omur: 110, metin: ad + " YENİLDİ!", renk: "#ffd84d", boy: 36 });
  yazilar.push({ x: GENISLIK / 2, y: 272, omur: 110, metin: "+1 kuyruk  ·  +" + (10 * sira) + " puan", renk: "#ffffff", boy: 20 });
}


// ---- BOSS ÖZELLİKLERİ ----
function bossOzellikleri(sira) {
  var i = Math.min(sira, BOSS_OZELLIKLERI.length) - 1;
  return BOSS_OZELLIKLERI[i] || [];
}

function ozellikVarMi(b, ad) {
  if (!b || !b.ozellikler) return false;
  for (var i = 0; i < b.ozellikler.length; i++) {
    if (b.ozellikler[i] === ad) return true;
  }
  return false;
}

function ozellikAdi(ad) {
  if (ad === "diken") return "DİKEN";
  if (ad === "uzunKuyruk") return "UZUN KUYRUK";
  if (ad === "isinlanma") return "IŞINLANMA";
  if (ad === "tasYagmuru") return "TAŞ YAĞMURU";
  return ad;
}

// Boss'un özel yeteneklerini her karede işlet
function bossOzellikleriniIslet() {
  var r = KEDI_BOYU / 2;

  // --- DİKEN: boss kendini dikene çevirir, dokunan yanar ---
  if (ozellikVarMi(boss, "diken")) {
    if (boss.diken > 0) {
      boss.diken--;
      if (boss.diken === 0) boss.dikenBekle = DIKEN_ARASI;
      // dikenliyken temas eden kedi zarar görür
      var ddx = kedi.x - boss.x, ddy = kedi.y - boss.y;
      if (Math.sqrt(ddx * ddx + ddy * ddy) < BOSS_BOYU * 0.55 + r * 0.7) {
        bossKediyeVurdu();
      }
      if (sayac % 4 === 0) {
        parcaciklar.push({
          x: boss.x + (Math.random() - 0.5) * BOSS_BOYU,
          y: boss.y + (Math.random() - 0.5) * BOSS_BOYU,
          vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
          omur: 24, renk: "#ff3b2e", boy: 1.5 + Math.random() * 2
        });
      }
    } else {
      boss.dikenBekle--;
      if (boss.dikenBekle <= 0) {
        boss.diken = DIKEN_SURESI;
        yazilar.push({ x: boss.x, y: boss.y - BOSS_BOYU * 0.9, omur: 70, metin: "DİKEN! DOKUNMA!", renk: "#ff3b2e", boy: 24 });
        sarsinti = 12 * SARSINTI_GUCU;
        sesDiken();
      }
    }
  }

  // --- IŞINLANMA: kaybolup kedinin yanında belirir ---
  if (ozellikVarMi(boss, "isinlanma")) {
    boss.isinBekle--;
    if (boss.isinBekle <= 0) {
      boss.isinBekle = ISIN_ARASI;
      for (var p = 0; p < 30; p++) {
        parcaciklar.push({
          x: boss.x, y: boss.y,
          vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
          omur: 30, renk: "#c9b6ff", boy: 2 + Math.random() * 3
        });
      }
      boss.x = Math.max(BOSS_BOYU * 0.55, Math.min(GENISLIK - BOSS_BOYU * 0.55, kedi.x + (Math.random() - 0.5) * 240));
      boss.y = Math.max(120, Math.min(YUKSEKLIK - 220, kedi.y - 150 + (Math.random() - 0.5) * 80));
      halkalar.push({ x: boss.x, y: boss.y, r: 10, maxR: 180, omur: 26, maxOmur: 26, renk: "#c9b6ff" });
      sesIsinlan();
    }
  }

  // --- TAŞ YAĞMURU: gökten taş yağdırır ---
  if (ozellikVarMi(boss, "tasYagmuru")) {
    boss.tasBekle--;
    if (boss.tasBekle <= 0) {
      boss.tasBekle = TAS_ARASI;
      for (var t = 0; t < TAS_ADEDI; t++) {
        taslar.push({
          x: 60 + Math.random() * (GENISLIK - 120),
          y: -40 - t * 60,
          vy: 4 + Math.random() * 2.5,
          boy: 16 + Math.random() * 10,
          aci: Math.random() * 6.28,
          donus: (Math.random() - 0.5) * 0.12
        });
      }
      yazilar.push({ x: GENISLIK / 2, y: 320, omur: 55, metin: "TAŞ YAĞMURU!", renk: "#c9a06e", boy: 24 });
      sesTas();
    }
  }
}

function taslariGuncelle() {
  var r = KEDI_BOYU / 2;
  for (var i = taslar.length - 1; i >= 0; i--) {
    var t = taslar[i];
    t.y += t.vy; t.aci += t.donus;
    var dx = t.x - kedi.x, dy = t.y - kedi.y;
    if (Math.sqrt(dx * dx + dy * dy) < r * 0.55 + t.boy * 0.7) {
      bossKediyeVurdu();
      for (var p = 0; p < 12; p++) {
        parcaciklar.push({
          x: t.x, y: t.y,
          vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
          omur: 26, renk: "#c9a06e", boy: 1.5 + Math.random() * 2.5
        });
      }
      taslar.splice(i, 1);
      continue;
    }
    if (t.y > YUKSEKLIK + 60) taslar.splice(i, 1);
  }
}

function taslariCiz() {
  for (var i = 0; i < taslar.length; i++) {
    var t = taslar[i];
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.aci);
    ctx.fillStyle = "#8a6a44";
    ctx.beginPath();
    for (var k = 0; k < 7; k++) {
      var a = (k / 7) * 6.2832;
      var yc = t.boy * (0.78 + Math.sin(k * 2.1) * 0.20);
      var px = Math.cos(a) * yc, py = Math.sin(a) * yc;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c9a06e";
    ctx.beginPath(); ctx.arc(-t.boy * 0.22, -t.boy * 0.22, t.boy * 0.28, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
}

// Dikenleri çiz (boss dikenliyken)
function bossDikenleriniCiz(r) {
  var adet = 16;
  for (var i = 0; i < adet; i++) {
    var a = (i / adet) * 6.2832 + sayac * 0.01;
    var ic = r * 0.72;
    var dis = r * (1.02 + Math.sin(sayac * 0.25 + i) * 0.07);
    var genislik = 0.11;
    ctx.fillStyle = i % 2 === 0 ? "#ff5a4a" : "#ffe066";
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - genislik) * ic, Math.sin(a - genislik) * ic + r * 0.15);
    ctx.lineTo(Math.cos(a) * dis * 1.55, Math.sin(a) * dis * 1.55 + r * 0.15);
    ctx.lineTo(Math.cos(a + genislik) * ic, Math.sin(a + genislik) * ic + r * 0.15);
    ctx.closePath(); ctx.fill();
  }
}


// ===========================================================
//   BOSS ÖZEL GÜÇLERİ (jutsu)
// ===========================================================
function ozelGucAdi(g) {
  if (g === "itme")     return "SHINRA TENSEI";
  if (g === "atesTopu") return "DEV ATEŞ TOPU";
  if (g === "zincir")   return "ÇAKRA ZİNCİRLERİ";
  return "";
}

// Her karede çalışır: özel gücü sayar, zamanı gelince patlatır
function bossOzelGucIslet() {
  if (!boss || !boss.ozelGuc) return;

  if (boss.ozelHazirlik > 0) {
    boss.ozelHazirlik--;
    if (sayac % 3 === 0) {                       // toplanan çakra
      var a = Math.random() * 6.2832;
      parcaciklar.push({
        x: boss.x + Math.cos(a) * BOSS_BOYU * 1.4,
        y: boss.y + Math.sin(a) * BOSS_BOYU * 1.4,
        vx: -Math.cos(a) * 4, vy: -Math.sin(a) * 4,
        omur: 22, renk: "#c9b6ff", boy: 2 + Math.random() * 2
      });
    }
    if (boss.ozelHazirlik === 0) ozelGucuAt();
    return;
  }

  boss.ozelBekle--;
  if (boss.ozelBekle <= 0) {
    boss.ozelBekle = OZEL_ARASI;
    boss.ozelHazirlik = OZEL_HAZIRLIK;
    yazilar.push({ x: boss.x, y: boss.y - BOSS_BOYU * 1.0, omur: 90,
                   metin: ozelGucAdi(boss.ozelGuc) + "!", renk: "#c9b6ff", boy: 26 });
    sarsinti = 10 * SARSINTI_GUCU;
    sesOzelHazirlik();
  }
}

function ozelGucuAt() {
  if (!boss) return;

  if (boss.ozelGuc === "itme") {
    dalgalar.push({ x: boss.x, y: boss.y, r: BOSS_BOYU * 0.5, vurdu: false });
    sarsinti = 24 * SARSINTI_GUCU;
    ekranParlama = 0.40;
    sesItme();
  }
  else if (boss.ozelGuc === "atesTopu") {
    var dx = kedi.x - boss.x, dy = kedi.y - boss.y;
    var uz = Math.sqrt(dx * dx + dy * dy) || 1;
    atesToplari.push({
      x: boss.x, y: boss.y + BOSS_BOYU * 0.3,
      vx: (dx / uz) * ATES_HIZI, vy: (dy / uz) * ATES_HIZI,
      can: ATES_CANI, boy: 34, faz: 0, omur: 600
    });
    sarsinti = 14 * SARSINTI_GUCU;
    sesAtes();
  }
  else if (boss.ozelGuc === "zincir") {
    kediBagli = ZINCIR_SURESI;
    sarsinti = 16 * SARSINTI_GUCU;
    yazilar.push({ x: kedi.x, y: kedi.y - 150, omur: 80, metin: "BAĞLANDIN! X'e BAS!", renk: "#c9b6ff", boy: 24 });
    sesZincir();
  }
}

// --- İTME DALGASI ---
function dalgalariGuncelle() {
  var r = KEDI_BOYU / 2;
  for (var i = dalgalar.length - 1; i >= 0; i--) {
    var d = dalgalar[i];
    d.r += DALGA_HIZI;
    if (!d.vurdu) {
      var dx = kedi.x - d.x, dy = kedi.y - d.y;
      var mes = Math.sqrt(dx * dx + dy * dy);
      if (mes < d.r + r * 0.5 && mes > d.r - 60) {       // dalganın halkasına değdi
        d.vurdu = true;
        var uz = mes || 1;
        kedi.x += (dx / uz) * DALGA_ITME;
        kedi.y += (dy / uz) * DALGA_ITME * 0.7;
        kedi.x = Math.max(r, Math.min(GENISLIK - r, kedi.x));
        kedi.y = Math.max(YUKARI_SINIR, Math.min(ASAGI_SINIR, kedi.y));
        bossKediyeVurdu();
      }
    }
    if (d.r > GENISLIK) dalgalar.splice(i, 1);
  }
}

function dalgalariCiz() {
  for (var i = 0; i < dalgalar.length; i++) {
    var d = dalgalar[i];
    var solma = Math.max(0, 1 - d.r / GENISLIK);
    ctx.save();
    ctx.globalAlpha = 0.55 * solma;
    ctx.strokeStyle = "#c9b6ff";
    ctx.lineWidth = 14 * solma + 2;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 0.28 * solma;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.88, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }
}

// --- DEV ATEŞ TOPU ---
function atesToplariniGuncelle() {
  var r = KEDI_BOYU / 2;
  for (var i = atesToplari.length - 1; i >= 0; i--) {
    var a = atesToplari[i];
    a.omur--; a.faz += 0.2;
    // kediyi yavaşça takip et
    var dx = kedi.x - a.x, dy = kedi.y - a.y;
    var uz = Math.sqrt(dx * dx + dy * dy) || 1;
    a.vx += ((dx / uz) * ATES_HIZI - a.vx) * 0.03;
    a.vy += ((dy / uz) * ATES_HIZI - a.vy) * 0.03;
    a.x += a.vx; a.y += a.vy;

    if (sayac % 2 === 0) {
      parcaciklar.push({
        x: a.x + (Math.random() - 0.5) * a.boy, y: a.y + (Math.random() - 0.5) * a.boy,
        vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2 - 1,
        omur: 22, renk: Math.random() < 0.5 ? "#ff7a2e" : "#ffd84d", boy: 2 + Math.random() * 2
      });
    }

    // kediye çarptı mı
    if (Math.sqrt(dx * dx + dy * dy) < r * 0.55 + a.boy * 0.7) {
      atesTopuPatlat(a);
      atesToplari.splice(i, 1);
      bossKediyeVurdu();
      continue;
    }

    // kedinin çakra topları ateş topunu söndürür
    for (var t = toplar.length - 1; t >= 0; t--) {
      var tt = toplar[t];
      var tdx = tt.x - a.x, tdy = tt.y - a.y;
      if (Math.sqrt(tdx * tdx + tdy * tdy) < a.boy * 0.9) {
        toplar.splice(t, 1);
        a.can--;
        sesBossVuruldu();
        yazilar.push({ x: a.x, y: a.y - 30, omur: 30, metin: a.can + " kaldı", renk: "#6fd8ff", boy: 17 });
        if (a.can <= 0) {
          atesTopuPatlat(a);
          atesToplari.splice(i, 1);
          yazilar.push({ x: a.x, y: a.y, omur: 50, metin: "SÖNDÜRDÜN!", renk: "#6fd8ff", boy: 22 });
        }
        break;
      }
    }

    if (a.omur <= 0) atesToplari.splice(i, 1);
  }
}

function atesTopuPatlat(a) {
  for (var p = 0; p < 34; p++) {
    parcaciklar.push({
      x: a.x, y: a.y,
      vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
      omur: 40, renk: p % 2 === 0 ? "#ff7a2e" : "#ffd84d", boy: 2 + Math.random() * 3
    });
  }
  halkalar.push({ x: a.x, y: a.y, r: 10, maxR: 160, omur: 26, maxOmur: 26, renk: "#ff7a2e" });
  sarsinti = Math.max(sarsinti, 12 * SARSINTI_GUCU);
  sesPatla();
}

function atesToplariniCiz() {
  for (var i = 0; i < atesToplari.length; i++) {
    var a = atesToplari[i];
    var nabiz = 1 + Math.sin(a.faz) * 0.10;
    ctx.save();
    ctx.shadowColor = "#ff7a2e"; ctx.shadowBlur = 30;
    var g = ctx.createRadialGradient(a.x, a.y, a.boy * 0.15, a.x, a.y, a.boy * nabiz);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.35, "#ffd84d");
    g.addColorStop(0.75, "#ff7a2e");
    g.addColorStop(1, "rgba(200,40,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(a.x, a.y, a.boy * nabiz, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
    // kaç vuruş kaldığını göster
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 15px " + BASLIK_FONT;
    ctx.textAlign = "center";
    ctx.fillText(a.can + "", a.x, a.y + 5);
    ctx.restore();
  }
}

// --- ÇAKRA ZİNCİRLERİ ---
function zincirGuncelle() {
  if (kediBagli > 0) {
    kediBagli--;
    if (kediBagli === 0) {
      yazilar.push({ x: kedi.x, y: kedi.y - 130, omur: 55, metin: "KURTULDUN!", renk: "#4dd97f", boy: 22 });
      halkalar.push({ x: kedi.x, y: kedi.y, r: 8, maxR: 130, omur: 22, maxOmur: 22, renk: "#4dd97f" });
    }
  }
}

function zincirCiz() {
  if (kediBagli <= 0 || !boss) return;
  var r = KEDI_BOYU / 2;
  for (var z = 0; z < 4; z++) {
    var yanX = boss.x + (z - 1.5) * BOSS_BOYU * 0.22;
    var yanY = boss.y + BOSS_BOYU * 0.2;
    ctx.save();
    ctx.strokeStyle = "#c9b6ff";
    ctx.lineWidth = 5;
    ctx.shadowColor = "#9d7bff"; ctx.shadowBlur = 14;
    ctx.beginPath();
    for (var k = 0; k <= 14; k++) {
      var u = k / 14;
      var px = yanX + (kedi.x - yanX) * u + Math.sin(u * 9 + sayac * 0.2 + z) * 9;
      var py = yanY + (kedi.y - yanY) * u + Math.cos(u * 7 + sayac * 0.18 + z) * 7;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }
  // kurtulma çubuğu
  var oran = kediBagli / ZINCIR_SURESI;
  ctx.save();
  ctx.fillStyle = "#00000088";
  yuvarlakKutu(kedi.x - 60, kedi.y - r * 1.9, 120, 12, 6); ctx.fill();
  ctx.fillStyle = "#c9b6ff";
  yuvarlakKutu(kedi.x - 60, kedi.y - r * 1.9, 120 * oran, 12, 6); ctx.fill();
  ctx.textAlign = "center";
  ctx.font = "800 12px " + YAZI_FONT;
  ctx.fillStyle = "#ffffff";
  ctx.fillText("X'e BAS!", kedi.x, kedi.y - r * 1.9 - 6);
  ctx.restore();
}

// Özel güç göstergesi (boss panelinde)
function ozelGucCubuguCiz(x, y, g) {
  if (!boss || !boss.ozelGuc) return;
  var hazir = boss.ozelHazirlik > 0;
  var oran = hazir ? (1 - boss.ozelHazirlik / OZEL_HAZIRLIK) : (1 - boss.ozelBekle / OZEL_ARASI);
  ctx.fillStyle = "#2a1a3a";
  yuvarlakKutu(x, y, g, 8, 4); ctx.fill();
  ctx.fillStyle = hazir ? "#ff3b2e" : "#c9b6ff";
  yuvarlakKutu(x, y, g * Math.max(0, Math.min(1, oran)), 8, 4); ctx.fill();
  ctx.textAlign = "center";
  ctx.font = "800 11px " + YAZI_FONT;
  ctx.fillStyle = hazir ? "#ff8a8a" : "#c9b6ff";
  ctx.fillText(hazir ? (ozelGucAdi(boss.ozelGuc) + " GELİYOR!") : ("özel güç: " + ozelGucAdi(boss.ozelGuc)),
               x + g / 2, y + 22);
}

// ---- BOSS ÇİZİMİ ----
function bossKuyruklariCiz(r, savurmaOrani) {
  var adet = 9;
  var acilma = Math.PI * (0.95 + savurmaOrani * 0.75);   // savururken kuyruklar açılır
  var tabanY = r * 0.45;
  for (var i = 0; i < adet; i++) {
    var t = i / (adet - 1);
    var a = -acilma / 2 + acilma * t + Math.sin(sayac * 0.05 + i * 0.7) * 0.12;
    var uzunluk = r * (2.0 + savurmaOrani * 0.9 + Math.sin(sayac * 0.04 + i) * 0.08);
    var ucX = Math.sin(a) * uzunluk;
    var ucY = tabanY - Math.cos(a) * uzunluk * 0.85;
    var kntX = Math.sin(a) * uzunluk * 0.28;
    var kntY = tabanY - Math.cos(a) * uzunluk * 0.30 + r * 0.24;
    for (var j = 0; j <= 34; j++) {
      var u = j / 34, ters = 1 - u;
      var px = 2 * ters * u * kntX + u * u * ucX;
      var py = ters * ters * tabanY + 2 * ters * u * kntY + u * u * ucY;
      var kal = r * (0.17 - 0.115 * u);
      ctx.shadowColor = "#ff3b2e"; ctx.shadowBlur = savurmaOrani > 0 ? 22 : 12;
      ctx.fillStyle = u > 0.6 ? "#ff8a3d" : (j % 7 === 0 ? "#8a1f14" : "#c22e1c");
      ctx.beginPath(); ctx.arc(px, py, kal, 0, 6.2832); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
}

function bossCiz() {
  if (!boss) return;
  var r = BOSS_BOYU / 2;
  var savurmaOrani = boss.savurma > 0 ? Math.sin((1 - boss.savurma / BOSS_SAVURMA) * Math.PI) : 0;
  var hazirOrani = boss.hazirlik > 0 ? (1 - boss.hazirlik / BOSS_HAZIRLIK) : 0;

  // hazırlanırken TEHLİKE çemberi (kaçman için uyarı)
  if (boss.hazirlik > 0 || boss.savurma > 0) {
    ctx.save();
    ctx.globalAlpha = 0.20 + Math.sin(sayac * 0.35) * 0.12;
    ctx.strokeStyle = "#ff3b2e";
    ctx.lineWidth = 4 + hazirOrani * 4;
    ctx.beginPath(); ctx.arc(boss.x, boss.y, bossMenzili(), 0, 6.2832); ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(boss.x, boss.y + Math.sin(boss.sallan) * 6);

  // çakra aurası
  var aura = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 2.3);
  aura.addColorStop(0, "rgba(255,60,30,0.30)");
  aura.addColorStop(1, "rgba(255,60,30,0)");
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0, 0, r * 2.3, 0, 6.2832); ctx.fill();

  bossKuyruklariCiz(r, savurmaOrani);
  if (boss.diken > 0) bossDikenleriniCiz(r);

  // ZAMAN DURDU: boss buz gibi mavileşsin
  if (aktifGucler.zamanDur > 0) {
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#b7e4ff";
    ctx.beginPath(); ctx.arc(0, 0, r * 1.15, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // vurulduğunda yanıp sönsün
  if (boss.yanip > 0 && boss.yanip % 4 < 2) { ctx.globalAlpha = 0.75; }

  // gövde
  var gov = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.2, 0, 0, r);
  gov.addColorStop(0, "#5a1a12");
  gov.addColorStop(1, "#2a0b08");
  ctx.fillStyle = gov;
  ctx.beginPath(); ctx.ellipse(0, r * 0.15, r * 0.82, r * 0.72, 0, 0, 6.2832); ctx.fill();

  // kulaklar
  ctx.fillStyle = "#3d0f0a";
  ctx.beginPath();
  ctx.moveTo(-r * 0.62, -r * 0.42); ctx.lineTo(-r * 0.40, -r * 1.05); ctx.lineTo(-r * 0.12, -r * 0.50);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo( r * 0.62, -r * 0.42); ctx.lineTo( r * 0.40, -r * 1.05); ctx.lineTo( r * 0.12, -r * 0.50);
  ctx.closePath(); ctx.fill();

  // yarık gözler
  ctx.shadowColor = "#ff2a1a"; ctx.shadowBlur = 20;
  ctx.fillStyle = "#ffd84d";
  ctx.beginPath(); ctx.ellipse(-r * 0.30, -r * 0.10, r * 0.19, r * 0.13, -0.25, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse( r * 0.30, -r * 0.10, r * 0.19, r * 0.13,  0.25, 0, 6.2832); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#1a0000";
  ctx.beginPath(); ctx.ellipse(-r * 0.30, -r * 0.10, r * 0.045, r * 0.12, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse( r * 0.30, -r * 0.10, r * 0.045, r * 0.12, 0, 0, 6.2832); ctx.fill();

  // dişli ağız
  ctx.fillStyle = "#1a0000";
  var agizAcik = 0.30 + savurmaOrani * 0.55;
  ctx.beginPath(); ctx.ellipse(0, r * 0.38, r * 0.38, r * 0.20 * (0.5 + agizAcik), 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#ffffff";
  for (var d = -2; d <= 2; d++) {
    ctx.beginPath();
    ctx.moveTo(d * r * 0.14 - r * 0.05, r * 0.30);
    ctx.lineTo(d * r * 0.14 + r * 0.05, r * 0.30);
    ctx.lineTo(d * r * 0.14, r * 0.30 + r * 0.13);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function bossCanCubuguCiz() {
  if (!boss) return;
  var g = 420, x = GENISLIK / 2 - g / 2, y = 26;
  camPanel(x - 10, y - 8, g + 20, 114, 16, "#ff5a5a88");
  ctx.fillStyle = "#3a0f0f";
  yuvarlakKutu(x, y + 18, g, 18, 9); ctx.fill();
  var oran = Math.max(0, boss.can / boss.maxCan);
  var cg = ctx.createLinearGradient(x, 0, x + g, 0);
  cg.addColorStop(0, "#ff3b2e");
  cg.addColorStop(1, "#ffd84d");
  ctx.fillStyle = cg;
  yuvarlakKutu(x, y + 18, g * oran, 18, 9); ctx.fill();
  ctx.textAlign = "center";
  ctx.font = "600 19px " + BASLIK_FONT;
  ctx.fillStyle = "#ffffff";
  ctx.fillText(boss.ad + "  (" + boss.sira + ". boss)", GENISLIK / 2, y + 12);
  ctx.textAlign = "right";
  ctx.font = "800 13px " + YAZI_FONT;
  ctx.fillStyle = "#ffd0d0";
  ctx.fillText(boss.can + " / " + boss.maxCan, x + g, y + 12);
  ctx.textAlign = "center";
  ctx.font = "800 12px " + YAZI_FONT;
  if (boss.ozellikler.length > 0) {
    var adlar2 = [];
    for (var o = 0; o < boss.ozellikler.length; o++) adlar2.push(ozellikAdi(boss.ozellikler[o]));
    ctx.font = "800 12px " + YAZI_FONT;
    ctx.fillStyle = boss.diken > 0 ? "#ff3b2e" : "#ffd84d";
    ctx.fillText(adlar2.join("  ·  "), GENISLIK / 2, y + 98);
  }
  ozelGucCubuguCiz(x, y + 42, g);
  ctx.fillStyle = topBekle > 0 ? "#ffffff55" : "#6fd8ff";
  ctx.fillText("X = çakra topu", GENISLIK / 2 - 90, y + 82);
  ctx.fillStyle = kuyrukBekle > 0 ? "#ffffff55" : "#ffb347";
  ctx.fillText("C = kuyruk savur", GENISLIK / 2 + 90, y + 82);
}

function toplariCiz() {
  for (var i = 0; i < toplar.length; i++) {
    var t = toplar[i];
    var nabiz = 1 + Math.sin(sayac * 0.4 + t.faz) * 0.15;
    ctx.shadowColor = "#6fd8ff"; ctx.shadowBlur = 18;
    var tg = ctx.createRadialGradient(t.x, t.y, 1, t.x, t.y, 11 * nabiz);
    tg.addColorStop(0, "#ffffff");
    tg.addColorStop(0.5, "#6fd8ff");
    tg.addColorStop(1, "rgba(60,140,255,0)");
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(t.x, t.y, 11 * nabiz, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ===========================================================
//   KUYRUKLAR  (kuyruk sayısı = can)
//   Naruto'daki gibi: güçlendikçe kuyruk çıkar, zarar görünce kaybolur.
//   Evrim geçince kuyruklar çakra alevine dönüşür.
// ===========================================================
function kuyruklariCiz(r, renk, sayi, evrimli) {
  var adet = Math.max(0, Math.min(EN_COK_KUYRUK, sayi));
  if (adet === 0) return;

  var yayilim = Math.PI * (adet === 1 ? 0 : 1.08);      // kuyrukların açılma genişliği
  var tabanY = r * 0.50;                                // kuyrukların çıktığı nokta

  for (var i = 0; i < adet; i++) {
    var t = adet === 1 ? 0.5 : i / (adet - 1);
    var aci = -yayilim / 2 + yayilim * t;
    var sallan = Math.sin(sayac * 0.06 + i * 0.75) * 0.15;
    var a = aci + sallan;

    var uzunluk = r * (2.15 + Math.sin(sayac * 0.05 + i) * 0.10);
    var ucX = Math.sin(a) * uzunluk;
    var ucY = tabanY - Math.cos(a) * uzunluk * 0.88;              // yukarı doğru süpürsün
    var kontrolX = Math.sin(a) * uzunluk * 0.26;
    var kontrolY = tabanY - Math.cos(a) * uzunluk * 0.30 + r * 0.26;

    // kuyruğu daire dizisiyle çiziyoruz: uca doğru inceliyor (tüylü görünüm)
    var adim = 16;
    for (var j = 0; j <= adim; j++) {
      var u = j / adim;
      var tersU = 1 - u;
      var px = tersU * tersU * 0 + 2 * tersU * u * kontrolX + u * u * ucX;
      var py = tersU * tersU * tabanY + 2 * tersU * u * kontrolY + u * u * ucY;
      var kalinlik = r * (0.155 - 0.105 * u);

      if (evrimli) {
        ctx.shadowColor = "#ff9a2e";
        ctx.shadowBlur = 16;
        ctx.fillStyle = u > 0.55 ? "#ffd75e" : "#ff8a2e";
      } else {
        ctx.shadowBlur = 0;
        ctx.fillStyle = (j % 4 === 0 && u > 0.2) ? renk.cizgi : renk.koyu;
      }
      ctx.beginPath();
      ctx.arc(px, py, kalinlik, 0, 6.2832);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
}


// ===========================================================
//   ALIN KORUYUCU (Naruto bandanası)
// ===========================================================
function bandanaCiz(r, evrimli) {
  var bandY = -r * 0.60;

  // bez kısmı
  ctx.fillStyle = "#2b3f78";
  yuvarlakKutu(-r * 0.86, bandY - r * 0.15, r * 1.72, r * 0.30, r * 0.07);
  ctx.fill();

  // arkadan sarkan iki kurdele
  ctx.fillStyle = "#24356a";
  for (var k = 0; k < 2; k++) {
    var dalga = Math.sin(sayac * 0.10 + k * 1.4) * r * 0.10;
    ctx.beginPath();
    ctx.moveTo(r * 0.80, bandY - r * 0.10);
    ctx.quadraticCurveTo(r * (1.15 + k * 0.10), bandY + r * (0.25 + k * 0.20) + dalga,
                         r * (1.02 + k * 0.16), bandY + r * (0.70 + k * 0.26) + dalga);
    ctx.lineTo(r * (0.86 + k * 0.16), bandY + r * (0.66 + k * 0.26) + dalga);
    ctx.quadraticCurveTo(r * (1.00 + k * 0.10), bandY + r * (0.24 + k * 0.20) + dalga,
                         r * 0.74, bandY + r * 0.02);
    ctx.closePath();
    ctx.fill();
  }

  // metal plaka
  var plaka = ctx.createLinearGradient(0, bandY - r * 0.13, 0, bandY + r * 0.13);
  plaka.addColorStop(0, evrimli ? "#ffe9a8" : "#e8ecf2");
  plaka.addColorStop(0.5, evrimli ? "#ffc94d" : "#b9c2cf");
  plaka.addColorStop(1, evrimli ? "#e0a022" : "#8b95a5");
  ctx.fillStyle = plaka;
  yuvarlakKutu(-r * 0.48, bandY - r * 0.14, r * 0.96, r * 0.28, r * 0.06);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.30)"; ctx.lineWidth = 1.2;
  yuvarlakKutu(-r * 0.48, bandY - r * 0.14, r * 0.96, r * 0.28, r * 0.06);
  ctx.stroke();

  // plakadaki sarmal simge
  ctx.strokeStyle = evrimli ? "#7a3b00" : "#3a4354";
  ctx.lineWidth = r * 0.045;
  ctx.lineCap = "round";
  ctx.beginPath();
  for (var s = 0; s <= 26; s++) {
    var ac = s / 26 * Math.PI * 2.6;
    var yc = r * 0.035 + (s / 26) * r * 0.085;
    var sx = Math.cos(ac - Math.PI / 2) * yc;
    var sy = bandY + Math.sin(ac - Math.PI / 2) * yc;
    if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  }
  ctx.stroke();
  // sarmalın kuyruğu
  ctx.beginPath();
  ctx.moveTo(0, bandY + r * 0.12);
  ctx.lineTo(r * 0.16, bandY + r * 0.12);
  ctx.stroke();

  // perçin
  ctx.fillStyle = evrimli ? "#7a3b00" : "#5b6577";
  ctx.beginPath(); ctx.arc(-r * 0.40, bandY, r * 0.030, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc( r * 0.40, bandY, r * 0.030, 0, 6.2832); ctx.fill();
}


// ===========================================================
//   KEDİ
// ===========================================================
function kediyiCiz(mx, my, menudeMi) {
  var r = KEDI_BOYU / 2;
  var renk = RENKLER[renkSirasi];
  var agizCarpani = evrimGecti ? AGIZ_BUYUME : 1;
  var titreme = kedi.igrenme > 0 ? Math.sin(sayac * 0.9) * r * 0.06 : 0;
  var kafaSallama = kedi.igrenme > 0 ? Math.sin(sayac * 0.75) * 0.14 : 0;

  var kx = (mx === undefined) ? kedi.x : mx;
  var ky = (my === undefined) ? kedi.y : my;

  // squash & stretch: ezilince genişler ve kısalır
  var ex = 1 + kedi.ezilme;
  var ey = 1 - kedi.ezilme;

  // yerdeki gölge — kedi havalanınca gölge YERDE kalır, küçülür ve soluklaşır
  var golgeY = ky + r * 1.42;
  var golgeOlcek = 1;
  if (HER_YONE_GIT && mx === undefined) {
    golgeY = ASAGI_SINIR + r * 1.42;                       // gölge hep yerde
    var yerdenYukseklik = Math.max(0, ASAGI_SINIR - ky);
    golgeOlcek = 1 - Math.min(0.62, yerdenYukseklik / 560);
  }
  ctx.save();
  ctx.globalAlpha = 0.28 * golgeOlcek;
  ctx.fillStyle = "#000000";
  ctx.beginPath();
  ctx.ellipse(kx, golgeY, r * 0.86 * ex * golgeOlcek, r * 0.15 * golgeOlcek, 0, 0, 6.2832);
  ctx.fill();
  ctx.restore();

  // KALKAN balonu
  if (aktifGucler && aktifGucler.kalkan > 0) {
    ctx.save();
    ctx.globalAlpha = 0.22 + Math.sin(sayac * 0.2) * 0.09;
    var kalkanGrad = ctx.createRadialGradient(kx, ky + r * 0.3, r * 0.4, kx, ky + r * 0.3, r * 1.55);
    kalkanGrad.addColorStop(0, "rgba(94,200,255,0)");
    kalkanGrad.addColorStop(1, "rgba(94,200,255,1)");
    ctx.fillStyle = kalkanGrad;
    ctx.beginPath(); ctx.arc(kx, ky + r * 0.3, r * 1.55, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 0.65;
    ctx.strokeStyle = "#5ec8ff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(kx, ky + r * 0.3, r * 1.55, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }

  // ---------- ÇAKRA AURASI (sadece evrim geçince) ----------
  if (evrimGecti) {
    ctx.save();
    var nabizA = 1 + Math.sin(sayac * 0.13) * 0.06;
    var aura = ctx.createRadialGradient(kx, ky + r * 0.35, r * 0.5, kx, ky + r * 0.35, r * 2.15 * nabizA);
    aura.addColorStop(0, "rgba(255,180,60,0.34)");
    aura.addColorStop(0.55, "rgba(255,130,30,0.16)");
    aura.addColorStop(1, "rgba(255,110,20,0)");
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(kx, ky + r * 0.35, r * 2.15 * nabizA, 0, 6.2832); ctx.fill();

    // titreşen alev dilleri
    ctx.strokeStyle = "rgba(255,200,90,0.55)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var al = 0; al <= 44; al++) {
      var aa = (al / 44) * 6.2832;
      var dalgaR = r * 1.42 + Math.sin(aa * 5 + sayac * 0.20) * r * 0.10
                            + Math.sin(aa * 9 - sayac * 0.13) * r * 0.05;
      var ax = kx + Math.cos(aa) * dalgaR;
      var ay = ky + r * 0.35 + Math.sin(aa) * dalgaR;
      if (al === 0) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
    }
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  }

  // ---------- GÖVDE ----------
  ctx.save();
  ctx.translate(kx + titreme, ky + r * 0.72);
  ctx.rotate(kedi.egim * 0.35);
  ctx.scale(ex, ey);

  // KUYRUKLAR gövdenin arkasında
  kuyruklariCiz(r, renk, can, evrimGecti);

  var govde = ctx.createLinearGradient(0, -r * 0.4, 0, r * 0.9);
  govde.addColorStop(0, renk.ana); govde.addColorStop(1, renk.koyu);
  ctx.fillStyle = govde;
  ctx.beginPath(); ctx.ellipse(0, r * 0.25, r * 0.78, r * 0.62, 0, 0, 6.2832); ctx.fill();

  ctx.fillStyle = "#fdf6ec"; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.ellipse(0, r * 0.34, r * 0.34, r * 0.42, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = renk.ana;
  ctx.beginPath(); ctx.ellipse(-r * 0.34, r * 0.72, r * 0.20, r * 0.13, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse( r * 0.34, r * 0.72, r * 0.20, r * 0.13, 0, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = renk.cizgi; ctx.lineWidth = 1.5;
  for (var pt = -1; pt <= 1; pt += 2) {
    for (var c = -1; c <= 1; c++) {
      ctx.beginPath();
      ctx.moveTo(pt * r * 0.34 + c * r * 0.07, r * 0.66);
      ctx.lineTo(pt * r * 0.34 + c * r * 0.07, r * 0.74);
      ctx.stroke();
    }
  }
  ctx.restore();

  // ---------- KAFA ----------
  var kalkma = kedi.basKalk * r * 0.30;
  var nefes = Math.sin(sayac * 0.05) * r * 0.02;

  ctx.save();
  ctx.translate(kx + titreme, ky - kalkma + nefes);
  ctx.rotate(kedi.basAci + kafaSallama + kedi.egim * 0.25);
  ctx.scale(ex, ey);

  ctx.fillStyle = renk.koyu;
  ctx.beginPath();
  ctx.moveTo(-r * 0.80, -r * 0.52); ctx.lineTo(-r * 0.58, -r * 1.22); ctx.lineTo(-r * 0.14, -r * 0.80);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r * 0.80, -r * 0.52); ctx.lineTo(r * 0.58, -r * 1.22); ctx.lineTo(r * 0.14, -r * 0.80);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f08fae";
  ctx.beginPath();
  ctx.moveTo(-r * 0.62, -r * 0.62); ctx.lineTo(-r * 0.56, -r * 1.00); ctx.lineTo(-r * 0.31, -r * 0.76);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r * 0.62, -r * 0.62); ctx.lineTo(r * 0.56, -r * 1.00); ctx.lineTo(r * 0.31, -r * 0.76);
  ctx.closePath(); ctx.fill();

  var kafa = ctx.createRadialGradient(-r * 0.2, -r * 0.32, r * 0.1, 0, 0, r * 1.1);
  kafa.addColorStop(0, renk.ana); kafa.addColorStop(1, renk.koyu);
  ctx.fillStyle = kafa;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.98, r * 0.90, 0, 0, 6.2832); ctx.fill();

  ctx.fillStyle = renk.koyu;
  for (var yt = -1; yt <= 1; yt += 2) {
    for (var f = 0; f < 3; f++) {
      ctx.beginPath();
      ctx.moveTo(yt * r * 0.80, r * (0.02 + f * 0.18));
      ctx.lineTo(yt * r * 1.10, r * (-0.04 + f * 0.18));
      ctx.lineTo(yt * r * 0.80, r * (0.14 + f * 0.18));
      ctx.closePath(); ctx.fill();
    }
  }

  ctx.strokeStyle = renk.cizgi; ctx.lineWidth = r * 0.07; ctx.lineCap = "round";
  for (var s2 = -1; s2 <= 1; s2++) {
    ctx.beginPath();
    ctx.moveTo(s2 * r * 0.20, -r * 0.86);
    ctx.lineTo(s2 * r * 0.26, -r * 0.74);
    ctx.stroke();
  }

  // ALIN KORUYUCU
  bandanaCiz(r, evrimGecti);

  // gözler
  var gozY = -r * 0.14;
  var kirpiyor = kedi.gozKirp > 0;
  if (kedi.igrenme > 0 || kirpiyor) {
    ctx.strokeStyle = "#101018"; ctx.lineWidth = r * 0.10; ctx.lineCap = "round";
    for (var gk = -1; gk <= 1; gk += 2) {
      ctx.beginPath();
      ctx.arc(gk * r * 0.36, gozY + r * 0.10, r * 0.21, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
      if (kedi.igrenme > 0) {
        ctx.lineWidth = r * 0.07;
        ctx.beginPath();
        ctx.moveTo(gk * r * 0.16, gozY - r * 0.34);
        ctx.lineTo(gk * r * 0.54, gozY - r * 0.16);
        ctx.stroke();
        ctx.lineWidth = r * 0.10;
      }
    }
  } else {
    for (var g2 = -1; g2 <= 1; g2 += 2) {
      ctx.fillStyle = evrimGecti ? "#ffeec9" : "#f7fbe8";
      ctx.beginPath(); ctx.ellipse(g2 * r * 0.36, gozY, r * 0.22, r * 0.26, 0, 0, 6.2832); ctx.fill();
      var iris = ctx.createRadialGradient(g2 * r * 0.36, gozY - r * 0.05, r * 0.03, g2 * r * 0.36, gozY, r * 0.20);
      if (evrimGecti) { iris.addColorStop(0, "#ffb347"); iris.addColorStop(1, "#d92b1c"); }
      else            { iris.addColorStop(0, "#b7e86a"); iris.addColorStop(1, "#6aa832"); }
      ctx.fillStyle = iris;
      ctx.beginPath();
      ctx.ellipse(g2 * r * 0.36 + kedi.bakisX * r * 0.07, gozY + kedi.bakisY * r * 0.08, r * 0.16, r * 0.20, 0, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = "#101018";
      ctx.beginPath();
      ctx.ellipse(g2 * r * 0.36 + kedi.bakisX * r * 0.07, gozY + kedi.bakisY * r * 0.08, r * 0.055, r * 0.18, 0, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.92;
      ctx.beginPath(); ctx.arc(g2 * r * 0.36 - r * 0.06, gozY - r * 0.10, r * 0.045, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  ctx.fillStyle = "#fdf6ec"; ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.ellipse(-r * 0.16, r * 0.34, r * 0.20, r * 0.15, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse( r * 0.16, r * 0.34, r * 0.20, r * 0.15, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = "#e8698f";
  ctx.beginPath();
  ctx.moveTo(0, r * 0.26); ctx.lineTo(-r * 0.11, r * 0.14); ctx.lineTo(r * 0.11, r * 0.14);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.33)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, r * 0.26); ctx.lineTo(0, r * 0.34); ctx.stroke();

  var acilma = kedi.agiz;
  var agizGenislik = r * 0.30 * agizCarpani;
  var agizYukseklik = (r * 0.06 + acilma * r * 0.40) * agizCarpani;

  if (kedi.igrenme > 0) {
    ctx.fillStyle = "#3d1f2e";
    ctx.beginPath();
    ctx.moveTo(-r * 0.36, r * 0.30);
    ctx.quadraticCurveTo(-r * 0.18, r * 0.22, 0, r * 0.30);
    ctx.quadraticCurveTo(r * 0.18, r * 0.22, r * 0.36, r * 0.30);
    ctx.quadraticCurveTo(r * 0.30, r * 0.66, 0, r * 0.70);
    ctx.quadraticCurveTo(-r * 0.30, r * 0.66, -r * 0.36, r * 0.30);
    ctx.closePath(); ctx.fill();
    var sarkma = Math.sin(sayac * 0.5) * r * 0.08;
    ctx.fillStyle = "#ff7a9c";
    ctx.beginPath(); ctx.ellipse(sarkma, r * 0.88, r * 0.17, r * 0.34, sarkma * 0.5, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#e05b80"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sarkma, r * 0.62); ctx.lineTo(sarkma * 1.4, r * 1.16); ctx.stroke();
    ctx.strokeStyle = "#8fd14f"; ctx.globalAlpha = 0.7; ctx.lineWidth = 2.5;
    for (var kk = -1; kk <= 1; kk++) {
      ctx.beginPath();
      for (var tt = 0; tt < 8; tt++) {
        var kx2 = kk * r * 0.40 + Math.sin(tt * 0.9 + sayac * 0.2 + kk) * r * 0.06;
        var ky2 = r * 0.55 + tt * r * 0.10;
        if (tt === 0) ctx.moveTo(kx2, ky2); else ctx.lineTo(kx2, ky2);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  else if (kedi.yalama > 0) {
    ctx.strokeStyle = "#3d1f2e"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-r * 0.14, r * 0.32, r * 0.14, 0.15, Math.PI - 0.15); ctx.stroke();
    ctx.beginPath(); ctx.arc( r * 0.14, r * 0.32, r * 0.14, 0.15, Math.PI - 0.15); ctx.stroke();
    var dilX = Math.sin(kedi.yalama * 0.35) * r * 0.22;
    var dilY = r * 0.42 + Math.abs(Math.cos(kedi.yalama * 0.35)) * r * 0.10;
    ctx.fillStyle = "#ff7a9c";
    ctx.beginPath(); ctx.ellipse(dilX, dilY, r * 0.13, r * 0.19, dilX * 0.02, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#e05b80"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(dilX, dilY - r * 0.12); ctx.lineTo(dilX, dilY + r * 0.14); ctx.stroke();
  }
  else {
    ctx.fillStyle = "#3d1f2e";
    ctx.beginPath();
    ctx.ellipse(0, r * 0.38 + agizYukseklik * 0.35, agizGenislik, agizYukseklik, 0, 0, 6.2832);
    ctx.fill();
    if (acilma > 0.25) {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(-agizGenislik * 0.55, r * 0.38 - agizYukseklik * 0.55);
      ctx.lineTo(-agizGenislik * 0.35, r * 0.38 - agizYukseklik * 0.05);
      ctx.lineTo(-agizGenislik * 0.18, r * 0.38 - agizYukseklik * 0.55);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(agizGenislik * 0.55, r * 0.38 - agizYukseklik * 0.55);
      ctx.lineTo(agizGenislik * 0.35, r * 0.38 - agizYukseklik * 0.05);
      ctx.lineTo(agizGenislik * 0.18, r * 0.38 - agizYukseklik * 0.55);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ff7a9c";
      ctx.beginPath();
      ctx.ellipse(0, r * 0.38 + agizYukseklik * 0.75, agizGenislik * 0.55, agizYukseklik * 0.42, 0, 0, 6.2832);
      ctx.fill();
    }
  }

  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.8; ctx.globalAlpha = 0.85;
  for (var s3 = -1; s3 <= 1; s3 += 2) {
    for (var k3 = 0; k3 < 3; k3++) {
      ctx.beginPath();
      ctx.moveTo(s3 * r * 0.26, r * 0.26 + k3 * r * 0.055);
      ctx.quadraticCurveTo(s3 * r * 0.75, r * (0.14 + k3 * 0.10), s3 * r * 1.20, r * (0.05 + k3 * 0.16));
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  if (durum === "bitti" && !menudeMi) {
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
    for (var gx = -1; gx <= 1; gx += 2) {
      var cx = gx * r * 0.36;
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.15, gozY - r * 0.15); ctx.lineTo(cx + r * 0.15, gozY + r * 0.15);
      ctx.moveTo(cx + r * 0.15, gozY - r * 0.15); ctx.lineTo(cx - r * 0.15, gozY + r * 0.15);
      ctx.stroke();
    }
  }
  ctx.restore();
}



// ===========================================================
//   DOKUNMATİK KONTROL  (telefonda klavye yok!)
//   Parmağını sürükle = kedi oraya gider
//   Sağ alttaki iki düğme = X (çakra topu) ve C (kuyruk savur)
// ===========================================================
var dokunmatikVar = (("ontouchstart" in window) || (navigator.maxTouchPoints || 0) > 0);  // cihaz dokunmatik mi
var basiliDugme = null;             // o an basılı tutulan düğme

function dokunmaDugmeleri() {
  var b = DOKUNMATIK_DUGME_BOY;
  var k = DOKUNMATIK_KENAR;
  return {
    x: { ad: "X", x: GENISLIK - k - b * 2.35, y: YUKSEKLIK - k - b, boy: b, renk: "#6fd8ff" },
    c: { ad: "C", x: GENISLIK - k - b,        y: YUKSEKLIK - k - b, boy: b, renk: "#ffb347" }
  };
}

function dugmeyeMiBasildi(nokta) {
  var d = dokunmaDugmeleri();
  var adlar = ["x", "c"];
  for (var i = 0; i < adlar.length; i++) {
    var g = d[adlar[i]];
    var mx = g.x + g.boy / 2, my = g.y + g.boy / 2;
    var dx = nokta.x - mx, dy = nokta.y - my;
    if (Math.sqrt(dx * dx + dy * dy) < g.boy * 0.62) return adlar[i];
  }
  return null;
}

// Ekrandaki dokunma noktasını oyunun içindeki koordinata çevir
function dokunusKonumu(dokunus) {
  var kutu = ekran.getBoundingClientRect();
  return {
    x: (dokunus.clientX - kutu.left) * (GENISLIK / kutu.width),
    y: (dokunus.clientY - kutu.top) * (YUKSEKLIK / kutu.height)
  };
}

function kediyiOraTasi(nokta) {
  if (durum !== "oyun") return;
  var r = KEDI_BOYU / 2;
  kedi.x = Math.max(r, Math.min(GENISLIK - r, nokta.x));
  if (HER_YONE_GIT) {
    kedi.y = Math.max(YUKARI_SINIR, Math.min(ASAGI_SINIR, nokta.y));
  }
}

ekran.addEventListener("touchstart", function (e) {
  dokunmatikVar = true;
  sesiUyandir();
  e.preventDefault();

  var nokta = dokunusKonumu(e.changedTouches[0]);

  // menü / bitti / duraklat ekranlarında dokunmak başlatır
  if (durum === "menu")          { oyunuBaslat(); sesBolum(); return; }
  if (durum === "bitti")         { oyunuBaslat(); return; }
  if (durum === "duraklat")      { durum = "oyun"; sesDevam(); return; }

  var dugme = dugmeyeMiBasildi(nokta);
  if (dugme === "x") { basiliDugme = "x"; cakraTopuAt(); return; }
  if (dugme === "c") { basiliDugme = "c"; kuyrukSavur(); return; }

  kediyiOraTasi(nokta);
}, { passive: false });

ekran.addEventListener("touchmove", function (e) {
  e.preventDefault();
  if (basiliDugme) return;                       // düğmeye basılıyken kedi kaymasın
  kediyiOraTasi(dokunusKonumu(e.changedTouches[0]));
}, { passive: false });

ekran.addEventListener("touchend", function (e) {
  e.preventDefault();
  basiliDugme = null;
}, { passive: false });

ekran.addEventListener("touchcancel", function () { basiliDugme = null; });

// Düğmeleri çiz (sadece dokunmatik cihazda ve oyun oynanırken)
function dokunmaDugmeleriniCiz() {
  if (!dokunmatikVar || durum !== "oyun") return;
  var d = dokunmaDugmeleri();
  var adlar = ["x", "c"];
  for (var i = 0; i < adlar.length; i++) {
    var g = d[adlar[i]];
    var mx = g.x + g.boy / 2, my = g.y + g.boy / 2;
    var bekliyor = (adlar[i] === "x") ? topBekle > 0 : kuyrukBekle > 0;
    var basili = (basiliDugme === adlar[i]);

    ctx.save();
    ctx.globalAlpha = bekliyor ? 0.30 : (basili ? 0.95 : 0.62);
    ctx.fillStyle = "rgba(10,6,26,0.7)";
    ctx.beginPath(); ctx.arc(mx, my, g.boy * (basili ? 0.58 : 0.62), 0, 6.2832); ctx.fill();
    ctx.strokeStyle = g.renk;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mx, my, g.boy * (basili ? 0.58 : 0.62), 0, 6.2832); ctx.stroke();
    ctx.fillStyle = g.renk;
    ctx.font = "700 " + Math.round(g.boy * 0.46) + "px " + BASLIK_FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(g.ad, mx, my);
    ctx.textBaseline = "alphabetic";
    ctx.restore();
  }
}

// Kuyruk sayacı: 9 küçük kuyruk simgesi, kaç canın varsa o kadarı yanar
function kuyrukSayaciniCiz(x, y) {
  for (var i = 0; i < EN_COK_KUYRUK; i++) {
    var kx = x + i * 25;
    var acik = i < can;
    ctx.save();
    ctx.translate(kx, y);
    if (acik && evrimGecti) { ctx.shadowColor = "#ff9a2e"; ctx.shadowBlur = 10; }
    ctx.strokeStyle = acik ? (evrimGecti ? "#ffc94d" : "#ff9f4d") : "rgba(255,255,255,0.14)";
    ctx.lineWidth = acik ? 4.5 : 3;
    ctx.lineCap = "round";
    var sallan = acik ? Math.sin(sayac * 0.07 + i * 0.75) * 2.5 : 0;
    ctx.beginPath();
    ctx.moveTo(0, 9);
    ctx.quadraticCurveTo(-4 + sallan, 1, 1 + sallan, -9);
    ctx.stroke();
    ctx.restore();
  }
}

function menuyuCiz() {
  // süzülen süs yıldızları
  for (var i = 0; i < susYildizlari.length; i++) {
    var s = susYildizlari[i];
    s.y -= s.hiz; s.aci += s.donus;
    if (s.y < -30) { s.y = YUKSEKLIK + 30; s.x = Math.random() * GENISLIK; }
    ctx.globalAlpha = 0.30;
    yildizCiz(s.x + Math.sin(sayac * 0.01 + s.salinim) * 14, s.y, s.r, s.aci);
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = "rgba(6,4,20,0.55)";
  ctx.fillRect(0, 0, GENISLIK, YUKSEKLIK);

  var suzul = Math.sin(sayac * 0.028) * 5;

  // --- BAŞLIK ---
  ctx.textAlign = "center";
  var bg = ctx.createLinearGradient(0, 74, 0, 152);
  bg.addColorStop(0, "#fff3b0");
  bg.addColorStop(0.5, "#ffd75e");
  bg.addColorStop(1, "#ff9f43");

  ctx.font = "700 52px " + BASLIK_FONT;
  ctx.shadowColor = "rgba(255,183,0,0.55)"; ctx.shadowBlur = 38;
  ctx.fillStyle = bg;

// ===========================================================
//   OYUN DÖNGÜSÜ
// ===========================================================
function oyunDongusu() {
  sayac++;
  var r = KEDI_BOYU / 2;
  var yakalamaYaricapi = r * (evrimGecti ? 1.25 : 1.0);

  // HIT STOP: darbe anında her şey birkaç kare donar (vuruşu ağırlaştırır)
  var donuyor = donma > 0;
  if (donuyor) donma--;

  // göz kırpma (menüde de çalışır)
  if (kedi) {
    kedi.kirpSayaci--;
    if (kedi.kirpSayaci <= 0) { kedi.gozKirp = 7; kedi.kirpSayaci = 110 + Math.floor(Math.random() * 140); }
    if (kedi.gozKirp > 0) kedi.gozKirp--;

    // squash & stretch yayı
    kedi.ezilmeHiz += -kedi.ezilme * 0.28;
    kedi.ezilmeHiz *= 0.80;
    kedi.ezilme += kedi.ezilmeHiz;
  }

  if (durum === "oyun" && !donuyor) {

    for (var gi = 0; gi < GUC_ADLARI.length; gi++) {
      var gad = GUC_ADLARI[gi];
      if (aktifGucler[gad] > 0) aktifGucler[gad]--;
    }

    // KEDİYİ OYNAT
    var gitX = 0, gitY = 0;
    if (tuslar["ArrowLeft"]  || tuslar["a"] || tuslar["A"]) gitX -= 1;
    if (tuslar["ArrowRight"] || tuslar["d"] || tuslar["D"]) gitX += 1;
    if (HER_YONE_GIT) {
      if (tuslar["ArrowUp"]   || tuslar["w"] || tuslar["W"]) gitY -= 1;
      if (tuslar["ArrowDown"] || tuslar["s"] || tuslar["S"]) gitY += 1;
    }
    // çapraz giderken hızlanmasın (iki yön aynı anda basılıysa yavaşlat)
    if (gitX !== 0 && gitY !== 0) { gitX *= 0.707; gitY *= 0.707; }
    if (kediBagli > 0) { gitX = 0; gitY = 0; }   // çakra zinciri seni tutuyor!
    kedi.x += gitX * KEDI_HIZI;
    kedi.y += gitY * KEDI_HIZI;

    if (kedi.x < r) kedi.x = r;
    if (kedi.x > GENISLIK - r) kedi.x = GENISLIK - r;
    if (HER_YONE_GIT) {
      if (kedi.y < YUKARI_SINIR) kedi.y = YUKARI_SINIR;
      if (kedi.y > ASAGI_SINIR)  kedi.y = ASAGI_SINIR;
    } else {
      kedi.y = ASAGI_SINIR;
    }

    // havadayken ayaklarından çakra dumanı çıksın (uçtuğu belli olsun)
    if (HER_YONE_GIT && kedi.y < ASAGI_SINIR - 10 && sayac % 3 === 0) {
      parcaciklar.push({
        x: kedi.x + (Math.random() - 0.5) * r * 0.9,
        y: kedi.y + r * 1.05,
        vx: (Math.random() - 0.5) * 1.6, vy: 1.2 + Math.random() * 1.4,
        omur: 22, renk: evrimGecti ? "#ffd84d" : "#9ad4ff", boy: 1.5 + Math.random() * 2
      });
    }

    // koşarken hafifçe yana yatsın (canlılık)
    var hizFarki = kedi.x - kedi.sonX;
    kedi.egim += (Math.max(-1, Math.min(1, hizFarki / 10)) * 0.22 - kedi.egim) * 0.18;
    kedi.sonX = kedi.x;

    // BOSS ÇAĞIR — bölümün sonuna doğru, bölüm başına bir kere
    if (!boss && bolum >= BOSS_ILK_BOLUM && !bossCikti[bolum] &&
        puan >= bolum * BOLUM_PUANI - BOSS_SON_PUAN) {
      bossCagir();
    }

    bossGuncelle();
    toplariGuncelle();
    taslariGuncelle();
    dalgalariGuncelle();
    atesToplariniGuncelle();
    zincirGuncelle();
    if (kediDokunulmaz > 0) kediDokunulmaz--;
    if (topBekle > 0) topBekle--;
    if (kuyrukBekle > 0) kuyrukBekle--;
    if (kediSavurma > 0) kediSavurma--;

    // YENİ OBJE  (boss varken yeni obje düşmez, sadece dövüş var)
    if (!boss && sayac % suankiSiklik() === 0) {
      var toplam = SANS_YILDIZ + SANS_SAGLAM + SANS_CURUK + SANS_GUC + SANS_HEDIYE;
      var zar = Math.random() * toplam;
      var tur;
      if (zar < SANS_YILDIZ) tur = "yildiz";
      else if (zar < SANS_YILDIZ + SANS_SAGLAM) tur = "saglam";
      else if (zar < SANS_YILDIZ + SANS_SAGLAM + SANS_CURUK) tur = "curuk";
      else if (zar < SANS_YILDIZ + SANS_SAGLAM + SANS_CURUK + SANS_GUC) tur = "guc";
      else tur = "hediye";
      objeler.push({
        tur: tur,
        gucTuru: tur === "guc" ? GUC_ADLARI[Math.floor(Math.random() * GUC_ADLARI.length)] : null,
        x: 50 + Math.random() * (GENISLIK - 100),
        y: -40, aci: 0,
        donus: (Math.random() - 0.5) * 0.10,
        dogum: 0, iz: []
      });
    }

    // KEDİ EN YAKIN OBJEYE BAKSIN
    var enYakin = null, enYakinMesafe = 99999;
    for (var b = 0; b < objeler.length; b++) {
      var o = objeler[b];
      if (o.y > kedi.y) continue;
      var fx = o.x - kedi.x, fy = o.y - kedi.y;
      var m = Math.sqrt(fx * fx + fy * fy);
      if (m < enYakinMesafe) { enYakinMesafe = m; enYakin = o; }
    }
    if (enYakin && enYakinMesafe < 260 && Math.abs(enYakin.x - kedi.x) < 110) {
      var yakinlik = 1 - (enYakinMesafe / 260);
      kedi.agizHedef = 0.35 + yakinlik * 0.65;
      kedi.basKalk += (yakinlik - kedi.basKalk) * 0.18;
      kedi.basAci  += (((enYakin.x - kedi.x) / 300) - kedi.basAci) * 0.15;
      kedi.bakisX  += (Math.max(-1, Math.min(1, (enYakin.x - kedi.x) / 90)) - kedi.bakisX) * 0.2;
      kedi.bakisY  += (-1 - kedi.bakisY) * 0.15;
    } else {
      kedi.agizHedef = 0;
      kedi.basKalk += (0 - kedi.basKalk) * 0.12;
      kedi.basAci  += (0 - kedi.basAci) * 0.12;
      kedi.bakisX  += (0 - kedi.bakisX) * 0.12;
      kedi.bakisY  += (0 - kedi.bakisY) * 0.12;
    }
    if (kedi.igrenme > 0) {
      kedi.igrenme--;
      kedi.agizHedef = 0;
      kedi.basKalk += (0 - kedi.basKalk) * 0.20;
      kedi.basAci  += (0 - kedi.basAci) * 0.20;
      kedi.bakisX  += (0 - kedi.bakisX) * 0.20;
      kedi.bakisY  += (0 - kedi.bakisY) * 0.20;
    }
    if (kedi.yalama > 0) { kedi.yalama--; kedi.agizHedef = 0; }
    kedi.agiz += (kedi.agizHedef - kedi.agiz) * 0.22;

    // OBJELERİ DÜŞÜR
    var hiz = suankiHiz();
    for (var i = objeler.length - 1; i >= 0; i--) {
      var obj = objeler[i];
      obj.dogum++;
      obj.iz.push({ x: obj.x, y: obj.y });
      if (obj.iz.length > 8) obj.iz.shift();
      obj.y += hiz;
      obj.aci += obj.donus;

      if (aktifGucler.miknatis > 0 && (obj.tur === "yildiz" || obj.tur === "saglam" || obj.tur === "guc" || obj.tur === "hediye")) {
        var mdx = kedi.x - obj.x, mdy = kedi.y - obj.y;
        var md = Math.sqrt(mdx * mdx + mdy * mdy);
        if (md > 1 && md < 320) { obj.x += (mdx / md) * 4.5; obj.y += (mdy / md) * 2.2; }
      }

      var dx = obj.x - kedi.x, dy = obj.y - kedi.y;
      var mesafe = Math.sqrt(dx * dx + dy * dy);

      if (mesafe < yakalamaYaricapi + OBJE_BOYU * 0.6) {
        var parcaRengi = "#ffe066";
        var halkaRengi = "#ffe066";

        if (obj.tur === "yildiz") {
          kombo++;
          if (kombo > enIyiKombo) enIyiKombo = kombo;
          var carpan = komboCarpani();
          if (aktifGucler.ciftPuan > 0) carpan *= 2;
          puan += carpan;
          kedi.yalama = 40;
          kediyiEz(EZILME_GUCU);
          donma = Math.max(donma, 2);
          yazilar.push({ x: obj.x, y: obj.y, omur: 45, metin: "+" + carpan, renk: "#ffe066", boy: 20 + carpan * 2 });
          sesYildiz(komboCarpani());
          if (kombo === 3 || kombo === 6 || kombo === 10) {
            sesKombo(kombo);
            sarsinti = 7 * SARSINTI_GUCU;
            yazilar.push({ x: kedi.x, y: kedi.y - 110, omur: 60, metin: "KOMBO x" + komboCarpani() + "!", renk: "#ff9f43", boy: 26 });
          }
          if (puan >= sonrakiRenkPuani) {
            renkHakki++; sonrakiRenkPuani += RENK_PUANI; kayitliHak = renkHakki;
            yazilar.push({ x: kedi.x, y: kedi.y - 140, omur: 70, metin: "RENK HAKKI! (G)", renk: "#ffffff", boy: 20 });
            kaydet();
          }
          if (puan > rekor) { rekor = puan; kaydet(); }
          var yeniBolum = 1 + Math.floor(puan / BOLUM_PUANI);
          if (yeniBolum > bolum) {
            bolum = yeniBolum; bolumYazi = 100; sesBolum();
            ekranParlama = 0.32; sarsinti = 9 * SARSINTI_GUCU;
            if (bolum > enYuksekBolum) { enYuksekBolum = bolum; kaydet(); }
          }
        }
        else if (obj.tur === "saglam") {
          kombo++;
          if (kombo > enIyiKombo) enIyiKombo = kombo;
          var eskiCan = can;
          can++;
          kedi.yalama = 40;
          kediyiEz(EZILME_GUCU * 1.2);
          donma = Math.max(donma, 3);
          parcaRengi = "#ff6b6b"; halkaRengi = "#4dd97f";
          if (can > EN_COK_KUYRUK) can = EN_COK_KUYRUK;         // 9'dan fazla kuyruk olmaz
          yazilar.push({ x: obj.x, y: obj.y, omur: 50,
                         metin: can > eskiCan ? "+1 KUYRUK" : "kuyruk dolu!",
                         renk: "#ffc94d", boy: 21 });
          sesEt();
          if (can > eskiCan) {                                   // yeni kuyruk çıktı: duman patlaması
            for (var yk = 0; yk < 18; yk++) {
              parcaciklar.push({
                x: kedi.x, y: kedi.y + KEDI_BOYU * 0.6,
                vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6 - 1,
                omur: 34, renk: "#ffc94d", boy: 1.5 + Math.random() * 2.5
              });
            }
          }
          if (can > enYuksekCan) enYuksekCan = can;
          if (!evrimGecti && can >= EVRIM_KUYRUK) {
            evrimGecti = true; evrimYazi = 120; evrimSayisi++;
            sarsinti = 18 * SARSINTI_GUCU; donma = DONMA_KARE + 4; ekranParlama = 0.55;
            kediyiEz(-0.30);
            sesEvrim(); kaydet();
            for (var e = 0; e < 70; e++) {
              parcaciklar.push({
                x: kedi.x, y: kedi.y,
                vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15 - 3,
                omur: 55, renk: "#ffd84d", boy: 2 + Math.random() * 3
              });
            }
            halkalar.push({ x: kedi.x, y: kedi.y, r: 20, maxR: 300, omur: 45, maxOmur: 45, renk: "#ffd84d" });
          }
        }
        else if (obj.tur === "hediye") {
          kombo++;
          if (kombo > enIyiKombo) enIyiKombo = kombo;
          kedi.yalama = 40;
          kediyiEz(EZILME_GUCU * 1.3);
          donma = Math.max(donma, 4);
          parcaRengi = "#ffd84d"; halkaRengi = "#ff8ae2";
          hediyeAc(obj.x, obj.y);
        }
        else if (obj.tur === "guc") {
          var gt = obj.gucTuru;
          aktifGucler[gt] = GUCLER[gt].sure;
          kedi.yalama = 40;
          kediyiEz(EZILME_GUCU);
          donma = Math.max(donma, 3);
          parcaRengi = GUCLER[gt].renk; halkaRengi = GUCLER[gt].renk;
          ekranParlama = 0.22;
          yazilar.push({ x: kedi.x, y: kedi.y - 110, omur: 70, metin: GUCLER[gt].ad + "!", renk: GUCLER[gt].renk, boy: 24 });
          sesGuc();
        }
        else {
          // ÇÜRÜK KUYRUK: canı götürür ama yine de puan verir (senin fikrin!)
          if (CURUK_PUAN > 0) {
            puan += CURUK_PUAN;
            yazilar.push({ x: obj.x, y: obj.y - 30, omur: 48,
                           metin: "+" + CURUK_PUAN + " puan", renk: "#c3e88d", boy: 20 });
            if (puan > rekor) { rekor = puan; kaydet(); }
            if (puan >= sonrakiRenkPuani) {
              renkHakki++; sonrakiRenkPuani += RENK_PUANI; kayitliHak = renkHakki;
              yazilar.push({ x: kedi.x, y: kedi.y - 140, omur: 70, metin: "RENK HAKKI! (C)", renk: "#ffffff", boy: 20 });
              kaydet();
            }
            var yeniBolumC = 1 + Math.floor(puan / BOLUM_PUANI);
            if (yeniBolumC > bolum) {
              bolum = yeniBolumC; bolumYazi = 100; sesBolum();
              ekranParlama = 0.32; sarsinti = 9 * SARSINTI_GUCU;
              if (bolum > enYuksekBolum) { enYuksekBolum = bolum; kaydet(); }
            }
          }
          if (aktifGucler.kalkan > 0) {
            parcaRengi = "#5ec8ff"; halkaRengi = "#5ec8ff";
            donma = Math.max(donma, 3);
            yazilar.push({ x: obj.x, y: obj.y, omur: 45, metin: "KALKAN!", renk: "#5ec8ff", boy: 20 });
            sesKalkan();
          } else {
            can--; kombo = 0;
            kedi.yalama = 0; kedi.igrenme = 75;
            kediyiEz(-0.26);
            sarsinti = 14 * SARSINTI_GUCU;
            donma = DONMA_KARE;
            parcaRengi = "#8fd14f"; halkaRengi = "#ff5a5a";
            yazilar.push({ x: obj.x, y: obj.y, omur: 50, metin: "-1 KUYRUK", renk: "#ff5a5a", boy: 22 });
            // kaybolan kuyruk duman olup dağılsın
            for (var dk = 0; dk < 22; dk++) {
              parcaciklar.push({
                x: kedi.x + (Math.random() - 0.5) * KEDI_BOYU,
                y: kedi.y + KEDI_BOYU * 0.55,
                vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 3 - 0.5,
                omur: 40, renk: "#b9a8d8", boy: 2 + Math.random() * 3
              });
            }
            yazilar.push({ x: kedi.x, y: kedi.y - 115, omur: 65, metin: "İĞRENÇ!", renk: "#8fd14f", boy: 24 });
            sesIgrenc();
            if (can <= 0) {
              can = 0; durum = "bitti";
              sarsinti = 26 * SARSINTI_GUCU; donma = DONMA_KARE + 6;
              sesOlum(); kaydet();
            }
          }
        }

        halkalar.push({ x: obj.x, y: obj.y, r: 6, maxR: 62, omur: 24, maxOmur: 24, renk: halkaRengi });
        for (var p = 0; p < 16; p++) {
          parcaciklar.push({
            x: obj.x, y: obj.y,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8 - 2,
            omur: 32, renk: parcaRengi, boy: 1.5 + Math.random() * 2.5
          });
        }
        objeler.splice(i, 1);
      }
      else if (obj.y > YUKSEKLIK + 50) {
        if (obj.tur === "yildiz" && kombo > 0) kombo = 0;
        objeler.splice(i, 1);
      }
    }
  }

  // --- PARÇACIKLAR, HALKALAR, YAZILAR ---
  if (!donuyor) {
    for (var j = parcaciklar.length - 1; j >= 0; j--) {
      var pa = parcaciklar[j];
      pa.x += pa.vx; pa.y += pa.vy; pa.vy += 0.22; pa.vx *= 0.99; pa.omur--;
      if (pa.omur <= 0) parcaciklar.splice(j, 1);
    }
    for (var h = halkalar.length - 1; h >= 0; h--) {
      var ha = halkalar[h];
      ha.omur--;
      var t = 1 - ha.omur / ha.maxOmur;
      ha.r = 6 + (ha.maxR - 6) * yumusakCikis(t);
      if (ha.omur <= 0) halkalar.splice(h, 1);
    }
    for (var t2 = yazilar.length - 1; t2 >= 0; t2--) {
      yazilar[t2].y -= 1.15; yazilar[t2].omur--;
      if (yazilar[t2].omur <= 0) yazilar.splice(t2, 1);
    }
    if (evrimYazi > 0) evrimYazi--;
    if (bolumYazi > 0) bolumYazi--;
    if (kayitYazi > 0) kayitYazi--;
    if (sarsinti > 0.3) sarsinti *= 0.90; else sarsinti = 0;
    if (ekranParlama > 0.004) ekranParlama *= 0.86; else ekranParlama = 0;
  }


  // ===========================================================
  //   ÇİZ
  // ===========================================================
  ctx.save();
  if (sarsinti > 0) {
    ctx.translate((Math.random() - 0.5) * sarsinti, (Math.random() - 0.5) * sarsinti);
    ctx.rotate((Math.random() - 0.5) * sarsinti * 0.0008);
  }

  arkaPlaniCiz();

  if (durum !== "menu") {
    // ışık izleri
    for (var iz = 0; iz < objeler.length; iz++) {
      var ob2 = objeler[iz];
      var izRenk = ob2.tur === "yildiz" ? "#ffe066"
                 : ob2.tur === "saglam" ? (CAN_OBJESI === "et" ? "#e0473f" : "#ffa94d")
                 : ob2.tur === "curuk"  ? "#7d8a5c"
                 : ob2.tur === "hediye" ? "hsl(" + ((sayac * 4) % 360) + ",90%,68%)"
                 : GUCLER[ob2.gucTuru].renk;
      for (var q = 0; q < ob2.iz.length; q++) {
        ctx.globalAlpha = (q / ob2.iz.length) * 0.26;
        ctx.fillStyle = izRenk;
        ctx.beginPath();
        ctx.arc(ob2.iz[q].x, ob2.iz[q].y, OBJE_BOYU * 0.5 * (q / ob2.iz.length), 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // objeler (doğarken zıplayarak büyürler)
    for (var i2 = 0; i2 < objeler.length; i2++) {
      var ob = objeler[i2];
      var olcek = ob.dogum < 14 ? zipla(ob.dogum / 14) : 1;
      ctx.save();
      ctx.translate(ob.x, ob.y);
      ctx.scale(olcek, olcek);
      ctx.translate(-ob.x, -ob.y);
      if (ob.tur === "yildiz")      yildizCiz(ob.x, ob.y, OBJE_BOYU, ob.aci);
      else if (ob.tur === "saglam") { if (CAN_OBJESI === "et") etCiz(ob.x, ob.y, OBJE_BOYU, ob.aci, false);
                                      else dusenKuyrukCiz(ob.x, ob.y, OBJE_BOYU, ob.aci, false); }
      else if (ob.tur === "curuk")  { if (CAN_OBJESI === "et") etCiz(ob.x, ob.y, OBJE_BOYU, ob.aci, true);
                                      else dusenKuyrukCiz(ob.x, ob.y, OBJE_BOYU, ob.aci, true); }
      else if (ob.tur === "hediye") hediyeCiz(ob.x, ob.y, OBJE_BOYU, ob.aci);
      else                          gucCiz(ob.x, ob.y, OBJE_BOYU, ob.gucTuru, ob.aci * 6);
      ctx.restore();
    }

    // yakalama halkaları
    for (var h2 = 0; h2 < halkalar.length; h2++) {
      var hh = halkalar[h2];
      ctx.globalAlpha = Math.max(0, hh.omur / hh.maxOmur) * 0.85;
      ctx.strokeStyle = hh.renk;
      ctx.lineWidth = 3 * (hh.omur / hh.maxOmur) + 0.5;
      ctx.beginPath(); ctx.arc(hh.x, hh.y, hh.r, 0, 6.2832); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // parçacıklar
    for (var j2 = 0; j2 < parcaciklar.length; j2++) {
      var pp = parcaciklar[j2];
      ctx.globalAlpha = Math.min(1, pp.omur / 40);
      ctx.fillStyle = pp.renk;
      ctx.beginPath(); ctx.arc(pp.x, pp.y, pp.boy || 3, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;

    bossCiz();          // boss kedinin arkasında dursun
    taslariCiz();
    atesToplariniCiz();
    dalgalariCiz();
    kediyiCiz();
    toplariCiz();       // çakra topları en üstte
    zincirCiz();

    // uçuşan yazılar
    ctx.textAlign = "center";
    for (var t3 = 0; t3 < yazilar.length; t3++) {
      var yz = yazilar[t3];
      ctx.globalAlpha = Math.min(1, yz.omur / 30);
      ctx.font = "600 " + (yz.boy || 20) + "px " + BASLIK_FONT;
      ctx.fillStyle = yz.renk;
      ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 6;
      ctx.fillText(yz.metin, yz.x, yz.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  vinyetCiz();

  // ekran parlaması (bölüm atlama, evrim)
  if (ekranParlama > 0) {
    ctx.fillStyle = "rgba(255,240,200," + ekranParlama.toFixed(3) + ")";
    ctx.fillRect(-60, -60, GENISLIK + 120, YUKSEKLIK + 120);
  }

  if (durum === "oyun" || durum === "duraklat" || durum === "bitti") bilgileriCiz();
  if (durum === "oyun") bossCanCubuguCiz();
  dokunmaDugmeleriniCiz();
  if (durum === "menu")     menuyuCiz();
  if (durum === "duraklat") duraklatEkraniniCiz();
  if (durum === "bitti")    bittiEkraniniCiz();

  ctx.restore();
  requestAnimationFrame(oyunDongusu);
}

oyunuBaslat();
durum = "menu";     // önce giriş ekranı
oyunDongusu();
</script>

    navigator.serviceWorker.register("sw.js").catch(function (e) {
      console.log("service worker kaydedilemedi (file:// ile açtıysan normal):", e.message);
    });
  });
}
