function tamEkranMi() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function tamEkranDegistir() {
  try {
    if (!tamEkranMi()) {
      var ac = sahne.requestFullscreen || sahne.webkitRequestFullscreen;
      if (ac) ac.call(sahne);
    } else {
      var kapat = document.exitFullscreen || document.webkitExitFullscreen;
      if (kapat) kapat.call(document);
    }
  } catch (e) { /* bazı yerlerde (örneğin çerçeve içinde) izin verilmeyebilir */ }
}

// Tam ekranda oyunu en-boy oranını bozmadan büyüt
function olcuAyarla() {
  if (tamEkranMi()) {
    var olcek = Math.min(window.innerWidth / GENISLIK, window.innerHeight / YUKSEKLIK);
    ekran.style.width  = Math.round(GENISLIK * olcek) + "px";
    ekran.style.height = Math.round(YUKSEKLIK * olcek) + "px";
  } else {
    ekran.style.width = "";
    ekran.style.height = "";
  }
}
document.addEventListener("fullscreenchange", olcuAyarla);
document.addEventListener("webkitfullscreenchange", olcuAyarla);
window.addEventListener("resize", olcuAyarla);

// Farenin oyun içindeki gerçek yeri (ekran büyüyünce de doğru çalışsın)
function fareKonumu(e) {
  var kutu = ekran.getBoundingClientRect();
  return {
    x: (e.clientX - kutu.left) * (GENISLIK / kutu.width),
    y: (e.clientY - kutu.top)  * (YUKSEKLIK / kutu.height)
  };
}


// ===========================================================
//   YUMUŞATMA (easing) — sert geçişleri tatlandırır
// ===========================================================
function yumusakCikis(t) { return 1 - Math.pow(1 - t, 3); }              // hızlı başlar, yavaş biter
function zipla(t) {                                                       // hedefi biraz aşıp geri gelir
  var c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

var sesMotoru = null;
var sesKapali = false;

function sesiUyandir() {
  if (!sesMotoru) {
    try { sesMotoru = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { sesMotoru = null; }
  }
  if (sesMotoru && sesMotoru.state === "suspended") sesMotoru.resume();
}
function ton(frekans, sure, tip, yukseklik, bitisFrekansi, gecikme) {
  if (!sesMotoru || sesKapali) return;
  var t = sesMotoru.currentTime + (gecikme || 0);
  var osc = sesMotoru.createOscillator();
  var kaz = sesMotoru.createGain();
  osc.type = tip || "sine";
  osc.frequency.setValueAtTime(frekans, t);
  if (bitisFrekansi) osc.frequency.exponentialRampToValueAtTime(Math.max(25, bitisFrekansi), t + sure);
  kaz.gain.setValueAtTime(0.0001, t);
  kaz.gain.linearRampToValueAtTime(yukseklik || 0.2, t + 0.012);
  kaz.gain.exponentialRampToValueAtTime(0.0001, t + sure);
  osc.connect(kaz); kaz.connect(sesMotoru.destination);
  osc.start(t); osc.stop(t + sure + 0.03);
}
function hisirti(sure, yukseklik) {
  if (!sesMotoru || sesKapali) return;
  var uzunluk = Math.floor(sesMotoru.sampleRate * sure);
  var tampon = sesMotoru.createBuffer(1, uzunluk, sesMotoru.sampleRate);
  var veri = tampon.getChannelData(0);
  for (var i = 0; i < uzunluk; i++) veri[i] = (Math.random() * 2 - 1) * (1 - i / uzunluk);
  var kaynak = sesMotoru.createBufferSource();
  kaynak.buffer = tampon;
  var kaz = sesMotoru.createGain();
  kaz.gain.value = yukseklik || 0.12;
  kaynak.connect(kaz); kaz.connect(sesMotoru.destination);
  kaynak.start();
}

var tuslar = {};

document.addEventListener("keydown", function (e) {
  tuslar[e.key] = true;
  sesiUyandir();
  // ok tuşları sayfayı kaydırmasın
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.key) >= 0) e.preventDefault();
  if (e.repeat) return;                       // tuşu basılı tutunca tekrarlamasın

  // BOŞLUK: menüde başlat, oyunda duraklat, durakladıysa devam et, bittiyse yeniden
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    if (durum === "menu")          { oyunuBaslat(); sesBolum(); }
    else if (durum === "oyun")     { durum = "duraklat"; sesDurakla(); }
    else if (durum === "duraklat") { durum = "oyun"; sesDevam(); }
    else if (durum === "bitti")    { oyunuBaslat(); }
    return;
  }
  // P de duraklatsın
  if (e.key === "p" || e.key === "P") {
    if (durum === "oyun")          { durum = "duraklat"; sesDurakla(); }
    else if (durum === "duraklat") { durum = "oyun"; sesDevam(); }
  }
  if ((e.key === "r" || e.key === "R") && (durum === "bitti" || durum === "duraklat")) oyunuBaslat();

  // F = tam ekran aç / kapat
  if (e.key === "f" || e.key === "F") tamEkranDegistir();

  // K = havadan düşen can objesini değiştir (kuyruk <-> et)
  if (e.key === "k" || e.key === "K") {
    CAN_OBJESI = (CAN_OBJESI === "kuyruk") ? "et" : "kuyruk";
    if (durum !== "menu") {
      yazilar.push({ x: kedi.x, y: kedi.y - 130, omur: 60,

                     renk: "#ffa94d", boy: 22 });
    }
    ton(700, 0.10, "sine", 0.13, 1000);
  }

  // B = arka planı değiştir (mutfak <-> Naruto)
  if (e.key === "b" || e.key === "B") {
    ARKA_PLAN = (ARKA_PLAN === "mutfak") ? "naruto" : "mutfak";
    kaydet();
    if (durum !== "menu") {
      yazilar.push({ x: kedi.x, y: kedi.y - 130, omur: 60,
                     metin: ARKA_PLAN === "mutfak" ? "MUTFAK" : "NARUTO DÜNYASI",
                     renk: "#ffffff", boy: 22 });
    }
    ton(600, 0.10, "sine", 0.13, 900);
  }

  if (e.key === "m" || e.key === "M") {
    sesKapali = !sesKapali; kaydet();
    if (!sesKapali) ton(800, 0.10, "sine", 0.15);
  }
  // X = çakra topu at,  C = kuyrukları savur  (boss dövüşü)
  if ((e.key === "x" || e.key === "X") && durum === "oyun") cakraTopuAt();
  if ((e.key === "c" || e.key === "C") && durum === "oyun") kuyrukSavur();

  if ((e.key === "g" || e.key === "G") && renkHakki > 0 && durum !== "menu") {
    renkHakki--;
    renkSirasi = (renkSirasi + 1) % RENKLER.length;
    yazilar.push({ x: kedi.x, y: kedi.y - 75, omur: 60, metin: RENKLER[renkSirasi].ad + "!", renk: "#ffffff" });
    halkalar.push({ x: kedi.x, y: kedi.y, r: 10, maxR: 110, omur: 30, maxOmur: 30, renk: RENKLER[renkSirasi].ana });
    kayitliRenk = renkSirasi; kayitliHak = renkHakki;
    sesRenk(); kaydet();
  }
});

function yuvarlakKutu(x, y, g, y2, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, g, y2, r);
}

// Cam gibi yarı saydam panel (modern arayüz görünümü)
function camPanel(x, y, g, yuk, r, kenarRenk) {
  ctx.save();
  ctx.fillStyle = "rgba(16, 12, 40, 0.55)";
  yuvarlakKutu(x, y, g, yuk, r); ctx.fill();
  ctx.strokeStyle = kenarRenk || "rgba(160, 140, 255, 0.28)";
  ctx.lineWidth = 1.5;
  yuvarlakKutu(x + 0.75, y + 0.75, g - 1.5, yuk - 1.5, r); ctx.stroke();
  ctx.restore();
}

// Tam ekran düğmesi: dört köşe parantezi (tam ekrandayken içe döner)
function tamEkranDugmesiniCiz() {
  var b = tamEkranButonu;
  var icerde = tamEkranMi();
  var nabiz = 0.55 + Math.sin(sayac * 0.06) * 0.15;

  camPanel(b.x - 6, b.y - 6, b.boy + 12, b.boy + 12, 12, "rgba(255,215,94," + nabiz.toFixed(2) + ")");

  ctx.save();
  ctx.translate(b.x + b.boy / 2, b.y + b.boy / 2);
  ctx.strokeStyle = "#ffd75e";
  ctx.lineWidth = 2.6;
  ctx.lineCap = "round";
  var d = b.boy * 0.34;      // köşenin merkezden uzaklığı
  var u = b.boy * 0.20;      // parantez kolu uzunluğu

  for (var sx = -1; sx <= 1; sx += 2) {
    for (var sy = -1; sy <= 1; sy += 2) {
      var kx = sx * d, ky = sy * d;
      var yon = icerde ? -1 : 1;   // içerideyse kollar içeri, değilse dışarı baksın
      ctx.beginPath();
      ctx.moveTo(kx + sx * u * yon, ky);
      ctx.lineTo(kx, ky);
      ctx.lineTo(kx, ky + sy * u * yon);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// Tek bir yaprak çiz (Konoha = "yaprak" köyü)
function yaprakCiz(x, y, boy, aci, alfa) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(aci);
  ctx.globalAlpha = alfa;
  ctx.fillStyle = "#2e6b34";
  ctx.beginPath();
  ctx.moveTo(0, -boy);
  ctx.quadraticCurveTo(boy * 0.72, -boy * 0.15, 0, boy);
  ctx.quadraticCurveTo(-boy * 0.72, -boy * 0.15, 0, -boy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#7bbf5a";
  ctx.lineWidth = Math.max(0.6, boy * 0.09);
  ctx.beginPath();
  ctx.moveTo(0, -boy * 0.8); ctx.lineTo(0, boy * 0.8);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function narutoArkaPlani() {
  // ---------- 1) GÜN BATIMI GÖĞÜ ----------
  var gok = ctx.createLinearGradient(0, -60, 0, UFUK);
  gok.addColorStop(0.00, "#1b1743");
  gok.addColorStop(0.34, "#54306a");
  gok.addColorStop(0.62, "#b84a56");
  gok.addColorStop(0.84, "#eb8b46");
  gok.addColorStop(1.00, "#f8c05a");
  ctx.fillStyle = gok;
  ctx.fillRect(-60, -60, GENISLIK + 120, UFUK + 60);

  // ---------- 2) AY ----------
  var ayX = 640, ayY = 118;
  ctx.save();
  var hale = ctx.createRadialGradient(ayX, ayY, 10, ayX, ayY, 130);
  hale.addColorStop(0, "rgba(255,240,200,0.34)");
  hale.addColorStop(1, "rgba(255,220,160,0)");
  ctx.fillStyle = hale;
  ctx.beginPath(); ctx.arc(ayX, ayY, 130, 0, 6.2832); ctx.fill();

  var ayGrad = ctx.createRadialGradient(ayX - 18, ayY - 18, 6, ayX, ayY, 54);
  ayGrad.addColorStop(0, "#fff8e2");
  ayGrad.addColorStop(1, "#f2d79a");
  ctx.fillStyle = ayGrad;
  ctx.beginPath(); ctx.arc(ayX, ayY, 54, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "rgba(190,155,105,0.30)";
  ctx.beginPath(); ctx.arc(ayX - 16, ayY - 8, 11, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(ayX + 14, ayY + 16, 8, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(ayX + 4, ayY - 26, 6, 0, 6.2832); ctx.fill();
  ctx.restore();

  // ---------- 3) MANGA HIZ ÇİZGİLERİ (aksiyon!) ----------
  ctx.save();
  ctx.globalAlpha = 0.10 + Math.sin(sayac * 0.05) * 0.04;
  ctx.strokeStyle = "#ffe4b0";
  for (var hc = 0; hc < 46; hc++) {
    var ha = (hc / 46) * 6.2832 + sayac * 0.0016;
    var icR = 210 + Math.sin(hc * 2.7 + sayac * 0.06) * 45;
    var disR = 620;
    ctx.lineWidth = (hc % 3 === 0) ? 3 : 1.2;
    ctx.beginPath();
    ctx.moveTo(GENISLIK / 2 + Math.cos(ha) * icR, 300 + Math.sin(ha) * icR * 0.72);
    ctx.lineTo(GENISLIK / 2 + Math.cos(ha) * disR, 300 + Math.sin(ha) * disR * 0.72);
    ctx.stroke();
  }
  ctx.restore();

  // ---------- 4) HIZLA AKAN BULUTLAR ----------
  for (var b = 0; b < bulutlar.length; b++) {
    var bl = bulutlar[b];
    bl.x -= bl.hiz;
    if (bl.x + bl.g < -40) { bl.x = GENISLIK + 40; bl.y = 40 + Math.random() * 230; }
    ctx.globalAlpha = bl.alfa;
    ctx.fillStyle = "#ffd9b0";
    ctx.beginPath();
    ctx.ellipse(bl.x, bl.y, bl.g / 2, bl.yuk / 2, 0, 0, 6.2832);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(bl.x + bl.g * 0.22, bl.y - bl.yuk * 0.28, bl.g / 3.4, bl.yuk / 2.6, 0, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---------- 5) ŞİMŞEK / ÇAKRA PATLAMASI ----------
  simsekBekle--;
  if (simsekBekle <= 0) { simsek = 10; simsekBekle = 260 + Math.floor(Math.random() * 460); }
  if (simsek > 0) {
    simsek--;
    ctx.globalAlpha = (simsek / 10) * 0.16;
    ctx.fillStyle = "#fff3d0";
    ctx.fillRect(-60, -60, GENISLIK + 120, UFUK + 60);
    ctx.globalAlpha = 1;
  }

  // ---------- 6) HOKAGE KAYASI (uzak dağ) ----------
  ctx.fillStyle = "#3a2749";
  ctx.beginPath();
  ctx.moveTo(-60, UFUK);
  ctx.lineTo(-60, 372);
  ctx.lineTo(60, 330);
  ctx.lineTo(160, 356);
  ctx.lineTo(250, 316);
  ctx.lineTo(340, 350);
  ctx.lineTo(430, 336);
  ctx.lineTo(520, 366);
  ctx.lineTo(610, 344);
  ctx.lineTo(720, 372);
  ctx.lineTo(GENISLIK + 60, 350);
  ctx.lineTo(GENISLIK + 60, UFUK);
  ctx.closePath();
  ctx.fill();

  // kayaya oyulmuş dört Hokage yüzü (basit siluet)
  for (var yz = 0; yz < 4; yz++) {
    var yx = 96 + yz * 104;
    // ışık alan yüz yüzeyi
    ctx.fillStyle = "#432c52";
    ctx.beginPath();
    ctx.ellipse(yx, 402, 31, 39, 0, 0, 6.2832);
    ctx.fill();
    // sağ tarafta gölge (kayaya oyulmuş hissi)
    ctx.fillStyle = "#34213f";
    ctx.beginPath();
    ctx.ellipse(yx + 7, 404, 25, 37, 0, 0, 6.2832);
    ctx.fill();
    // yüz hatları
    ctx.fillStyle = "#2a1a33";
    ctx.beginPath(); ctx.ellipse(yx - 10, 396, 4.5, 3, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(yx + 10, 396, 4.5, 3, 0, 0, 6.2832); ctx.fill();
    ctx.fillRect(yx - 11, 417, 22, 3.5);
    ctx.fillRect(yx - 14, 384, 11, 3);                     // kaşlar
    ctx.fillRect(yx + 3,  384, 11, 3);
  }

  // ---------- 7) KÖY ÇATILARI ----------
  ctx.fillStyle = "#2a1b38";
  for (var c = 0; c < catilar.length; c++) {
    var ct = catilar[c];
    var tepe = UFUK - ct.yuk;
    ctx.beginPath();
    ctx.moveTo(ct.x - 8, UFUK);
    ctx.lineTo(ct.x - 8, tepe + 9);
    ctx.lineTo(ct.x + ct.g / 2, tepe - 7);                 // sivri ninja çatısı
    ctx.lineTo(ct.x + ct.g + 8, tepe + 9);
    ctx.lineTo(ct.x + ct.g + 8, UFUK);
    ctx.closePath();
    ctx.fill();
    if (ct.isik) {                                        // pencerede yanan lamba
      ctx.fillStyle = "rgba(255,196,88," + (0.55 + Math.sin(sayac * 0.05 + c) * 0.22).toFixed(2) + ")";
      ctx.fillRect(ct.x + ct.g / 2 - 4, tepe + 20, 8, 9);
      ctx.fillStyle = "#2a1b38";
    }
  }

  // ---------- 8) ORMAN ve YER ----------
  ctx.fillStyle = "#1b1026";
  ctx.fillRect(-60, UFUK, GENISLIK + 120, YUKSEKLIK - UFUK + 120);
  ctx.beginPath();
  ctx.moveTo(-60, UFUK + 4);
  for (var ag = 0; ag <= 30; ag++) {
    var agx = -60 + ag * ((GENISLIK + 120) / 30);
    var agy = UFUK - 12 - Math.abs(Math.sin(ag * 1.7)) * 22;
    ctx.lineTo(agx, agy);
    ctx.lineTo(agx + ((GENISLIK + 120) / 60), UFUK + 2);
  }
  ctx.lineTo(GENISLIK + 60, UFUK + 30);
  ctx.lineTo(-60, UFUK + 30);
  ctx.closePath();
  ctx.fill();

  // ---------- 9) UÇUŞAN YAPRAKLAR ----------
  for (var k = 0; k < yaprakKatmanlari.length; k++) {
    var kat = yaprakKatmanlari[k];
    for (var i = 0; i < kat.yapraklar.length; i++) {
      var yp = kat.yapraklar[i];
      yp.x -= kat.ayar.hiz * 1.5;
      yp.y += Math.sin(sayac * 0.03 + yp.salinim) * 0.7 + kat.ayar.hiz * 0.18;
      yp.aci += yp.donus;
      if (yp.x < -25) { yp.x = GENISLIK + 25; yp.y = Math.random() * UFUK; }
      if (yp.y > UFUK + 10) { yp.y = -15; }
      yaprakCiz(yp.x, yp.y, yp.boy, yp.aci, kat.ayar.alfa);
    }
  }
}

    alfa: 0.05 + Math.random() * 0.11,
    renk: Math.random() < 0.5 ? "#5a4a1e" : "#3f3a18"
  });
}

var masaLekeleri = [];
for (var mlk = 0; mlk < 20; mlk++) {
  masaLekeleri.push({
    x: Math.random() * GENISLIK, y: UFUK + 8 + Math.random() * (YUKSEKLIK - UFUK - 10),
    rx: 8 + Math.random() * 34, ry: 4 + Math.random() * 12,
    aci: Math.random() * 3,
    alfa: 0.10 + Math.random() * 0.18,
    renk: Math.random() < 0.4 ? "#4a1f14" : "#2e2410"
  });
}

var kirintilar = [];
for (var kr = 0; kr < 44; kr++) {
  kirintilar.push({
    x: Math.random() * GENISLIK, y: UFUK + 6 + Math.random() * (YUKSEKLIK - UFUK - 8),
    r: 1 + Math.random() * 2.6
  });
}

var sinekler = [];
for (var sn = 0; sn < 8; sn++) {
  sinekler.push({
    mx: 80 + Math.random() * (GENISLIK - 160),
    my: 120 + Math.random() * 380,
    faz: Math.random() * 6.28,
    hiz: 0.035 + Math.random() * 0.045,
    yaricap: 26 + Math.random() * 70
  });
}

var yagDamlalari = [];
for (var yd = 0; yd < 4; yd++) {
  yagDamlalari.push({ x: 120 + Math.random() * (GENISLIK - 240), y: -20, hiz: 0.7 + Math.random() * 1.1 });
}

// Küçük yardımcı: kirli bir tabak
function tabakCiz(x, y, r, aci) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(aci);
  ctx.fillStyle = "#7d7768";
  ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.34, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#95907f";
  ctx.beginPath(); ctx.ellipse(0, -r * 0.05, r * 0.72, r * 0.22, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#5e2a1c";                       // üstünde kalmış yemek
  ctx.beginPath(); ctx.ellipse(-r * 0.16, -r * 0.05, r * 0.26, r * 0.10, 0.4, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r * 0.24, r * 0.02, r * 0.16, r * 0.07, -0.3, 0, 6.2832); ctx.fill();
  ctx.restore();
}

function mutfakArkaPlani() {
  // ---------- 1) YAĞLI DUVAR ----------
  var duvar = ctx.createLinearGradient(0, -60, 0, UFUK);
  duvar.addColorStop(0.00, "#241f10");
  duvar.addColorStop(0.45, "#3d3417");
  duvar.addColorStop(1.00, "#584917");
  ctx.fillStyle = duvar;
  ctx.fillRect(-60, -60, GENISLIK + 120, UFUK + 60);

  // fayans çizgileri
  ctx.strokeStyle = "rgba(0,0,0,0.22)";
  ctx.lineWidth = 2;
  for (var fx = 0; fx <= GENISLIK + 60; fx += 62) {
    ctx.beginPath(); ctx.moveTo(fx, -60); ctx.lineTo(fx, UFUK); ctx.stroke();
  }
  for (var fy = 20; fy < UFUK; fy += 62) {
    ctx.beginPath(); ctx.moveTo(-60, fy); ctx.lineTo(GENISLIK + 60, fy); ctx.stroke();
  }
  // birkaç fayans daha kirli olsun
  for (var tf = 0; tf < 14; tf++) {
    var tfx = ((tf * 7919) % 13) * 62;
    var tfy = 20 + ((tf * 104729) % 8) * 62;
    ctx.fillStyle = "rgba(30,24,8,0.30)";
    ctx.fillRect(tfx, tfy - 62, 62, 62);
  }

  // ---------- 2) YAĞ LEKELERİ ----------
  for (var d = 0; d < duvarLekeleri.length; d++) {
    var lk = duvarLekeleri[d];
    var lg = ctx.createRadialGradient(lk.x, lk.y, 0, lk.x, lk.y, lk.r);
    lg.addColorStop(0, lk.renk);
    lg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = lk.alfa;
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(lk.x, lk.y, lk.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---------- 3) KÖŞELERDE ÖRÜMCEK AĞI ----------
  ctx.strokeStyle = "rgba(220,215,200,0.16)";
  ctx.lineWidth = 1.2;
  for (var ko = -1; ko <= 1; ko += 2) {
    var kox = ko < 0 ? 0 : GENISLIK;
    for (var ip = 1; ip <= 5; ip++) {
      ctx.beginPath();
      ctx.moveTo(kox, 0);
      ctx.lineTo(kox - ko * ip * 21, ip * 21);
      ctx.stroke();
    }
    for (var yay = 1; yay <= 4; yay++) {
      ctx.beginPath();
      ctx.arc(kox, 0, yay * 26, ko < 0 ? 0 : Math.PI * 0.5, ko < 0 ? Math.PI * 0.5 : Math.PI);
      ctx.stroke();
    }
  }

  // ---------- 4) SALLANAN AMPUL ----------
  var salinim = Math.sin(sayac * 0.022) * 0.16;
  var ampulX = GENISLIK * 0.5 + Math.sin(sayac * 0.022) * 34;
  var ampulY = 150;
  ctx.strokeStyle = "#1d1a12"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(GENISLIK * 0.5, -20); ctx.lineTo(ampulX, ampulY); ctx.stroke();

  var isikConu = ctx.createRadialGradient(ampulX, ampulY, 8, ampulX, ampulY, 420);
  isikConu.addColorStop(0, "rgba(255,220,130,0.26)");
  isikConu.addColorStop(0.5, "rgba(255,200,110,0.09)");
  isikConu.addColorStop(1, "rgba(255,190,90,0)");
  ctx.fillStyle = isikConu;
  ctx.beginPath();
  ctx.moveTo(ampulX, ampulY);
  ctx.lineTo(ampulX - 300 + salinim * 200, YUKSEKLIK + 40);
  ctx.lineTo(ampulX + 300 + salinim * 200, YUKSEKLIK + 40);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = "#2a2418";
  ctx.fillRect(ampulX - 7, ampulY - 12, 14, 12);
  var ampulG = ctx.createRadialGradient(ampulX - 4, ampulY + 4, 2, ampulX, ampulY + 6, 17);
  ampulG.addColorStop(0, "#fff4c4");
  ampulG.addColorStop(1, "#e8b93c");
  ctx.fillStyle = ampulG;
  ctx.beginPath(); ctx.arc(ampulX, ampulY + 6, 15, 0, 6.2832); ctx.fill();

  // ---------- 5) DUVARDA ASILI TAVA ve RAF ----------
  ctx.fillStyle = "#241d12";
  ctx.fillRect(60, 236, 210, 11);                                  // raf
  ctx.fillStyle = "#3b3120";
  for (var kv = 0; kv < 3; kv++) {                                 // kavanozlar
    var kvx = 84 + kv * 62;
    ctx.fillRect(kvx, 206, 34, 30);
    ctx.fillStyle = "#57472a";
    ctx.fillRect(kvx + 3, 212, 28, 20);
    ctx.fillStyle = "#241d12";
    ctx.fillRect(kvx + 6, 200, 22, 7);
    ctx.fillStyle = "#3b3120";
  }

  ctx.strokeStyle = "#211a10"; ctx.lineWidth = 8; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(660, 190); ctx.lineTo(660, 232); ctx.stroke();   // tava sapı
  ctx.fillStyle = "#2b2519";
  ctx.beginPath(); ctx.ellipse(660, 258, 42, 30, 0, 0, 6.2832); ctx.fill();     // tava
  ctx.fillStyle = "#443b26";
  ctx.beginPath(); ctx.ellipse(660, 254, 33, 22, 0, 0, 6.2832); ctx.fill();

  // ---------- 6) MASA ----------
  ctx.fillStyle = "#3a2313";
  ctx.fillRect(-60, UFUK, GENISLIK + 120, YUKSEKLIK - UFUK + 120);
  // masanın ön kenarı (kalın tahta)
  var kenar = ctx.createLinearGradient(0, UFUK - 12, 0, UFUK + 8);
  kenar.addColorStop(0, "#8a5a2c");
  kenar.addColorStop(1, "#5a3718");
  ctx.fillStyle = kenar;
  ctx.fillRect(-60, UFUK - 12, GENISLIK + 120, 20);

  // tahta damarları
  ctx.strokeStyle = "rgba(0,0,0,0.20)";
  ctx.lineWidth = 1.4;
  for (var td = 0; td < 7; td++) {
    var tdy = UFUK + 14 + td * 9;
    ctx.beginPath();
    ctx.moveTo(-60, tdy);
    for (var tdx = -60; tdx <= GENISLIK + 60; tdx += 40) {
      ctx.lineTo(tdx, tdy + Math.sin(tdx * 0.03 + td) * 2.2);
    }
    ctx.stroke();
  }
  // bıçak izleri
  ctx.strokeStyle = "rgba(0,0,0,0.34)"; ctx.lineWidth = 2;
  for (var bi2 = 0; bi2 < 9; bi2++) {
    var bx = 40 + bi2 * 88;
    ctx.beginPath();
    ctx.moveTo(bx, UFUK + 12 + (bi2 % 3) * 12);
    ctx.lineTo(bx + 26, UFUK + 16 + (bi2 % 3) * 12);
    ctx.stroke();
  }

  // masadaki lekeler ve kırıntılar
  for (var m = 0; m < masaLekeleri.length; m++) {
    var ml2 = masaLekeleri[m];
    ctx.globalAlpha = ml2.alfa;
    ctx.fillStyle = ml2.renk;
    ctx.beginPath(); ctx.ellipse(ml2.x, ml2.y, ml2.rx, ml2.ry, ml2.aci, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(20,12,4,0.55)";
  for (var kk2 = 0; kk2 < kirintilar.length; kk2++) {
    var kn = kirintilar[kk2];
    ctx.beginPath(); ctx.arc(kn.x, kn.y, kn.r, 0, 6.2832); ctx.fill();
  }

  // ---------- 7) MASADAKİ PİSLİKLER ----------
  // kesme tahtası + satır
  ctx.fillStyle = "#6b4a26";
  yuvarlakKutu(56, UFUK - 4, 130, 34, 5); ctx.fill();
  ctx.fillStyle = "#7d1f14"; ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.ellipse(110, UFUK + 12, 30, 9, 0.2, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#b9bec6";
  ctx.beginPath();
  ctx.moveTo(150, UFUK - 2); ctx.lineTo(206, UFUK - 12);
  ctx.lineTo(210, UFUK + 4); ctx.lineTo(152, UFUK + 10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#2a2118";
  yuvarlakKutu(206, UFUK - 12, 34, 8, 4); ctx.fill();

  // kirli tabaklar
  tabakCiz(300, UFUK + 16, 44, 0);
  tabakCiz(318, UFUK + 8, 36, 0.2);

  // kemikler
  ctx.fillStyle = "#e8e0cb";
  for (var kmk = 0; kmk < 3; kmk++) {
    var kmx = 430 + kmk * 34, kmy = UFUK + 18 + (kmk % 2) * 12;
    ctx.save(); ctx.translate(kmx, kmy); ctx.rotate(0.5 + kmk);
    yuvarlakKutu(-13, -2.5, 26, 5, 2.5); ctx.fill();
    ctx.beginPath(); ctx.arc(-13, -2.5, 3.4, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(-13, 2.5, 3.4, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(13, -2.5, 3.4, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(13, 2.5, 3.4, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // pis paçavra
  ctx.fillStyle = "#5c5340";
  ctx.beginPath();
  ctx.moveTo(690, UFUK + 6);
  ctx.quadraticCurveTo(740, UFUK - 4, 776, UFUK + 14);
  ctx.quadraticCurveTo(740, UFUK + 30, 690, UFUK + 22);
  ctx.closePath(); ctx.fill();

  // ---------- 8) DÜŞEN YAĞ DAMLALARI ----------
  ctx.fillStyle = "rgba(180,150,60,0.5)";
  for (var yd2 = 0; yd2 < yagDamlalari.length; yd2++) {
    var dm = yagDamlalari[yd2];
    dm.y += dm.hiz;
    if (dm.y > UFUK) { dm.y = -20 - Math.random() * 200; dm.x = 80 + Math.random() * (GENISLIK - 160); }
    ctx.beginPath();
    ctx.ellipse(dm.x, dm.y, 2.4, 5.5, 0, 0, 6.2832);
    ctx.fill();
  }

  // ---------- 9) UÇUŞAN SİNEKLER ----------
  for (var s2 = 0; s2 < sinekler.length; s2++) {
    var sk = sinekler[s2];
    sk.faz += sk.hiz;
    var sx2 = sk.mx + Math.cos(sk.faz) * sk.yaricap + Math.sin(sk.faz * 3.7) * 12;
    var sy2 = sk.my + Math.sin(sk.faz * 1.4) * sk.yaricap * 0.55 + Math.cos(sk.faz * 4.3) * 9;
    ctx.fillStyle = "#14110c";
    ctx.beginPath(); ctx.ellipse(sx2, sy2, 3.2, 2.2, sk.faz, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 0.35;                                   // kanatlar
    ctx.fillStyle = "#d8d4c6";
    ctx.beginPath(); ctx.ellipse(sx2 - 2.5, sy2 - 2.2, 3, 1.3, -0.6, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx2 + 2.5, sy2 - 2.2, 3, 1.3, 0.6, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }
}


// Hangi arka plan çizilecek? (B tuşuyla değiştirilir)
function arkaPlaniCiz() {
  if (ARKA_PLAN === "naruto") narutoArkaPlani();
  else mutfakArkaPlani();
}

// Kenarları karartan halka — gözü ortaya çeker
function vinyetCiz() {
  var v = ctx.createRadialGradient(GENISLIK / 2, YUKSEKLIK / 2, YUKSEKLIK * 0.35,
                                   GENISLIK / 2, YUKSEKLIK / 2, YUKSEKLIK * 0.82);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = v;
  ctx.fillRect(-60, -60, GENISLIK + 120, YUKSEKLIK + 120);
}

function yildizCiz(x, y, boyut, aci) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(aci);
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var r = (i % 2 === 0) ? boyut : boyut * 0.45;
    var a = (Math.PI / 5) * i - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath();
  var gr = ctx.createLinearGradient(0, -boyut, 0, boyut);
  gr.addColorStop(0, "#fff6c9"); gr.addColorStop(1, "#ffc93c");
  ctx.shadowColor = "#ffd75e"; ctx.shadowBlur = 20;
  ctx.fillStyle = gr; ctx.fill();
  ctx.restore();
}

function etCiz(x, y, boyut, aci, curuk) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(aci);
  var etRengi  = curuk ? "#7d8a5c" : "#e0473f";
  var etKoyu   = curuk ? "#5c6844" : "#b32b28";
  var yagRengi = curuk ? "#9aa678" : "#ffd9c9";

  ctx.shadowColor = curuk ? "#6b8f3d" : "#ff5a4a"; ctx.shadowBlur = 14;
  var eg = ctx.createLinearGradient(0, -boyut, 0, boyut);
  eg.addColorStop(0, curuk ? "#93a06e" : "#f2635a");
  eg.addColorStop(1, etRengi);
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.ellipse(0, 0, boyut, boyut * 0.72, 0, 0, 6.2832); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = yagRengi; ctx.lineWidth = boyut * 0.22; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(0, 0, boyut * 0.82, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();

  ctx.fillStyle = curuk ? "#c9c2a8" : "#fff4e6";
  yuvarlakKutu(-boyut * 0.12, -boyut * 1.35, boyut * 0.24, boyut * 0.75, boyut * 0.12); ctx.fill();
  ctx.beginPath(); ctx.arc(-boyut * 0.13, -boyut * 1.32, boyut * 0.17, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc( boyut * 0.13, -boyut * 1.32, boyut * 0.17, 0, 6.2832); ctx.fill();

  ctx.fillStyle = etKoyu;
  ctx.beginPath(); ctx.ellipse(-boyut * 0.25, boyut * 0.12, boyut * 0.18, boyut * 0.10, 0.5, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse( boyut * 0.28, -boyut * 0.10, boyut * 0.14, boyut * 0.09, -0.4, 0, 6.2832); ctx.fill();

  if (curuk) {
    ctx.strokeStyle = "#8fd14f"; ctx.globalAlpha = 0.75; ctx.lineWidth = 2;
    for (var k = -1; k <= 1; k++) {
      ctx.beginPath();
      for (var t = 0; t < 12; t++) {
        var yy = -boyut * 1.6 - t * 3;
        var xx = k * boyut * 0.55 + Math.sin(t * 0.9 + sayac * 0.12 + k) * 4;
        if (t === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    var sx = Math.sin(sayac * 0.18) * boyut * 1.1;
    var sy2 = Math.cos(sayac * 0.23) * boyut * 0.6 - boyut * 0.2;
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.arc(sx, sy2, 2.5, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

// Havadan düşen KUYRUK (etin yerine geçti)
//   curuk = false -> sağlam turuncu kuyruk, ucu beyaz  -> +1 kuyruk
//   curuk = true  -> çürümüş yeşil-gri kuyruk, sinekli -> -1 kuyruk
function dusenKuyrukCiz(x, y, boyut, aci, curuk) {
  var b = boyut;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(aci);

  // sağlam kuyruk canlı canlı kıvrılır, çürük kuyruk cansız sarkar
  var oynama = curuk ? Math.sin(sayac * 0.05) * 0.08 : Math.sin(sayac * 0.10) * 0.30;

  // kuyruğun S kıvrımı (kübik eğri): kalın kökten sivri uca
  var p0x = -b * 0.55, p0y =  b * 1.35;
  var k1x =  b * (0.75 + oynama), k1y =  b * 1.15;
  var k2x =  b * (1.85 + oynama * 1.5), k2y = -b * 0.15;
  var p1x =  b * (0.25 - oynama), p1y = -b * 1.75;

  function noktaX(u) { var t = 1 - u;
    return t*t*t*p0x + 3*t*t*u*k1x + 3*t*u*u*k2x + u*u*u*p1x; }
  function noktaY(u) { var t = 1 - u;
    return t*t*t*p0y + 3*t*t*u*k1y + 3*t*u*u*k2y + u*u*u*p1y; }
  function kalinlikBul(u) { return b * (0.46 - 0.40 * u * u) * (curuk ? 0.88 : 1); }

  var adim = 34;

  // 1) koyu kenar çizgisi (kuyruğun sınırı belli olsun)
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = curuk ? "#2f3a20" : "#a4530c";
  for (var a1 = 0; a1 <= adim; a1++) {
    var ua = a1 / adim;
    ctx.beginPath(); ctx.arc(noktaX(ua), noktaY(ua), kalinlikBul(ua) * 1.22 + 1, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 2) yanlara taşan TÜYLER (kuyruğu tüylü gösteren püsküller)
  ctx.shadowColor = curuk ? "#6b8f3d" : "#ffb347";
  ctx.shadowBlur = curuk ? 8 : 16;
  for (var a2 = 2; a2 <= adim - 1; a2++) {
    var u2 = a2 / adim;
    var nx = noktaX(u2), ny = noktaY(u2);
    var tx = noktaX(u2 + 0.02) - nx, ty = noktaY(u2 + 0.02) - ny;
    var uz = Math.sqrt(tx * tx + ty * ty) || 1;
    var dikX = -ty / uz, dikY = tx / uz;              // eğriye dik yön
    var kal = kalinlikBul(u2);
    if (a2 % 2 !== 0) continue;
    var tuyBoy = kal * (curuk ? 0.42 : 0.60) * (0.7 + Math.sin(a2 * 1.7 + sayac * 0.08) * 0.3);
    var uzaklik = kal * 0.85;
    ctx.fillStyle = curuk ? "#6b7a4d" : "#ffb862";
    ctx.beginPath(); ctx.arc(nx + dikX * uzaklik, ny + dikY * uzaklik, tuyBoy, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(nx - dikX * uzaklik, ny - dikY * uzaklik, tuyBoy, 0, 6.2832); ctx.fill();
  }

  // 3) kuyruğun gövdesi
  for (var j = 0; j <= adim; j++) {
    var u = j / adim;
    var kalinlik = kalinlikBul(u);
    if (curuk && (j === 8 || j === 17 || j === 25)) kalinlik *= 0.52;   // tüyü dökülmüş yerler
    if (curuk) {
      ctx.fillStyle = u > 0.82 ? "#b8b49a"
                    : (j % 6 === 0 ? "#4f5a3a" : "#7d8a5c");
    } else {
      ctx.fillStyle = u > 0.80 ? "#fff4e0"                       // tilki kuyruğunun beyaz ucu
                    : (j % 6 === 0 ? "#d9711f" : (u > 0.45 ? "#ffa94d" : "#ef8c33"));
    }
    ctx.beginPath(); ctx.arc(noktaX(u), noktaY(u), kalinlik, 0, 6.2832); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // 4) kuyruğun koptuğu kök: küçük bir tutam
  ctx.fillStyle = curuk ? "#3f4a2e" : "#c2600f";
  ctx.beginPath(); ctx.arc(p0x, p0y, b * 0.22, 0, 6.2832); ctx.fill();

  if (curuk) {
    ctx.strokeStyle = "#8fd14f"; ctx.globalAlpha = 0.7; ctx.lineWidth = 2;
    for (var k = -1; k <= 1; k++) {
      ctx.beginPath();
      for (var t2 = 0; t2 < 10; t2++) {
        var yy = -b * 2.0 - t2 * 3;
        var xx = k * b * 0.5 + Math.sin(t2 * 0.9 + sayac * 0.12 + k) * 4;
        if (t2 === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    var sx3 = Math.sin(sayac * 0.18) * b * 1.3;
    var sy3 = Math.cos(sayac * 0.23) * b * 0.8 - b * 0.2;
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.arc(sx3, sy3, 2.5, 0, 6.2832); ctx.fill();
  } else {
    ctx.globalAlpha = 0.45 + Math.sin(sayac * 0.16) * 0.3;
    ctx.fillStyle = "#fff4e0";
    ctx.beginPath(); ctx.arc(p1x, p1y, b * 0.14, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// Güçlendirme küresi: parlayan top + dönen halka + her gücün kendi simgesi
function gucCiz(x, y, boyut, tur, aci) {
  var g = GUCLER[tur];
  var b = boyut;
  var nabiz = 1 + Math.sin(sayac * 0.14) * 0.08;

  ctx.save();
  ctx.translate(x, y);

  // dışarı taşan parıltı
  var hale = ctx.createRadialGradient(0, 0, b * 0.2, 0, 0, b * 1.9 * nabiz);
  hale.addColorStop(0, g.renk + "aa");
  hale.addColorStop(1, g.renk + "00");
  ctx.fillStyle = hale;
  ctx.beginPath(); ctx.arc(0, 0, b * 1.9 * nabiz, 0, 6.2832); ctx.fill();

  // dönen halka
  ctx.save();
  ctx.rotate(aci);
  ctx.strokeStyle = g.renk; ctx.lineWidth = 2; ctx.globalAlpha = 0.9;
  ctx.setLineDash([b * 0.45, b * 0.35]);
  ctx.beginPath(); ctx.arc(0, 0, b * 1.15, 0, 6.2832); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  ctx.globalAlpha = 1;

  // kürenin kendisi
  ctx.shadowColor = g.renk; ctx.shadowBlur = 18;
  var top = ctx.createRadialGradient(-b * 0.3, -b * 0.35, b * 0.1, 0, 0, b * 0.95);
  top.addColorStop(0, "#ffffff");
  top.addColorStop(0.45, g.renk);
  top.addColorStop(1, "#1a1030");
  ctx.fillStyle = top;
  ctx.beginPath(); ctx.arc(0, 0, b * 0.90, 0, 6.2832); ctx.fill();
  ctx.shadowBlur = 0;

  // ---- simgeler ----
  ctx.strokeStyle = "#ffffff"; ctx.fillStyle = "#ffffff";
  ctx.lineWidth = b * 0.16; ctx.lineCap = "round"; ctx.lineJoin = "round";

  if (tur === "miknatis") {                 // at nalı mıknatıs
    ctx.beginPath();
    ctx.arc(0, b * 0.05, b * 0.38, Math.PI, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-b * 0.38, b * 0.05); ctx.lineTo(-b * 0.38, b * 0.42);
    ctx.moveTo( b * 0.38, b * 0.05); ctx.lineTo( b * 0.38, b * 0.42);
    ctx.stroke();
  }
  else if (tur === "kalkan") {              // kalkan
    ctx.beginPath();
    ctx.moveTo(0, -b * 0.52);
    ctx.lineTo(b * 0.40, -b * 0.28);
    ctx.lineTo(b * 0.40, b * 0.12);
    ctx.quadraticCurveTo(b * 0.36, b * 0.44, 0, b * 0.56);
    ctx.quadraticCurveTo(-b * 0.36, b * 0.44, -b * 0.40, b * 0.12);
    ctx.lineTo(-b * 0.40, -b * 0.28);
    ctx.closePath();
    ctx.fill();
  }
  else if (tur === "yavaslat") {            // saat
    ctx.lineWidth = b * 0.13;
    ctx.beginPath(); ctx.arc(0, 0, b * 0.46, 0, 6.2832); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -b * 0.30);
    ctx.moveTo(0, 0); ctx.lineTo(b * 0.24, b * 0.10);
    ctx.stroke();
  }
  else if (tur === "uclu") {                // ÜÇLÜ ATIŞ: üç ok yelpazesi
    ctx.lineWidth = b * 0.13;
    for (var u = -1; u <= 1; u++) {
      ctx.beginPath();
      ctx.moveTo(u * b * 0.30, b * 0.42);
      ctx.lineTo(u * b * 0.16, -b * 0.42);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(u * b * 0.16, -b * 0.44, b * 0.11, 0, 6.2832);
      ctx.fill();
    }
  }
  else if (tur === "takipci") {             // TAKİPÇİ TOP: nişan halkası
    ctx.lineWidth = b * 0.12;
    ctx.beginPath(); ctx.arc(0, 0, b * 0.42, 0, 6.2832); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, b * 0.14, 0, 6.2832); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-b * 0.60, 0); ctx.lineTo(-b * 0.46, 0);
    ctx.moveTo( b * 0.46, 0); ctx.lineTo( b * 0.60, 0);
    ctx.moveTo(0, -b * 0.60); ctx.lineTo(0, -b * 0.46);
    ctx.moveTo(0,  b * 0.46); ctx.lineTo(0,  b * 0.60);
    ctx.stroke();
  }
  else if (tur === "devKuyruk") {           // DEV KUYRUK: kıvrık kalın kuyruk
    for (var q = 0; q <= 14; q++) {
      var uu = q / 14, tt = 1 - uu;
      var px = tt * tt * (-b * 0.45) + 2 * tt * uu * (b * 0.55) + uu * uu * (b * 0.10);
      var py = tt * tt * (b * 0.52) + 2 * tt * uu * (b * 0.30) + uu * uu * (-b * 0.52);
      ctx.beginPath();
      ctx.arc(px, py, b * (0.20 - 0.13 * uu), 0, 6.2832);
      ctx.fill();
    }
  }
  else if (tur === "zamanDur") {            // ZAMAN DURDU: kar tanesi
    ctx.lineWidth = b * 0.11;
    for (var kt = 0; kt < 6; kt++) {
      var ka = (kt / 6) * 6.2832;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ka) * b * 0.52, Math.sin(ka) * b * 0.52);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(Math.cos(ka) * b * 0.32, Math.sin(ka) * b * 0.32);
      ctx.lineTo(Math.cos(ka + 0.5) * b * 0.46, Math.sin(ka + 0.5) * b * 0.46);
      ctx.stroke();
    }
  }
  else {                                    // çift puan: x2
    ctx.font = "700 " + Math.round(b * 1.0) + "px " + BASLIK_FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("x2", 0, b * 0.04);
    ctx.textBaseline = "alphabetic";
  }

  ctx.restore();
}

// ===========================================================
//   HEDİYE PAKETİ  (senin fikrin!)
//   Havadan düşer, yakalayınca İÇİNDEN ŞANSA BAĞLI bir ödül çıkar.
//   Ödülleri ve şanslarını aşağıdaki HEDIYELER listesinden değiştirebilirsin:
//   sans sayısı büyüdükçe o ödül daha sık çıkar.
// ===========================================================
var HEDIYELER = [
  { ad: "dokuzKuyruk", yazi: "9 KUYRUK!",     renk: "#ffd84d", sans: 2 },
  { ad: "ikiKuyruk",   yazi: "+2 KUYRUK",     renk: "#ffc94d", sans: 4 },
  { ad: "buyukPuan",   yazi: "+15 PUAN",      renk: "#ffe066", sans: 4 },
  { ad: "gucler",      yazi: "",              renk: "#ff8ae2", sans: 4 },
  { ad: "hepsiBirden", yazi: "HEPSİ BİRDEN!", renk: "#ff5ec4", sans: 1 }
];

function hediyeCiz(x, y, boyut, aci) {
  var b = boyut;
  var renk = "hsl(" + ((sayac * 4) % 360) + ",85%,62%)";   // gökkuşağı gibi renk değiştirir
  var hopla = Math.sin(sayac * 0.12) * b * 0.10;

  ctx.save();
  ctx.translate(x, y + hopla);
  ctx.rotate(Math.sin(aci) * 0.25);

  var hale = ctx.createRadialGradient(0, 0, b * 0.2, 0, 0, b * 2.0);
  hale.addColorStop(0, "rgba(255,255,255,0.35)");
  hale.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = hale;
  ctx.beginPath(); ctx.arc(0, 0, b * 2.0, 0, 6.2832); ctx.fill();

  ctx.shadowColor = renk; ctx.shadowBlur = 18;
  var gov = ctx.createLinearGradient(0, -b * 0.6, 0, b * 0.95);
  gov.addColorStop(0, renk);
  gov.addColorStop(1, "#7b3fa0");
  ctx.fillStyle = gov;
  yuvarlakKutu(-b * 0.85, -b * 0.55, b * 1.70, b * 1.45, b * 0.16); ctx.fill();

  ctx.fillStyle = "#ffffff";
  yuvarlakKutu(-b * 0.98, -b * 0.80, b * 1.96, b * 0.45, b * 0.12); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = "#ffe066";
  ctx.fillRect(-b * 0.16, -b * 0.55, b * 0.32, b * 1.45);
  ctx.fillRect(-b * 0.98, -b * 0.74, b * 1.96, b * 0.32);

  ctx.fillStyle = "#ffd84d";
  ctx.beginPath(); ctx.ellipse(-b * 0.34, -b * 1.02, b * 0.30, b * 0.20, -0.5, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse( b * 0.34, -b * 1.02, b * 0.30, b * 0.20,  0.5, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#ffe9a8";
  ctx.beginPath(); ctx.arc(0, -b * 1.00, b * 0.16, 0, 6.2832); ctx.fill();

  for (var p = 0; p < 3; p++) {
    var pa = sayac * 0.05 + p * 2.1;
    ctx.globalAlpha = 0.5 + Math.sin(sayac * 0.15 + p) * 0.4;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(Math.cos(pa) * b * 1.5, Math.sin(pa) * b * 1.3, b * 0.10, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// Puan eklerken bölüm / renk hakkı / rekor kontrolleri de yapılsın

  puan += miktar;

  if (puan >= sonrakiRenkPuani) {
    renkHakki++; sonrakiRenkPuani += RENK_PUANI; kayitliHak = renkHakki;

  var yb = 1 + Math.floor(puan / BOLUM_PUANI);
  if (yb > bolum) {
    bolum = yb; bolumYazi = 100; sesBolum();
    ekranParlama = 0.32; sarsinti = 9 * SARSINTI_GUCU;
    if (bolum > enYuksekBolum) { enYuksekBolum = bolum; kaydet(); }

}
